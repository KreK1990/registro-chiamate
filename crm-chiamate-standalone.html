<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registro Chiamate</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#00487E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Registro">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&family=Fira+Sans+Condensed:wght@600;700;800&family=Fira+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#EEEEEE; --panel:#FFFFFF; --border:#D3DBE5; --border-strong:#BEC8DA; --text:#1A1A1A; --muted:#5F6B77;
  --accent:#00487E; --accent-soft:#E3E9F1; --on-accent:#FFFFFF; --brand-yellow:#DC9D00; --danger:#B3261E;
  --serif:"Fira Sans Condensed","Arial Narrow",sans-serif;
  --sans:"Fira Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"Fira Mono",ui-monospace,monospace;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1822; --panel:#14222F; --border:#27394B; --border-strong:#34506A; --text:#E6ECF2; --muted:#98A8B8;
    --accent:#7DB2E3; --accent-soft:#1B3246; --on-accent:#0D1822; --danger:#F08C80;
  }
  :root:not([data-theme="light"]) .followup.due{background:#3E1F1C;}
}
:root[data-theme="dark"]{
  --bg:#0D1822; --panel:#14222F; --border:#27394B; --border-strong:#34506A; --text:#E6ECF2; --muted:#98A8B8;
  --accent:#7DB2E3; --accent-soft:#1B3246; --on-accent:#0D1822; --danger:#F08C80;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);height:100%;-webkit-font-smoothing:antialiased;}
html,body{height:100%;}
.layout{display:flex;flex-direction:column;height:100vh;height:100dvh;}
.app{display:flex;flex:1;min-height:0;}
.bottom-cal{flex-shrink:0;border-top:1px solid var(--border);background:var(--panel);padding:9px 26px 11px;max-height:30vh;overflow-y:auto;}
.sidebar{width:320px;min-width:260px;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--panel);}
.main{flex:1;overflow-y:auto;padding:28px 32px;}
.sidebar-head{padding:20px 18px 14px;border-bottom:1px solid var(--border);}
.sidebar-head h1{font-family:var(--serif);font-weight:700;font-size:23px;letter-spacing:.2px;margin:0 0 2px;color:var(--text);}
.brand-sub{font-size:11.5px;color:var(--muted);letter-spacing:.3px;margin:0 0 14px;}
input,textarea,select{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:5px;background:var(--bg);color:var(--text);font-size:14px;font-family:var(--sans);transition:border-color .15s;}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);}
textarea{resize:vertical;min-height:60px;}
.btn{cursor:pointer;border:1px solid var(--text);border-radius:5px;padding:9px 15px;font-size:13.5px;font-weight:500;font-family:var(--sans);background:var(--text);color:var(--bg);letter-spacing:.1px;transition:opacity .15s;}
.btn:hover{opacity:.85;}
.btn.secondary{background:transparent;color:var(--text);border-color:var(--border);}
.btn.small{padding:6px 11px;font-size:12.5px;}
.btn.block{width:100%;margin-top:8px;}
.contact-list{overflow-y:auto;flex:1;}
.contact-item{padding:12px 18px;border-bottom:1px solid var(--border);cursor:pointer;border-left:3px solid transparent;transition:background .1s,border-color .1s;}
.contact-item:hover{background:var(--accent-soft);}
.contact-item.active{background:var(--accent-soft);border-left-color:var(--accent);}
.contact-item .name{font-weight:600;font-size:14px;}
.contact-item .sub{font-size:12px;color:var(--muted);margin-top:2px;}
.empty{color:var(--muted);padding:16px;font-size:14px;font-style:italic;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:20px;margin-bottom:18px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px;letter-spacing:.2px;}
h2{font-family:var(--serif);font-weight:700;margin:0 0 4px;font-size:24px;}
h3{font-family:var(--serif);font-weight:700;font-size:18px;margin:0 0 12px;color:var(--accent);}
.call-item{border-left:2px solid var(--accent);padding:8px 0 8px 12px;margin-bottom:10px;}
.call-item .date{font-size:12px;color:var(--muted);font-family:var(--mono);}
.call-item .esito{display:inline-block;font-size:11px;font-weight:500;padding:2px 8px;border-radius:4px;background:var(--accent-soft);color:var(--accent);margin-left:6px;}
.call-item .note{font-size:14px;margin-top:4px;white-space:pre-wrap;}
.top-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-bottom:12px;}
.followup{display:inline-block;font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:4px;margin-top:8px;border:1px solid transparent;}
.followup.ok{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);}
.followup.due{background:#F8E1DF;color:var(--danger);border-color:var(--danger);}
:root[data-theme="dark"] .followup.due{background:#3E1F1C;}
.custom-row{margin-top:6px;}
.nav{display:flex;flex-wrap:wrap;gap:4px;padding:2px 18px 0;border-bottom:1px solid var(--border);}
.nav button{flex:1 1 30%;padding:10px 4px;border:none;border-bottom:2px solid transparent;background:transparent;color:var(--muted);font-size:12px;font-family:var(--sans);cursor:pointer;font-weight:500;letter-spacing:.1px;margin-bottom:-1px;transition:color .15s,border-color .15s;white-space:nowrap;}
.nav button{position:relative;}
.nav-badge{position:absolute;top:2px;right:4px;min-width:15px;height:15px;padding:0 3px;border-radius:999px;background:var(--danger);color:#fff;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1;font-family:var(--sans);}
.nav button:hover{color:var(--text);}
.nav button.active{color:var(--accent);border-bottom-color:var(--accent);}
.day-group{margin-bottom:24px;}
.day-title{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--text);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border);}
table.calls-table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);border-radius:6px;overflow:hidden;}
table.calls-table th,table.calls-table td{text-align:left;padding:9px 12px;font-size:13px;border-bottom:1px solid var(--border);}
table.calls-table th{color:var(--muted);font-weight:600;background:var(--accent-soft);font-size:11.5px;letter-spacing:.2px;}
table.calls-table tr:last-child td{border-bottom:none;}
table.calls-table tbody tr[data-call-id]:hover{background:var(--accent-soft);}
.table-wrap{overflow-x:auto;}
.subnav{display:flex;gap:8px;margin-bottom:16px;}
.subnav button{padding:6px 13px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12.5px;font-family:var(--sans);cursor:pointer;font-weight:500;}
.subnav button.active{background:var(--text);color:var(--bg);border-color:var(--text);}
.week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;}
.week-nav .week-label{font-family:var(--serif);font-size:16px;}
.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:6px;overflow:hidden;min-width:918px;}
.calendar-day{background:var(--panel);padding:10px;min-height:130px;}
.calendar-day-head{font-size:11.5px;color:var(--muted);margin-bottom:8px;font-weight:600;letter-spacing:.2px;}
.calendar-day-head.today{color:var(--accent);}
.appt-chip{background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:5px 7px;font-size:12px;margin-bottom:5px;cursor:pointer;line-height:1.35;}
.appt-chip .t{font-family:var(--mono);font-weight:500;}
.appt-chip:hover{opacity:.8;}
.bar-clickable:hover{fill:color-mix(in srgb, var(--accent) 8%, transparent);}
.sidebar-today{flex:1;overflow-y:auto;padding:16px;border-top:1px solid var(--border);min-height:0;}
.sidebar-today-title{font-family:var(--serif);font-size:15px;margin-bottom:2px;}
.sidebar-today-date{font-size:11px;color:var(--muted);margin-bottom:14px;}
.mini-section-label{font-size:10px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase;margin:14px 0 6px;}
.mini-section-label:first-of-type{margin-top:0;}
.mini-row{font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--border);cursor:pointer;line-height:1.4;}
.mini-row:hover{color:var(--accent);}
.mini-row:last-of-type{border-bottom:none;}
.mini-time{font-family:var(--mono);color:var(--accent);margin-right:4px;}
.mini-empty{font-size:11.5px;color:var(--muted);font-style:italic;padding:2px 0;}
.addr-link{color:var(--accent);text-decoration:none;}
.addr-link:hover{text-decoration:underline;}
.tel-link{white-space:nowrap;font-weight:500;}
.map-embed{margin-top:12px;height:240px;border:1px solid var(--border);border-radius:2px;overflow:hidden;background:var(--accent-soft);}
.map-embed iframe{display:block;width:100%;height:100%;border:0;}
.ac-wrap{position:relative;}
.ac-list{position:absolute;left:0;right:0;top:100%;z-index:30;background:var(--panel);border:1px solid var(--border-strong);border-top:none;max-height:260px;overflow-y:auto;box-shadow:0 6px 16px rgba(0,0,0,.12);}
.ac-item{padding:9px 11px;cursor:pointer;border-top:1px solid var(--border);}
.ac-item:first-child{border-top:none;}
.ac-item:hover{background:var(--accent-soft);}
.ac-name{font-weight:600;font-size:14px;color:var(--accent);}
.ac-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.imp-map{display:grid;grid-template-columns:minmax(150px,230px) 1fr;gap:8px 12px;align-items:center;}
.funnel-row{display:grid;grid-template-columns:minmax(150px,210px) 1fr 90px;grid-template-areas:"label track num" ". note .";gap:2px 12px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--border);cursor:pointer;}
.funnel-row:last-child{border-bottom:none;}
.funnel-row:hover{background:var(--accent-soft);}
.funnel-label{grid-area:label;font-size:14px;font-weight:600;}
.funnel-track{grid-area:track;height:20px;background:var(--bg);border-radius:2px;overflow:hidden;}
.funnel-bar{height:100%;border-radius:2px;}
.funnel-num{grid-area:num;text-align:right;font-size:13px;color:var(--muted);white-space:nowrap;}
.funnel-num strong{font-size:17px;color:var(--text);}
.funnel-note{grid-area:note;font-size:12px;color:var(--muted);}
.proj-code{font-family:var(--mono);font-size:12.5px;color:var(--muted);letter-spacing:.5px;}
.fc-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.fc-tile{background:var(--panel);border:1px solid var(--border);border-radius:2px;padding:12px 14px;}
.fc-tile:nth-child(2){border-top:3px solid var(--brand-yellow);}
.fc-label{font-size:12px;color:var(--muted);}
.fc-value{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--accent);margin-top:2px;}
.fc-note{font-size:11.5px;color:var(--muted);margin-top:2px;}
.fc-q-row{display:grid;grid-template-columns:minmax(170px,230px) 1fr auto;gap:4px 12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);}
.fc-q-row:last-child{border-bottom:none;}
.fc-q-label{font-size:13.5px;font-weight:600;}
.fc-q-label span{font-weight:400;color:var(--muted);font-size:12px;margin-left:4px;}
.fc-q-track{height:16px;background:var(--bg);border-radius:2px;overflow:hidden;}
.fc-q-bar{height:100%;background:var(--accent);}
.fc-q-num{text-align:right;white-space:nowrap;font-size:13px;}
.fc-q-num span{display:block;font-size:11.5px;color:var(--muted);}
.fc-row .fc-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
.fc-row .proj-code{margin-right:6px;}
.fc-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 14px;align-items:end;}
.fc-amount{font-size:15px;font-weight:600;padding:8px 0;}
.fc-weighted{color:var(--accent);}
.fc-sugg{font-size:10.5px;color:var(--brand-yellow);font-weight:600;text-transform:uppercase;letter-spacing:.3px;}
.phase-badge{display:inline-block;padding:3px 9px;border-radius:2px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600;white-space:nowrap;}
.phase-badge.done,.phase-badge.won{background:var(--accent);color:var(--on-accent);}
.phase-badge.lost{background:var(--border);color:var(--muted);}
.card.proj-won{border-left:4px solid var(--brand-yellow);background:color-mix(in srgb, var(--brand-yellow) 9%, var(--panel));}
.card.proj-lost{opacity:.55;filter:grayscale(1);}
.card.proj-lost:hover{opacity:.8;}
tr.proj-lost td{opacity:.5;}
tr.proj-won td{background:color-mix(in srgb, var(--brand-yellow) 12%, transparent);}
tr.proj-won td:first-child{box-shadow:inset 4px 0 0 var(--brand-yellow);}
.proj-state-banner{font-size:14px;}
.proj-state-banner.lost{background:var(--bg);border-color:var(--border-strong);color:var(--muted);}
.proj-state-banner.won{border-left:4px solid var(--brand-yellow);background:color-mix(in srgb, var(--brand-yellow) 12%, var(--panel));}
.timeline{list-style:none;margin:0;padding:0;}
.timeline li{display:grid;grid-template-columns:22px 1fr auto;grid-template-areas:"dot text date" ". extra extra";gap:4px 10px;align-items:center;padding:9px 0;position:relative;}
.timeline li::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:2px;background:var(--border);}
.timeline li:first-child::before{top:50%;}
.timeline li:last-child::before{bottom:50%;}
.timeline .dot{grid-area:dot;width:14px;height:14px;border-radius:50%;border:2px solid var(--border-strong);background:var(--panel);justify-self:center;position:relative;z-index:1;}
.timeline li.done .dot{background:var(--accent);border-color:var(--accent);}
.timeline li.planned .dot{border-color:var(--brand-yellow);}
.timeline .ph-label{font-weight:600;font-size:14px;}
.timeline li:not(.done):not(.planned) .ph-label{color:var(--muted);font-weight:500;}
.timeline .ph-owner{font-size:12px;color:var(--muted);}
.timeline .ph-date{grid-area:date;display:flex;gap:6px;align-items:center;}
.timeline .ph-date input{width:auto;}
.timeline .ph-extra{grid-area:extra;background:var(--bg);padding:8px 10px;border-radius:2px;}
.part-row{display:grid;grid-template-columns:1fr 230px auto;grid-template-areas:"contact role del";gap:8px;margin-bottom:8px;}
.part-row .part-contact{grid-area:contact;}
.part-row .part-role{grid-area:role;}
.part-row .part-del{grid-area:del;}
.part-item{border-bottom:1px solid var(--border);padding:9px 0;}
.part-item:last-child{border-bottom:none;}
.part-item summary{list-style:none;cursor:pointer;}
.part-item summary::-webkit-details-marker{display:none;}
.part-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13.5px;}
.part-toggle{font-size:12.5px;color:var(--accent);margin-top:5px;font-weight:600;}
.part-toggle::before{content:"\25B8  ";}
details[open] > summary .part-toggle::before{content:"\25BE  ";}
.part-history{margin:8px 0 2px 4px;border-left:2px solid var(--border);padding-left:12px;}
.hist-item{padding:8px 6px;border-bottom:1px dashed var(--border);cursor:pointer;}
.hist-item:last-child{border-bottom:none;}
.hist-item:hover{background:var(--accent-soft);}
.hist-item.linked{box-shadow:inset 3px 0 0 var(--brand-yellow);padding-left:10px;}
.hist-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;}
.hist-date{font-family:var(--mono);font-size:12px;color:var(--muted);}
.hist-tag{font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:1px 6px;border-radius:2px;}
.hist-note{font-size:13.5px;white-space:pre-wrap;margin-top:3px;}
.hist-sub{font-size:12.5px;color:var(--muted);margin-top:2px;}
.hist-meet{margin-top:6px;padding-left:10px;border-left:2px solid var(--accent-soft);}
.order-summary{background:var(--bg);padding:10px 12px;border-radius:2px;margin-bottom:8px;font-size:13.5px;}
.order-track{height:8px;background:var(--panel);border:1px solid var(--border);border-radius:2px;overflow:hidden;margin:6px 0 4px;}
.order-bar{height:100%;background:var(--brand-yellow);}
.order-note{font-size:12.5px;color:var(--muted);}
.order-note.extra{color:var(--accent);font-weight:600;}
.order-item{display:grid;grid-template-columns:1fr auto;grid-template-areas:"main actions" "sub actions";gap:2px 12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);}
.order-item:last-of-type{border-bottom:none;}
.order-main{grid-area:main;}
.order-amount{font-size:15px;font-weight:700;margin-right:6px;}
.order-meta{font-size:12.5px;color:var(--muted);}
.order-sub{grid-area:sub;font-size:12.5px;color:var(--muted);}
.order-done{color:var(--accent);font-weight:600;}
.order-actions{grid-area:actions;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;}
.order-form{background:var(--bg);padding:10px 12px;border-radius:2px;margin:8px 0;}
.appt-search{display:flex;gap:8px;align-items:center;margin:0 0 14px;}
.appt-search input{flex:1;}


.imp-map label{margin:0;font-size:13px;color:var(--text);}
.name-link{cursor:pointer;color:var(--accent);}
.name-link:hover,[data-contact-id]:hover .name-link{text-decoration:underline;}
.tag-pill{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:500;margin:4px 4px 0 0;}
.esito-tag{display:inline-block;padding:2px 9px;border-radius:4px;font-size:12px;font-weight:500;}
.esito-tag.appt{background:var(--accent);color:var(--panel);font-weight:600;}
table.calls-table tbody tr.row-appt{background:color-mix(in srgb, var(--accent-soft) 55%, transparent);}
table.calls-table tbody tr.row-appt:hover{background:var(--accent-soft);}
.bottom-cal-inner{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap;}
.bottom-cal-left{flex:0 0 auto;}
.bottom-cal-right{flex:1 1 220px;min-width:200px;max-width:320px;border-left:1px solid var(--border);padding-left:24px;}
.bottom-cal-right h4{font-family:var(--serif);font-weight:700;font-size:14.5px;margin:0 0 10px;}
.month-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;max-width:640px;}
.month-header .label{font-family:var(--serif);font-size:14.5px;min-width:150px;text-align:center;}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:6px;overflow:hidden;max-width:640px;}
.month-grid .dow{background:var(--accent-soft);color:var(--muted);font-size:9.5px;font-weight:600;text-align:center;padding:2px 0;letter-spacing:.3px;}
.month-cell{background:var(--panel);min-height:27px;padding:2px 5px;}
.month-cell.other-month{opacity:.35;}
.month-cell.today .daynum{color:var(--accent);font-weight:700;}
.month-cell.has-appt{cursor:pointer;}
.month-cell.has-appt:hover{background:var(--accent-soft);}
.month-cell.selected{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent);}
.month-cell .daynum{font-size:10.5px;line-height:1.2;}
.month-cell .dots{display:flex;gap:2px;margin-top:1px;flex-wrap:wrap;}
.month-cell .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);}
.day-appts-strip{display:flex;flex-direction:column;gap:6px;}
.day-appt-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 10px;background:var(--bg);border:1px solid var(--border);border-radius:5px;font-size:13px;cursor:pointer;}
.day-appt-row:hover{background:var(--accent-soft);}

<script>
let db=null, contacts=[], calls=[], selectedId=null, view='agenda', sortField='cognome', callStep='pick', confirmDeleteId=null, tableDetailCallId=null, clearFollowUpOnEntry=false, apptSubView='list', apptWeekOffset=0, footerCalDate=new Date(), footerSelectedDay=null, editingCallId=null, confirmDeleteCallId=null, dashboardDrilldown=null, dashboardSubView='weekly', tableFilters={search:'',esito:'',professione:''}, contactsSearchQuery=''; // view: agenda|contactsList|new|detail|table|call|followup|appt|dashboard

function showGate(html){
  document.getElementById('layoutRoot').classList.add('hidden');
  const g = document.getElementById('gateScreen');
  g.classList.remove('hidden');
  g.innerHTML = `<div class="gate">${html}</div>`;
}

function hideGate(){
  document.getElementById('gateScreen').classList.add('hidden');
  document.getElementById('layoutRoot').classList.remove('hidden');
}

function renderConfigGate(err){
  showGate(`
    <h2>Configurazione</h2>
    <p>Incolla qui sotto la configurazione del tuo progetto Firebase (da Console Firebase → Impostazioni progetto → Le tue app → SDK setup and configuration → oggetto "firebaseConfig"). Va fatto una sola volta per dispositivo/browser.</p>
    <textarea id="cfgInput" placeholder='{"apiKey":"...","authDomain":"...","projectId":"...", ...}'></textarea>
    <button class="btn block" id="cfgSaveBtn">Salva e continua</button>
    ${err?`<div class="err">${esc(err)}</div>`:''}
  `);
  document.getElementById('cfgSaveBtn').addEventListener('click', ()=>{
    const raw = document.getElementById('cfgInput').value.trim();
    try{
      const cfg = JSON.parse(raw);
      if(!cfg.apiKey || !cfg.projectId) throw new Error('Config incompleta');
      localStorage.setItem('firebaseConfig', JSON.stringify(cfg));
      boot();
    }catch(e){ renderConfigGate('Configurazione non valida: incolla l\'oggetto JSON completo copiato da Firebase.'); }
  });
}

function renderLoginGate(err, info, emailValue){
  showGate(`
    <h2>Accedi</h2>
    <p>Accedi con l'email e la password del tuo account.</p>
    <label>Email</label><input id="loginEmail" type="email" autocomplete="username" value="${esc(emailValue||'')}">
    <div style="margin-top:10px;"></div>
    <label>Password</label><input id="loginPass" type="password" autocomplete="current-password">
    <button class="btn block" id="loginBtn" style="margin-top:14px;">Accedi</button>
    ${err?`<div class="err">${esc(err)}</div>`:''}
    ${info?`<div class="ok">${esc(info)}</div>`:''}
    <div class="link-row"><a href="#" id="resetPassLink" style="color:var(--accent);">Password dimenticata?</a></div>
    ${FIREBASE_CONFIG?'':`<p style="margin-top:18px;font-size:12px;">Configurazione errata? <a href="#" id="resetCfgLink" style="color:var(--accent);">Cambia progetto Firebase</a></p>`}
  `);
  const doLogin = async ()=>{
    const email = document.getElementById('loginEmail').value.trim();
    const pass = document.getElementById('loginPass').value;
    try{ await firebase.auth().signInWithEmailAndPassword(email, pass); }
    catch(e){ renderLoginGate('Accesso non riuscito: email o password non corrette.', '', email); }
  };
  document.getElementById('loginBtn').addEventListener('click', doLogin);
  document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  document.getElementById('resetPassLink').addEventListener('click', async (e)=>{
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    if(!email){ renderLoginGate('Scrivi prima la tua email nel campo qui sopra.'); return; }
    try{ await firebase.auth().sendPasswordResetEmail(email); }catch(err){}
    // Messaggio neutro: non rivela se l'email esiste tra gli account.
    renderLoginGate('', 'Se l\'email corrisponde a un account, riceverai a breve un messaggio per reimpostare la password (controlla anche lo spam).', email);
  });
  document.getElementById('resetCfgLink')?.addEventListener('click', (e)=>{ e.preventDefault(); localStorage.removeItem('firebaseConfig'); renderConfigGate(); });
}

// Configurazione del progetto Firebase (non è un segreto: la protezione dei dati è
// affidata al login e alle regole di Firestore). Se è impostata qui, i colleghi non
// devono incollare nulla al primo accesso; se è null si usa quella salvata nel browser.
const FIREBASE_CONFIG = {"apiKey":"AIzaSyBOA1oZUMLONDDAddWQ5P3tWEZz5GLdmWI","authDomain":"registro-chiamate.firebaseapp.com","projectId":"registro-chiamate","storageBucket":"registro-chiamate.firebasestorage.app","messagingSenderId":"457672432964","appId":"1:457672432964:web:574fbc366261aa3f0acb11"};

// Ogni utente legge e scrive solo nel proprio archivio: users/<uid>/contacts e
// users/<uid>/calls (le regole di Firestore impediscono l'accesso a quello degli altri).
function firestoreAdapter(uid){
  const fs = firebase.firestore();
  const base = fs.collection('users').doc(uid);
  return {
    collection(path){ return base.collection(path); },
    doc(path){ return fs.doc(`users/${uid}/${path}`); }
  };
}

function boot(){
  let cfg = FIREBASE_CONFIG;
  if(!cfg){
    const raw = localStorage.getItem('firebaseConfig');
    if(!raw){ renderConfigGate(); return; }
    try{ cfg = JSON.parse(raw); }catch(e){ localStorage.removeItem('firebaseConfig'); renderConfigGate(); return; }
  }
  try{
    if(!firebase.apps.length) firebase.initializeApp(cfg);
  }catch(e){ renderConfigGate('Errore di inizializzazione: '+(e.message||'')); return; }
  firebase.auth().onAuthStateChanged(user=>{
    if(!user){ stopListeners(); resetSession(); renderLoginGate(); return; }
    hideGate();
    document.getElementById('userLine').textContent = user.email || '';
    startApp(user.uid);
    checkLegacyMigration(user.uid);
  });
}

// All'uscita non deve restare nulla dei dati dell'utente precedente.
function resetSession(){
  contacts = []; calls = []; projects = []; selectedProjectId = null; db = null;
  selectedId = null; view = 'agenda'; callStep = 'pick'; tableDetailCallId = null; editingCallId = null;
  confirmDeleteId = null; confirmDeleteCallId = null; dashboardDrilldown = null; contactsSearchQuery = '';

function showNotice(html){
  const n = document.getElementById('noticeBar');
  n.innerHTML = html;
  n.classList.remove('hidden');
  document.getElementById('noticeClose')?.addEventListener('click', hideNotice);
}
function hideNotice(){
  const n = document.getElementById('noticeBar');
  n.classList.add('hidden');
  n.innerHTML = '';
}

// Importazione dall'archivio condiviso della versione mono-utente (collezioni
// "contacts" e "calls" alla radice). Si propone solo se l'archivio personale è
// vuoto e quello vecchio è leggibile; la copia mantiene gli stessi ID dei documenti
// (così le chiamate restano collegate ai contatti) e non modifica l'originale.
async function checkLegacyMigration(uid){
  const fs = firebase.firestore();
  let legacyC, legacyK;
  try{
    const mine = await fs.collection('users').doc(uid).collection('contacts').limit(1).get();
    if(!mine.empty) return;
    [legacyC, legacyK] = await Promise.all([fs.collection('contacts').get(), fs.collection('calls').get()]);
  }catch(e){ return; } // archivio vecchio non accessibile (regole): niente da importare
  if(legacyC.empty && legacyK.empty) return;
  showNotice(`<strong>Archivio precedente trovato:</strong> ${legacyC.size} contatti e ${legacyK.size} chiamate.
    <div class="notice-hint">Vuoi copiarli nel tuo archivio personale? L'archivio precedente non viene modificato né cancellato.</div>
    <div class="notice-actions"><button class="btn small" id="migrateBtn">Copia nel mio archivio</button><button class="btn secondary small" id="noticeClose">Non ora</button></div>`);
  document.getElementById('migrateBtn').addEventListener('click', ()=>migrateLegacy(uid, legacyC, legacyK));
}
async function migrateLegacy(uid, legacyC, legacyK){
  const fs = firebase.firestore();
  const base = fs.collection('users').doc(uid);
  showNotice('Copia in corso, non chiudere l\'app…');
  try{
    const ops = [];
    legacyC.forEach(d=>ops.push([base.collection('contacts').doc(d.id), d.data()]));
    legacyK.forEach(d=>ops.push([base.collection('calls').doc(d.id), d.data()]));
    for(let i=0; i<ops.length; i+=400){
      const batch = fs.batch();
      ops.slice(i, i+400).forEach(([ref, data])=>batch.set(ref, data));
      await batch.commit();
    }
    const [c2, k2] = await Promise.all([base.collection('contacts').get(), base.collection('calls').get()]);
    if(c2.size >= legacyC.size && k2.size >= legacyK.size){
      showNotice(`<strong>Copia completata:</strong> ${c2.size} contatti e ${k2.size} chiamate sono ora nel tuo archivio personale.
        <div class="notice-actions"><button class="btn small" id="noticeClose">Chiudi</button></div>`);
    }else{
      showNotice(`<strong>Copia incompleta:</strong> ${c2.size} contatti su ${legacyC.size} e ${k2.size} chiamate su ${legacyK.size}.
        <div class="notice-actions"><button class="btn small" id="migrateRetryBtn">Riprova</button></div>`);
      document.getElementById('migrateRetryBtn').addEventListener('click', ()=>migrateLegacy(uid, legacyC, legacyK));
    }
  }catch(e){
    showNotice(`<strong>Errore durante la copia</strong> (${esc(e.code||e.message||'')}). Nessun dato è stato perso: l'archivio precedente è intatto.
      <div class="notice-actions"><button class="btn small" id="migrateRetryBtn">Riprova</button></div>`);
    document.getElementById('migrateRetryBtn').addEventListener('click', ()=>migrateLegacy(uid, legacyC, legacyK));
  }
}

// Link al feed calendario personale: il token è salvato in users/<uid>.calendarToken
// e la function "calendar" lo usa per trovare l'utente.
function randomToken(){
  return Array.from(crypto.getRandomValues(new Uint8Array(24))).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function showCalendarLink(regenerate){
  const user = firebase.auth().currentUser;
  if(!user) return;
  const ref = firebase.firestore().collection('users').doc(user.uid);
  showNotice('Preparazione del link…');
  try{
    let token = (await ref.get()).data()?.calendarToken;
    if(!token || regenerate){
      token = randomToken();
      await ref.set({ calendarToken: token, email: user.email||'' }, { merge: true });
    }
    const url = `${location.origin}/.netlify/functions/calendar?token=${token}`;
    showNotice(`<strong>Il tuo calendario personale</strong>
      <div class="notice-hint">Aggiungilo come calendario in abbonamento (iPhone: Impostazioni → Calendario → Account → Aggiungi account → Altro → Aggiungi calendario in abbonamento). Non condividerlo: chi ha il link vede i tuoi appuntamenti.</div>
      <input id="calLinkInput" readonly value="${esc(url)}">
      <div class="notice-actions">
        <button class="btn small" id="calCopyBtn">Copia link</button>
        <button class="btn secondary small" id="calRegenBtn">Genera nuovo link</button>
        <button class="btn secondary small" id="noticeClose">Chiudi</button>
      </div>`);
    const input = document.getElementById('calLinkInput');
    input.addEventListener('focus', ()=>input.select());
    document.getElementById('calCopyBtn').addEventListener('click', async (e)=>{
      try{ await navigator.clipboard.writeText(url); e.target.textContent = 'Copiato'; }
      catch(err){ input.focus(); input.select(); }
    });
    const regen = document.getElementById('calRegenBtn');
    regen.addEventListener('click', ()=>{
      if(regen.dataset.confirm){ showCalendarLink(true); return; }
      regen.dataset.confirm = '1';
      regen.textContent = 'Conferma: il link attuale smetterà di funzionare';
    });
  }catch(e){
    showNotice(`Impossibile preparare il link del calendario (${esc(e.code||e.message||'')}).
      <div class="notice-actions"><button class="btn secondary small" id="noticeClose">Chiudi</button></div>`);
  }
}

let unsubscribers = [];
function stopListeners(){ unsubscribers.forEach(u=>{ try{ u(); }catch(e){} }); unsubscribers = []; }
function showDataError(err){
  const code = (err && (err.code||err.message)) || '';
  const hint = code==='permission-denied'
    ? 'Accesso negato dalle regole di Firestore: prova a uscire e rientrare.'
    : 'Controlla la connessione e ricarica la pagina.';
  document.getElementById('main').innerHTML = `<div class="empty">Impossibile leggere i dati (${esc(code)}). ${hint}</div>`;
}

function startApp(uid){
  stopListeners();
  db = firestoreAdapter(uid);
  renderFooter();
  renderSidebarToday();
  unsubscribers.push(db.collection('contacts').onSnapshot(snap=>{
    contacts = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(canAutoRender()) renderMain();
    renderFooter();
    renderSidebarToday();
    updateNavBadges();
  }, showDataError));
  unsubscribers.push(db.collection('calls').onSnapshot(snap=>{
    calls = snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>(b.data||'').localeCompare(a.data||''));
    if(canAutoRender()) renderMain();
    renderFooter();
    renderSidebarToday();
  }, showDataError));
  unsubscribers.push(db.collection('projects').onSnapshot(onProjectsSnapshot, showDataError));
}

function init(){ boot(); }

function contactsListView(){
  const q = contactsSearchQuery.trim().toLowerCase();
  const filtered = contacts.filter(c=>!q || (c.nome||'').toLowerCase().includes(q) || (c.cognome||'').toLowerCase().includes(q) || (c.azienda||'').toLowerCase().includes(q) || (c.telefono||'').includes(q) || (c.cellulare||'').includes(q) || (c.tag||'').toLowerCase().includes(q));
  filtered.sort((a,b)=>{
    const ka = (sortField==='cognome' ? (a.cognome||a.nome||'') : (a.nome||''));
    const kb = (sortField==='cognome' ? (b.cognome||b.nome||'') : (b.nome||''));
    return ka.localeCompare(kb);
  });
  const toolbar = `<div class="card" style="padding:14px 16px;">
    <div class="field-row" style="grid-template-columns:2fr 1fr;">
      <div><label>Cerca</label><input id="contactsSearch" value="${esc(contactsSearchQuery)}" placeholder="Nome, cognome, azienda, tag..."></div>

    </div>
  </div>`;
  const listHtml = filtered.length===0 ? '<div class="empty">Nessun contatto trovato.</div>' : filtered.map(c=>{
    const n = calls.filter(k=>k.contactId===c.id).length;
    const fu = followUpBadge(c.followUp);

        ${c.tag?`<div style="margin-top:4px;">${tagPills(c.tag)}</div>`:''}

async function deleteContact(c){
  try{
    const related = calls.filter(k=>k.contactId===c.id);
    for(const k of related){ await db.collection('calls').doc(k.id).delete(); }
    await db.collection('contacts').doc(c.id).delete();
    confirmDeleteId=null; selectedId=null; view='contactsList'; renderMain();
  }catch(e){ alert('Errore durante l\'eliminazione: '+(e.message||e.code||'')); }
}

function renderSidebarToday(){
  const el = document.getElementById('sidebarToday');
  if(!el) return;
  const now = new Date();
  const todayStr = now.toDateString();
  const byId = Object.fromEntries(contacts.map(c=>[c.id,c]));
  const dayNames=['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
  const monthNames=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
  const dateLabel = `${dayNames[now.getDay()]} ${now.getDate()} ${monthNames[now.getMonth()]}`;
  const todayAppts = apptCalls().filter(k=> new Date(k.appuntamento).toDateString()===todayStr).sort((a,b)=>a.appuntamento.localeCompare(b.appuntamento));
  const dueFU = contacts.filter(c=>c.followUp && new Date(c.followUp)<=now);
  const todayFU = contacts.filter(c=>c.followUp && new Date(c.followUp)>now && new Date(c.followUp).toDateString()===todayStr);
  const fuList = [...dueFU, ...todayFU].sort((a,b)=>a.followUp.localeCompare(b.followUp));

  const apptHtml = todayAppts.length ? todayAppts.map(k=>{
    const c = byId[k.contactId]||{};
    const t = new Date(k.appuntamento);
    const hh=String(t.getHours()).padStart(2,'0'), mm=String(t.getMinutes()).padStart(2,'0');
    return `<div class="mini-row" data-appt-call-id="${k.id}"><span class="mini-time">${hh}:${mm}</span>${esc(fullName(c))}</div>`;
  }).join('') : '<div class="mini-empty">Nessun appuntamento</div>';

  const fuHtml = fuList.length ? fuList.map(c=>{
    const due = new Date(c.followUp)<=now;
    const fuDate = new Date(c.followUp);
    const dtLabel = `${String(fuDate.getDate()).padStart(2,'0')}/${String(fuDate.getMonth()+1).padStart(2,'0')} ${String(fuDate.getHours()).padStart(2,'0')}:${String(fuDate.getMinutes()).padStart(2,'0')}`;
    return `<div class="mini-row" data-fu-id="${c.id}" style="display:flex;justify-content:space-between;align-items:center;gap:8px;"><span>${esc(fullName(c))}</span><span class="mini-time">${due?'<span style="color:var(--danger);">● </span>':''}${dtLabel}</span></div>`;
  }).join('') : '<div class="mini-empty">Nessun follow-up</div>';

  el.innerHTML = `
    <div class="sidebar-today-title">Oggi</div>
    <div class="sidebar-today-date">${dateLabel}</div>
    <div class="mini-section-label">Appuntamenti (${todayAppts.length})</div>
    ${apptHtml}
    <div class="mini-section-label">Follow-up (${fuList.length})</div>
    ${fuHtml}
    ${(()=>{ const mg = pendingMailGroups(); return mg.length ? `<div class="mini-section-label">Mail da inviare (${mg.length})</div>${mg.map(g=>`<div class="mini-row" data-mail-contact-id="${g.contactId}">${esc(fullName(g.contact))}</div>`).join('')}` : ''; })()}
  `;
  el.querySelectorAll('[data-appt-call-id]').forEach(row=>{
    row.addEventListener('click', ()=>{ tableDetailCallId=row.dataset.apptCallId; renderMain(); });
  });
  el.querySelectorAll('[data-mail-contact-id]').forEach(row=>{
    row.addEventListener('click', ()=>{
      selectedId=row.dataset.mailContactId; view='detail'; confirmDeleteId=null; tableDetailCallId=null;
      setActiveTab('navContacts');
      renderMain();
    });
  });
  updateNavBadges();
  el.querySelectorAll('[data-fu-id]').forEach(row=>{
    row.addEventListener('click', ()=>{
      selectedId=row.dataset.fuId; clearFollowUpOnEntry=true; view='call'; callStep='entry';
      setActiveTab('navCall');
      renderMain();
    });
  });

const PROFESSIONI = ['Ingegnere','Geometra','Architetto','Avvocato','Notaio','Commercialista','Consulente','Altro'];
function renderFooter(){
  const el = document.getElementById('bottomCal');
  if(!el) return;
  const y = footerCalDate.getFullYear(), m = footerCalDate.getMonth();
  const monthNames = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
  const dow = ['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
  const first = new Date(y,m,1);
  const startOffset = (first.getDay()+6)%7;
  const daysInMonth = new Date(y,m+1,0).getDate();
  const prevDaysInMonth = new Date(y,m,0).getDate();
  const cells = [];
  for(let i=0;i<startOffset;i++){ const dnum=prevDaysInMonth-startOffset+i+1; cells.push({d:dnum, other:true, dateObj:new Date(y,m-1,dnum)}); }
  for(let d=1; d<=daysInMonth; d++){ cells.push({d, other:false, dateObj:new Date(y,m,d)}); }
  let nextD=1;
  while(cells.length<42){ cells.push({d:nextD, other:true, dateObj:new Date(y,m+1,nextD)}); nextD++; }
  const todayStr = new Date().toDateString();
  const list = apptCalls();
  const byDateCount = {};
  list.forEach(k=>{ const ds = new Date(k.appuntamento).toDateString(); byDateCount[ds]=(byDateCount[ds]||0)+1; });
  const grid = cells.map(c=>{
    const ds = c.dateObj.toDateString();
    const count = byDateCount[ds]||0;
    return `<div class="month-cell ${c.other?'other-month':''} ${ds===todayStr?'today':''} ${count?'has-appt':''} ${footerSelectedDay===ds?'selected':''}" data-daystr="${ds}">
      <div class="daynum">${c.d}</div>
      ${count?`<div class="dots">${Array.from({length:Math.min(count,4)}).map(()=>'<span class="dot"></span>').join('')}</div>`:''}
    </div>`;
  }).join('');
  const byId = Object.fromEntries(contacts.map(c=>[c.id,c]));
  const dayList = footerSelectedDay ? list.filter(k=>new Date(k.appuntamento).toDateString()===footerSelectedDay) : [];
  el.innerHTML = `
    <div class="bottom-cal-inner">
      <div class="bottom-cal-left">
        <div class="month-header">
          <button class="btn secondary small" id="monthPrevBtn">←</button>
          <div class="label">${monthNames[m]} ${y}</div>
          <button class="btn secondary small" id="monthNextBtn">→</button>
        </div>
        <div class="month-grid">
          ${dow.map(d=>`<div class="dow">${d}</div>`).join('')}
          ${grid}
        </div>
      </div>
      ${footerSelectedDay ? `<div class="bottom-cal-right">
        <h4>${fmtLongDate(footerSelectedDay)}</h4>
        <div class="day-appts-strip">
          ${dayList.length? dayList.map(k=>{ const c=byId[k.contactId]||{}; const t=new Date(k.appuntamento); const hh=String(t.getHours()).padStart(2,'0'),mm=String(t.getMinutes()).padStart(2,'0');
            return `<div class="day-appt-row" data-appt-call-id="${k.id}" style="flex-direction:column;align-items:stretch;">
          <span>${hh}:${mm} — ${esc(fullName(c))}${k.progetto?' · '+esc(k.progetto):''}</span>
          ${fullAddress(c)?`<a href="${mapsUrl(c)}" target="_blank" rel="noopener" class="addr-link" onclick="event.stopPropagation()" style="font-size:11.5px;">${esc(fullAddress(c))} · Indicazioni</a>`:''}
        </div>`;
          }).join('') : `<div class="empty" style="padding:0;">Nessun appuntamento in questo giorno.</div>`}
        </div>
      </div>` : ''}
    </div>`;
  document.getElementById('monthPrevBtn').addEventListener('click', ()=>{ footerCalDate=new Date(y,m-1,1); footerSelectedDay=null; renderFooter(); });
  document.getElementById('monthNextBtn').addEventListener('click', ()=>{ footerCalDate=new Date(y,m+1,1); footerSelectedDay=null; renderFooter(); });
  el.querySelectorAll('.month-cell.has-appt').forEach(cell=>{
    cell.addEventListener('click', ()=>{ footerSelectedDay = footerSelectedDay===cell.dataset.daystr ? null : cell.dataset.daystr; renderFooter(); });
  });
  el.querySelectorAll('[data-appt-call-id]').forEach(row=>{
    row.addEventListener('click', ()=>{ tableDetailCallId=row.dataset.apptCallId; renderMain(); });
  });
}

// Forecast: solo commesse aperte (ne' perse ne' con ordine confermato). Valore
// ponderato = importo offerta x probabilita' di chiusura. Campi sul progetto:
// probabilita (0-100; se assente si usa quella suggerita per la fase) e
// chiusuraPrevista ('YYYY-MM', facoltativa).
// ---------------------------------------------------------------------------
const FORECAST_DEFAULT_PROB = { none:10, richiesta:10, elaborati:20, propostaTecnica:30, offertaEconomica:40, offertaPresentata:50 };
let forecastSort = 'id';   // id | weighted | close
function forecastProb(p){
  if(p.probabilita!==undefined && p.probabilita!==null && p.probabilita!=='') return { value:Number(p.probabilita), suggested:false };
  const ph = projectPhase(p);
  return { value: FORECAST_DEFAULT_PROB[ph ? ph.key : 'none'] ?? 50, suggested:true };
}
function forecastWeighted(p){ const v = Number(p.importoOfferta); return isFinite(v) && p.importoOfferta!=null ? v * forecastProb(p).value / 100 : 0; }
function openForecastProjects(){ return projects.filter(p=>!isLost(p) && !isWon(p)); }
function quarterKey(ym){ if(!ym) return ''; const y = ym.slice(0,4), m = +ym.slice(5,7); return `${y}-Q${Math.ceil(m/3)}`; }
function quarterLabel(k){ return k ? `${k.slice(6)}° trimestre ${k.slice(0,4)}` : 'Senza data di chiusura'; }
function monthLabel(ym){ return ym ? `${MONTHS_LONG[+ym.slice(5,7)-1]} ${ym.slice(0,4)}` : ''; }

function forecastSummaryHtml(){
  const open = openForecastProjects();
  const year = String(new Date().getFullYear());
  const offerte = open.reduce((s,p)=>s+(Number(p.importoOfferta)||0), 0);
  const ponderato = open.reduce((s,p)=>s+forecastWeighted(p), 0);
  const confermato = projects.filter(p=>isWon(p) && (p.fasi.confermaOrdine||'').startsWith(year)).reduce((s,p)=>s+(Number(projectAmount(p))||0), 0);
  const ponderatoAnno = open.filter(p=>(p.chiusuraPrevista||'').startsWith(year)).reduce((s,p)=>s+forecastWeighted(p), 0);
  const senzaImporto = open.filter(p=>p.importoOfferta==null || p.importoOfferta==='').length;
  const tile = (label, value, note)=>`<div class="fc-tile"><div class="fc-label">${label}</div><div class="fc-value">${value}</div>${note ? `<div class="fc-note">${note}</div>` : ''}</div>`;
  return `<div class="fc-tiles">
      ${tile('Commesse aperte', String(open.length), `offerte per ${fmtEuro(offerte)}`)}
      ${tile('Forecast ponderato', fmtEuro(ponderato), offerte ? `${Math.round(ponderato*100/offerte)}% del valore in offerta` : '')}
      ${tile(`Confermato nel ${year}`, fmtEuro(confermato), 'ordini già chiusi')}
      ${tile(`Stima ${year}`, fmtEuro(confermato + ponderatoAnno), `confermato + forecast con chiusura prevista nel ${year}`)}
    </div>
    ${senzaImporto ? `<div style="font-size:12.5px;color:var(--danger);margin-top:8px;">${senzaImporto} ${senzaImporto===1 ? 'commessa aperta non ha' : 'commesse aperte non hanno'} l'importo dell'offerta: non ${senzaImporto===1 ? 'entra' : 'entrano'} nel forecast.</div>` : ''}`;
}
function forecastQuartersHtml(){
  const groups = new Map();
  openForecastProjects().forEach(p=>{
    const k = quarterKey(p.chiusuraPrevista||'');
    const g = groups.get(k) || { n:0, offerta:0, ponderato:0 };
    g.n++; g.offerta += Number(p.importoOfferta)||0; g.ponderato += forecastWeighted(p);
    groups.set(k, g);
  });
  const keys = [...groups.keys()].sort((a,b)=>(a===''?1:0)-(b===''?1:0) || a.localeCompare(b));
  if(!keys.length) return '<div class="empty">Nessuna commessa aperta.</div>';
  const max = Math.max(1, ...keys.map(k=>groups.get(k).ponderato));
  return keys.map(k=>{ const g = groups.get(k); return `<div class="fc-q-row">
      <div class="fc-q-label">${quarterLabel(k)} <span>${g.n} ${g.n===1?'commessa':'commesse'}</span></div>
      <div class="fc-q-track"><div class="fc-q-bar" style="width:${Math.max(1, Math.round(g.ponderato*100/max))}%;"></div></div>
      <div class="fc-q-num"><strong>${fmtEuro(g.ponderato)}</strong><span>su ${fmtEuro(g.offerta)}</span></div>
    </div>`; }).join('');
}
function forecastRowsHtml(){
  const list = openForecastProjects().sort((a,b)=>{
    if(forecastSort==='weighted') return forecastWeighted(b) - forecastWeighted(a) || byProjectId(a,b);
    if(forecastSort==='close') return ((a.chiusuraPrevista||'9999')).localeCompare(b.chiusuraPrevista||'9999') || byProjectId(a,b);
    return byProjectId(a,b);
  });
  if(!list.length) return '<div class="empty">Nessuna commessa aperta: quando crei un progetto compare qui.</div>';
  return list.map(p=>{
    const pr = forecastProb(p);
    return `<div class="card fc-row" data-fc-project="${p.id}">
      <div class="fc-head">
        <div style="min-width:0;"><span class="proj-code">${esc(p.codice||'')}</span>
          <span class="name-link" data-open-project="${p.id}" style="font-weight:600;">${esc(p.nome || 'Progetto senza nome')}</span>
          ${p.citta ? `<span style="color:var(--muted);font-size:12.5px;"> · ${esc(p.citta)}</span>` : ''}</div>
        ${phaseBadge(p)}
      </div>
      <div class="fc-grid">
        <div><label>Offerta</label><div class="fc-amount">${fmtEuro(p.importoOfferta)}</div></div>
        <div><label>Probabilità${pr.suggested ? ' <span class="fc-sugg">suggerita</span>' : ''}</label>
          <div style="display:flex;align-items:center;gap:4px;"><input type="number" class="fc-prob" min="0" max="100" step="5" inputmode="numeric" value="${pr.value}" style="max-width:84px;"> %</div></div>
        <div><label>Ponderato</label><div class="fc-amount fc-weighted">${p.importoOfferta!=null ? fmtEuro(forecastWeighted(p)) : '—'}</div></div>
        <div><label>Chiusura prevista</label><input type="month" class="fc-close" value="${esc(p.chiusuraPrevista||'')}" style="max-width:170px;"></div>
      </div>
    </div>`;
  }).join('');
}
function forecastView(){
  return `<h2 style="margin-bottom:6px;">Forecast</h2>
    <div style="font-size:13px;color:var(--muted);margin-bottom:14px;">Commesse aperte con la probabilità di chiusura che stimi: il valore ponderato (offerta × probabilità) dà un obiettivo verosimile su ciò che oggi è in corso.</div>
    <div id="fcSummary">${forecastSummaryHtml()}</div>
    <div class="card" style="margin-top:14px;">
      <h3>Forecast per periodo di chiusura prevista</h3>
      <div id="fcQuarters">${forecastQuartersHtml()}</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 10px;">
      <label style="margin:0;font-size:13px;color:var(--muted);">Ordina per</label>
      <select id="fcSort" style="width:auto;">
        <option value="id" ${forecastSort==='id'?'selected':''}>ID progetto</option>
        <option value="weighted" ${forecastSort==='weighted'?'selected':''}>Valore ponderato</option>
        <option value="close" ${forecastSort==='close'?'selected':''}>Chiusura prevista</option>
      </select>
    </div>
    <div id="fcRows">${forecastRowsHtml()}</div>`;
}
// Aggiorna riepilogo, trimestri e valore ponderato della riga senza ridisegnare i campi.
function refreshForecastFigures(p){
  const s = document.getElementById('fcSummary'); if(s) s.innerHTML = forecastSummaryHtml();
  const q = document.getElementById('fcQuarters'); if(q) q.innerHTML = forecastQuartersHtml();
  const row = document.querySelector(`#fcRows [data-fc-project="${p.id}"]`);
  if(row){
    row.querySelector('.fc-weighted').textContent = p.importoOfferta!=null ? fmtEuro(forecastWeighted(p)) : '—';
    const sugg = row.querySelector('.fc-sugg'); if(sugg && !forecastProb(p).suggested) sugg.remove();
  }
}
function bindForecast(){
  document.getElementById('fcSort').addEventListener('change', e=>{ forecastSort = e.target.value; renderMain(); });
  document.querySelectorAll('#fcRows [data-open-project]').forEach(el=>el.addEventListener('click', ()=>openProject(el.dataset.openProject)));
  const fail = e=>alert('Errore nel salvataggio: '+(e.message||e.code||''));
  document.querySelectorAll('#fcRows [data-fc-project]').forEach(row=>{
    const p = projects.find(x=>x.id===row.dataset.fcProject);
    if(!p) return;
    // Probabilita': si salva all'uscita dal campo (o con Invio), tra 0 e 100.
    const prob = row.querySelector('.fc-prob');
    const saveProb = ()=>{
      const n = Math.round(Number(prob.value));
      if(prob.value==='' || !isFinite(n) || n<0 || n>100){ prob.value = forecastProb(p).value; return; }
      if(!forecastProb(p).suggested && n===Number(p.probabilita)) return;
      prob.value = n; p.probabilita = n; refreshForecastFigures(p);
      db.collection('projects').doc(p.id).update({ probabilita:n, updatedAt:Date.now() }).catch(fail);
    };
    prob.addEventListener('change', saveProb);
    prob.addEventListener('keydown', e=>{ if(e.key==='Enter') prob.blur(); });
    // Chiusura prevista (mese): stesso criterio delle date della timeline, anno 2000-2100.
    const close = row.querySelector('.fc-close');
    const saveClose = ()=>{
      const v = close.value;
      if(v===(p.chiusuraPrevista||'')) return;
      if(v && !(/^\d{4}-\d{2}$/.test(v) && +v.slice(0,4)>=2000 && +v.slice(0,4)<=2100)){ close.value = p.chiusuraPrevista||''; return; }
      p.chiusuraPrevista = v; refreshForecastFigures(p);
      db.collection('projects').doc(p.id).update({ chiusuraPrevista:v, updatedAt:Date.now() }).catch(fail);
    };
    close.addEventListener('blur', saveClose);
    close.addEventListener('change', ()=>{ if(document.activeElement!==close) saveClose(); });
  });
}

// ---------------------------------------------------------------------------
// Progetti (sezione tecnica). Collection "projects": codice (ID progetto, 7 cifre,
// unico), nome, via, citta, partecipanti [{contactId, ruolo}], importoOfferta,
// importoDeliberato (confermato alla conferma d'ordine), offertaUrl (link al PDF),
// note, fasi {chiave fase: 'YYYY-MM-DD'}, createdAt, updatedAt; commessa persa:
// esito 'persa', persaIl, motivoPerdita, notePerdita.
// Le chiamate con appuntamento possono indicare progetti (calls.progetti) e la
// consegna dell'offerta (calls.consegnaOfferta), che segna la fase offertaPresentata.
// ---------------------------------------------------------------------------
// Ordini (consegne) del progetto: ordini [{id, data, numero, importo, consegna, note}].
let projects = [], selectedProjectId = null, projectsSearch = '', projectsPhaseFilter = 'open', confirmDeleteProjectId = null, loseFormProjectId = null;
let orderEdit = null, confirmDeleteOrderId = null;   // orderEdit = { projectId, id: 'new' | id ordine }
const LOSS_REASONS = ['Prezzo','Scelta di un concorrente','Progetto annullato o sospeso','Soluzione tecnica diversa','Nessuna risposta del cliente','Altro'];
const PROJECT_PHASES = [
  { key:'richiesta',         label:'Richiesta' },
  { key:'elaborati',         label:'Elaborati ricevuti' },
  { key:'propostaTecnica',   label:'Proposta tecnica', owner:'Michael' },
  { key:'offertaEconomica',  label:'Offerta economica', owner:'Claudia' },
  { key:'offertaPresentata', label:'Offerta presentata' },
  { key:'confermaOrdine',    label:'Conferma d\'ordine' },
  { key:'merceCantiere',     label:'Merce arrivata in cantiere' },
  { key:'cantiereFinito',    label:'Cantiere finito' }
];
const PROJECT_ROLES = ['Progettazione architettonica','Progettazione strutturale','Termotecnico','Impresa esecutrice','Committente','Direzione lavori','Altro'];

// Gli aggiornamenti in tempo reale non ridisegnano i moduli mentre si scrive.
// Nel Forecast non si ridisegna mentre si sta scrivendo in un campo (le cifre si aggiornano a parte).
function canAutoRender(){
  const typing = document.activeElement && document.activeElement.matches && document.activeElement.matches('#main input');
  return view!=='new' && view!=='projectForm' && !(view==='call' && callStep==='entry') && !(view==='forecast' && typing)
    && !(view==='projectDetail' && (orderEdit || loseFormProjectId));
}
function onProjectsSnapshot(snap){
  projects = snap.docs.map(d=>({ id:d.id, ...d.data() }));
  if(canAutoRender()) renderMain();
}
// Una fase conta come raggiunta solo se la sua data e' oggi o passata (le date future sono "previste").
function phaseDone(p, key){ const d = p.fasi && p.fasi[key]; return !!d && d <= todayISO(); }
function projectPhase(p){ let cur = null; PROJECT_PHASES.forEach(ph=>{ if(phaseDone(p, ph.key)) cur = ph; }); return cur; }
function projectTitle(p){ return p.nome ? `${p.codice} · ${p.nome}` : (p.codice||''); }
function orderedTotal(p){ return (p.ordini||[]).reduce((s,o)=>s+(Number(o.importo)||0), 0); }
function projectOrders(p){ return (p.ordini||[]).slice().sort((a,b)=>(a.data||'').localeCompare(b.data||'') || (a.consegna||'').localeCompare(b.consegna||'')); }
// Valore della commessa: offerta finche' non e' confermata; poi il deliberato (o l'offerta),
// oppure il totale ordinato se con gli ordini (materiale aggiunto) lo supera.
function projectAmount(p){
  if(!phaseDone(p, 'confermaOrdine')) return p.importoOfferta;
  const base = p.importoDeliberato!=null ? p.importoDeliberato : p.importoOfferta;
  const ord = orderedTotal(p);
  return ord > (Number(base)||0) ? ord : base;
}
function fmtEuro(v){ return (v===null || v===undefined || v==='' || isNaN(v)) ? '—' : new Intl.NumberFormat('it-IT', { style:'currency', currency:'EUR', useGrouping:'always' }).format(v); }
function fmtNum(v){ return (v===null || v===undefined || v==='' || isNaN(v)) ? '' : new Intl.NumberFormat('it-IT', { minimumFractionDigits:2, maximumFractionDigits:2, useGrouping:'always' }).format(v); }
// "12.345,67" / "12345.67" / "12.345" / "€ 1.200" -> numero; '' -> null; testo non valido -> NaN
function parseEuro(s){
  s = String(s||'').replace(/[€\s]/g,'');
  if(!s) return null;
  if(s.includes(',')) s = s.replace(/\./g,'').replace(',', '.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,'');
  const n = Number(s);
  return isFinite(n) ? Math.round(n*100)/100 : NaN;
}
// Ordine delle commesse: per ID crescente (il piu' vecchio in alto, i piu' recenti sotto).
function byProjectId(a, b){ return String(a.codice||'').localeCompare(String(b.codice||''), undefined, { numeric:true }); }
function projectsOfContact(contactId){ return projects.filter(p=>(p.partecipanti||[]).some(x=>x.contactId===contactId)).sort(byProjectId); }
// Commessa persa (chiusa) / chiusa con ordine confermato / in corso.
function isLost(p){ return p.esito==='persa'; }
function isWon(p){ return !isLost(p) && phaseDone(p, 'confermaOrdine'); }
function projectStateClass(p){ return isLost(p) ? 'proj-lost' : isWon(p) ? 'proj-won' : ''; }
function phaseBadge(p){
  if(isLost(p)) return '<span class="phase-badge lost">Persa</span>';
  const ph = projectPhase(p);
  return `<span class="phase-badge ${isWon(p) ? 'won' : ''}">${ph ? esc(ph.label) : 'Da avviare'}</span>`;
}
function guessRole(c){
  const pr = normName(c.professione);
  return pr==='architetto' ? 'Progettazione architettonica' : pr==='ingegnere' ? 'Progettazione strutturale' : pr==='termotecnico' ? 'Termotecnico' : '';
}
function openProject(id){ selectedProjectId = id; confirmDeleteProjectId = null; loseFormProjectId = null; orderEdit = null; confirmDeleteOrderId = null; tableDetailCallId = null; view = 'projectDetail'; setActiveTab('navProjects'); renderMain(); }

// ---- elenco progetti ----
function projectsListHtml(){
  const q = normName(projectsSearch);
  const byId = Object.fromEntries(contacts.map(c=>[c.id,c]));
  const f = projectsPhaseFilter;
  const list = projects.filter(p=>{
    if(f==='open' && (isLost(p) || isWon(p))) return false;
    if(f==='won' && !isWon(p)) return false;
    if(f==='lost' && !isLost(p)) return false;
    if(f && !['open','won','lost'].includes(f)){
      if(isLost(p)) return false;                       // le fasi riguardano le commesse non perse
      const ph = projectPhase(p); if((ph ? ph.key : 'none')!==f) return false;
    }
    if(!q) return true;
    const people = (p.partecipanti||[]).map(x=>{ const c = byId[x.contactId]; return c ? fullName(c)+' '+(c.azienda||'') : ''; });
    return normName([p.codice, p.nome, p.via, p.citta, ...people].join(' ')).includes(q);
  }).sort(byProjectId);
  if(!list.length) return `<div class="empty">${projects.length ? 'Nessun progetto corrisponde alla ricerca.' : 'Nessun progetto: crea il primo con "+ Nuovo progetto".'}</div>`;
  return list.map(p=>{
    const people = (p.partecipanti||[]).map(x=>byId[x.contactId]).filter(Boolean).map(fullName);
    return `<div class="card ${projectStateClass(p)}" data-project-id="${p.id}" style="cursor:pointer;">
      <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;">
        <div style="min-width:0;flex:1 1 220px;">
          <div class="proj-code">${esc(p.codice||'')}</div>
          <div class="name-link" style="font-weight:600;font-size:15px;">${esc(p.nome || 'Progetto senza nome')}</div>
          <div style="font-size:12.5px;color:var(--muted);margin-top:2px;">${esc([p.via, p.citta].filter(Boolean).join(', '))}${people.length ? `${p.via||p.citta ? ' · ' : ''}${esc(people.slice(0,3).join(', '))}${people.length>3 ? ' e altri' : ''}` : ''}</div>
        </div>
        <div style="text-align:right;">
          ${phaseBadge(p)}
          <div style="font-weight:600;margin-top:6px;">${fmtEuro(projectAmount(p))}</div>
          ${(p.ordini||[]).length ? `<div style="font-size:11.5px;color:var(--muted);">ordinato ${fmtEuro(orderedTotal(p))} · ${p.ordini.length} ${p.ordini.length===1?'ordine':'ordini'}</div>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}
function projectsListView(){
  const sum = keyFn=>projects.filter(keyFn).reduce((s,p)=>s+(Number(projectAmount(p))||0), 0);
  const inOfferta = sum(p=>!isLost(p) && phaseDone(p, 'offertaPresentata') && !phaseDone(p, 'confermaOrdine'));
  const confermati = sum(isWon);
  const nWon = projects.filter(isWon).length, nLost = projects.filter(isLost).length;
  return `<h2 style="margin-bottom:6px;">Progetti (${projects.length})</h2>
    <div style="font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.6;">Offerte presentate in attesa: <strong style="color:var(--text);">${fmtEuro(inOfferta)}</strong>
      · Ordini confermati: <strong style="color:var(--text);">${nWon}</strong> per <strong style="color:var(--text);">${fmtEuro(confermati)}</strong>
      · Perse: <strong style="color:var(--text);">${nLost}</strong> per ${fmtEuro(sum(isLost))}</div>
    <div class="card" style="padding:14px 16px;">
      <div class="field-row" style="grid-template-columns:2fr 1fr;">

          <option value="lost" ${projectsPhaseFilter==='lost'?'selected':''}>Commesse perse</option>
          <optgroup label="Fase (commesse non perse)">

          </optgroup>
        </select></div>
      </div>
      <button class="btn" id="newProjectBtn" style="margin-top:4px;">+ Nuovo progetto</button>
    </div>
    <div id="projList">${projectsListHtml()}</div>`;
}
function bindProjectsList(){
  const bindCards = ()=>document.querySelectorAll('#projList [data-project-id]').forEach(el=>el.addEventListener('click', ()=>openProject(el.dataset.projectId)));
  bindCards();

function bindProjectForm(){
  const p = window.__editingProject || {};
  const cancel = ()=>{ window.__editingProject = null; view = p.id ? 'projectDetail' : (p.fromContactId ? 'detail' : 'projects'); if(p.fromContactId){ selectedId = p.fromContactId; setActiveTab('navContacts'); } renderMain(); };
  document.getElementById('projFormCancel').addEventListener('click', cancel);
  document.getElementById('projFormCancelTop').addEventListener('click', cancel);
  const box = document.getElementById('fPParts');
  box.addEventListener('click', e=>{ const b = e.target.closest('.part-del'); if(b){ b.closest('.part-row').remove(); } });
  document.getElementById('fPAddPart').addEventListener('click', ()=>{ box.insertAdjacentHTML('beforeend', participantRowHtml({})); box.lastElementChild.querySelector('.part-contact').focus(); });
  document.getElementById('fPCodice').addEventListener('input', e=>{ e.target.value = e.target.value.replace(/\D/g,'').slice(0,7); });
  document.getElementById('saveProjectBtn').addEventListener('click', saveProject);
}
async function saveProject(){
  const p = window.__editingProject || {};
  const err = msg=>{ document.getElementById('projFormErr').textContent = msg; };
  const codice = document.getElementById('fPCodice').value.trim();
  if(!/^\d{7}$/.test(codice)) return err('L\'ID progetto deve essere di 7 cifre.');
  const dup = projects.find(x=>x.codice===codice && x.id!==p.id);
  if(dup) return err(`Esiste già un progetto con ID ${codice}${dup.nome ? ' ('+dup.nome+')' : ''}.`);
  const importo = parseEuro(document.getElementById('fPImporto').value);
  if(Number.isNaN(importo)) return err('Importo dell\'offerta non valido (es. 12.500,00).');
  const byLabel = new Map(contacts.map(c=>[normName(contactLabel(c)), c.id]));
  const partecipanti = [], problems = [];
  document.querySelectorAll('#fPParts .part-row').forEach(row=>{
    const txt = row.querySelector('.part-contact').value.trim();
    const ruolo = row.querySelector('.part-role').value;
    if(!txt) return;
    const id = byLabel.get(normName(txt));
    if(!id) problems.push(`"${txt}" non è nell'elenco contatti (sceglilo dai suggerimenti o crealo prima in Contatti)`);
    else if(!ruolo) problems.push(`indica il ruolo di ${txt}`);
    else partecipanti.push({ contactId:id, ruolo });
  });
  if(problems.length) return err(problems.join('; ')+'.');
  const data = {
    codice, nome: document.getElementById('fPNome').value.trim(),
    via: document.getElementById('fPVia').value.trim(), citta: document.getElementById('fPCitta').value.trim(),
    importoOfferta: importo, offertaUrl: document.getElementById('fPUrl').value.trim(),
    note: document.getElementById('fPNote').value.trim(), partecipanti, updatedAt: Date.now()
  };
  try{
    if(p.id){ await db.collection('projects').doc(p.id).update(data); selectedProjectId = p.id; }
    else{
      const rich = document.getElementById('fPRichiesta').value;
      const ref = await db.collection('projects').add({ ...data, fasi: rich ? { richiesta: rich } : {}, importoDeliberato: null, createdAt: Date.now() });
      selectedProjectId = ref.id;
    }
    window.__editingProject = null; view = 'projectDetail'; setActiveTab('navProjects'); renderMain();
  }catch(e){ err('Errore nel salvataggio: '+(e.message||e.code||'')); }
}

function ordersCardHtml(p){

      ${diff!=null ? (diff<0 ? `<div class="order-note">Da ordinare: ${fmtEuro(-diff)}</div>` : diff>0 ? `<div class="order-note extra">Materiale extra: +${fmtEuro(diff)} rispetto al ${baseLbl}</div>` : `<div class="order-note">Ordinato tutto il ${baseLbl}</div>`) : ''}

function f_merce(p){ return p.fasi && p.fasi.merceCantiere; }
// Salva l'elenco ordini; il primo ordine segna la conferma d'ordine se non era gia' indicata.
// Le date di consegna degli ordini sono indicative (DDT): "Merce arrivata in cantiere" si
// indica solo a mano nella timeline, con la data confermata dal cliente.
async function saveProjectOrders(p, ordini){
  const fasi = { ...(p.fasi||{}) };
  const dates = ordini.map(o=>o.data).filter(Boolean).sort();
  if(!fasi.confermaOrdine && dates.length) fasi.confermaOrdine = dates[0];
  await db.collection('projects').doc(p.id).update({ ordini, fasi, updatedAt: Date.now() });
}
function bindOrders(p, fail){
  const okDate = v=>/^\d{4}-\d{2}-\d{2}$/.test(v) && +v.slice(0,4)>=2000 && +v.slice(0,4)<=2100;
  document.getElementById('ordAddBtn')?.addEventListener('click', ()=>{ orderEdit = { projectId:p.id, id:'new' }; confirmDeleteOrderId = null; renderMain(); });
  document.querySelectorAll('#main [data-order-edit]').forEach(b=>b.addEventListener('click', ()=>{ orderEdit = { projectId:p.id, id:b.dataset.orderEdit }; confirmDeleteOrderId = null; renderMain(); }));
  document.querySelectorAll('#main [data-order-del]').forEach(b=>b.addEventListener('click', ()=>{ confirmDeleteOrderId = b.dataset.orderDel; renderMain(); }));
  document.querySelector('#main [data-order-del-no]')?.addEventListener('click', ()=>{ confirmDeleteOrderId = null; renderMain(); });
  document.querySelector('#main [data-order-del-yes]')?.addEventListener('click', async e=>{
    const id = e.target.dataset.orderDelYes;
    try{ confirmDeleteOrderId = null; await saveProjectOrders(p, (p.ordini||[]).filter(o=>o.id!==id)); }catch(err){ fail(err); }
  });
  document.getElementById('ordCancelBtn')?.addEventListener('click', ()=>{ orderEdit = null; renderMain(); });
  document.getElementById('ordSaveBtn')?.addEventListener('click', async ()=>{
    const errEl = document.getElementById('ordErr');
    const data = document.getElementById('ordData').value, consegna = document.getElementById('ordConsegna').value;
    const importo = parseEuro(document.getElementById('ordImporto').value);
    if(!okDate(data)){ errEl.textContent = 'Indica una data dell\'ordine valida.'; return; }
    if(consegna && !okDate(consegna)){ errEl.textContent = 'La data di consegna non è valida.'; return; }
    if(importo===null || Number.isNaN(importo) || importo<=0){ errEl.textContent = 'Indica l\'importo dell\'ordine (es. 18.500,00).'; return; }
    const rec = { id: orderEdit.id==='new' ? 'o'+Date.now().toString(36)+Math.random().toString(36).slice(2,6) : orderEdit.id,
      data, numero: document.getElementById('ordNumero').value.trim(), importo, consegna, note: document.getElementById('ordNote').value.trim() };
    const ordini = (p.ordini||[]).filter(o=>o.id!==rec.id).concat(rec);
    try{ orderEdit = null; await saveProjectOrders(p, ordini); renderMain(); }catch(err){ fail(err); }
  });
}
async function setProjectPhase(p, key, date){
  const fasi = { ...(p.fasi||{}) };
  if(date) fasi[key] = date; else delete fasi[key];
  const upd = { fasi, updatedAt: Date.now() };
  if(key==='confermaOrdine' && !date) upd.importoDeliberato = null;
  await db.collection('projects').doc(p.id).update(upd);
}
function bindProjectDetail(){
  const p = projects.find(x=>x.id===selectedProjectId);
  document.getElementById('projBackBtn')?.addEventListener('click', ()=>{ view = 'projects'; renderMain(); });
  if(!p) return;
  const fail = e=>alert('Errore nel salvataggio: '+(e.message||e.code||''));
  document.getElementById('projEditBtn')?.addEventListener('click', ()=>{ window.__editingProject = { ...p }; view = 'projectForm'; renderMain(); });
  document.getElementById('projDeleteBtn')?.addEventListener('click', ()=>{ confirmDeleteProjectId = p.id; renderMain(); });
  document.getElementById('projDeleteCancelBtn')?.addEventListener('click', ()=>{ confirmDeleteProjectId = null; renderMain(); });
  document.getElementById('projDeleteConfirmBtn')?.addEventListener('click', async ()=>{
    try{ await db.collection('projects').doc(p.id).delete(); confirmDeleteProjectId = null; selectedProjectId = null; view = 'projects'; renderMain(); }catch(e){ fail(e); }
  });
  // Commessa persa: modulo con data, motivo e note; "Riapri commessa" annulla.
  document.getElementById('projLoseBtn')?.addEventListener('click', ()=>{ loseFormProjectId = p.id; renderMain(); });
  document.getElementById('loseCancelBtn')?.addEventListener('click', ()=>{ loseFormProjectId = null; renderMain(); });
  document.getElementById('loseConfirmBtn')?.addEventListener('click', async ()=>{
    const date = document.getElementById('loseDate').value;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date) || +date.slice(0,4)<2000){ document.getElementById('loseErr').textContent = 'Indica una data valida.'; return; }

      await db.collection('projects').doc(p.id).update({ esito:'persa', persaIl:date, motivoPerdita:document.getElementById('loseReason').value,
        notePerdita:document.getElementById('loseNote').value.trim(), updatedAt:Date.now() });
      loseFormProjectId = null; renderMain();
    }catch(e){ fail(e); }
  });
  document.getElementById('projReopenBtn')?.addEventListener('click', async ()=>{
    try{ await db.collection('projects').doc(p.id).update({ esito:'', persaIl:'', motivoPerdita:'', notePerdita:'', updatedAt:Date.now() }); }catch(e){ fail(e); }
  });
  bindOrders(p, fail);
  // Date della timeline: mentre si scrive l'anno a mano il campo produce date intermedie
  // (0002, 0020, 0202...), quindi si salva solo all'uscita dal campo o dopo una pausa,
  // e solo con un anno plausibile; altrimenti si torna al valore salvato.
  const phaseErr = msg=>{ const el = document.getElementById('phaseErr'); if(el) el.textContent = msg; };
  const validDate = v=>/^\d{4}-\d{2}-\d{2}$/.test(v) && +v.slice(0,4)>=2000 && +v.slice(0,4)<=2100;
  document.querySelectorAll('#main [data-phase]').forEach(inp=>{
    let timer = null;
    const commit = ()=>{
      clearTimeout(timer);
      const cur = projects.find(x=>x.id===selectedProjectId);
      if(!cur) return;
      const saved = (cur.fasi||{})[inp.dataset.phase] || '';
      if(inp.value===saved) return;
      if(inp.value && !validDate(inp.value)){ phaseErr('Data non valida: controlla l\'anno (es. 2026).'); inp.value = saved; return; }
      phaseErr('');
      setProjectPhase(cur, inp.dataset.phase, inp.value).catch(fail);
    };
    inp.addEventListener('change', ()=>{
      clearTimeout(timer);
      if(!inp.value || validDate(inp.value)) timer = setTimeout(()=>{ if(document.activeElement!==inp || validDate(inp.value)) commit(); }, 1200);
    });
    inp.addEventListener('blur', commit);
  });
  document.querySelectorAll('#main [data-phase-today]').forEach(b=>b.addEventListener('click', ()=>setProjectPhase(p, b.dataset.phaseToday, todayISO()).catch(fail)));
  document.getElementById('projDeliberatoBtn')?.addEventListener('click', async ()=>{
    const v = parseEuro(document.getElementById('projDeliberato').value);
    if(v===null || Number.isNaN(v)){ document.getElementById('projDeliberatoErr').textContent = 'Importo non valido (es. 12.500,00).'; return; }
    try{ await db.collection('projects').doc(p.id).update({ importoDeliberato: v, updatedAt: Date.now() }); }catch(e){ fail(e); }
  });
  // Nome della figura: apre la scheda del contatto (senza aprire/chiudere la tendina).
  document.querySelectorAll('#main [data-open-contact]').forEach(el=>el.addEventListener('click', e=>{
    e.preventDefault(); e.stopPropagation();
    selectedId = el.dataset.openContact; view = 'detail'; confirmDeleteId = null; setActiveTab('navContacts'); renderMain();
  }));
  // I numeri di telefono nel riepilogo chiamano senza aprire la tendina.
  document.querySelectorAll('#main .part-item summary a').forEach(a=>a.addEventListener('click', e=>e.stopPropagation()));
  // Le tendine aperte restano aperte quando la scheda si aggiorna.
  document.querySelectorAll('#main details[data-history-contact]').forEach(d=>d.addEventListener('toggle', ()=>{
    if(d.open) openPartHistory.add(d.dataset.historyContact); else openPartHistory.delete(d.dataset.historyContact);
  }));
  document.querySelectorAll('#main [data-appt-call-id]').forEach(el=>el.addEventListener('click', ()=>{ tableDetailCallId = el.dataset.apptCallId; renderMain(); }));
}

function loadXLSX(){
  if(window.XLSX) return Promise.resolve();
  return new Promise((resolve, reject)=>{
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
