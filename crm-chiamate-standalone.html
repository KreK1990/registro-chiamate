// ---------------------------------------------------------------------------
// Storico del forecast: collection "forecastStorico", un documento per mese
// ({mese:'YYYY-MM', ponderato, offerte, aperte, anni:{'YYYY':{stima, fatturato,
// daSpedire, forecast, conferme, budget}}, aggiornatoIl}). Il documento del mese in
// corso si aggiorna da solo quando cambiano progetti o budget: a fine mese resta la
// fotografia di quel mese. Nel Forecast: grafico "Andamento nel tempo".
// ---------------------------------------------------------------------------
let forecastHistory = [], historyLoaded = false, projectsSeen = false, historyTimer = null;
function onHistorySnapshot(snap){
  forecastHistory = snap.docs.map(d=>({ id:d.id, ...d.data() })).filter(h=>/^\d{4}-\d{2}$/.test(h.mese||'')).sort((a,b)=>a.mese.localeCompare(b.mese));
  historyLoaded = true;
  scheduleForecastSnapshot();
  if(view==='forecast' && canAutoRender()){ const t = document.getElementById('fcTrend'); if(t){ t.outerHTML = trendCardHtml(); bindTrend(); } }
}
function scheduleForecastSnapshot(){ clearTimeout(historyTimer); historyTimer = setTimeout(recordForecastSnapshot, 3000); }
function forecastSnapshotValues(){
  const open = openForecastProjects(), y0 = +currentYear();
  const round = v=>Math.round((Number(v)||0)*100)/100;
  const anni = {};
  [String(y0), String(y0+1)].forEach(y=>{
    anni[y] = { stima: round(estimateInYear(y)), fatturato: round(invoicedInYear(y)), daSpedire: round(toShipInYear(y)),
      forecast: round(weightedInYear(y)), budget: budgetOf(y),
      conferme: round(projects.filter(p=>isWon(p) && (p.fasi.confermaOrdine||'').startsWith(y)).reduce((s,p)=>s+(Number(projectAmount(p))||0), 0)) };
  });
  return { ponderato: round(open.reduce((s,p)=>s+forecastWeighted(p), 0)), offerte: round(open.reduce((s,p)=>s+(Number(p.importoOfferta)||0), 0)), aperte: open.length, anni };
}
async function recordForecastSnapshot(){
  if(!db || !historyLoaded || !projectsSeen || !projects.length) return;
  const mese = todayISO().slice(0,7), vals = forecastSnapshotValues();
  const cur = forecastHistory.find(h=>h.mese===mese);
  const same = cur && JSON.stringify({ ponderato:cur.ponderato, offerte:cur.offerte, aperte:cur.aperte, anni:cur.anni }) === JSON.stringify(vals);
  if(same) return;
  try{
    if(cur) await db.collection('forecastStorico').doc(cur.id).update({ ...vals, aggiornatoIl: Date.now() });
    else await db.collection('forecastStorico').add({ mese, ...vals, aggiornatoIl: Date.now() });
  }catch(e){ console.warn('Storico forecast non salvato:', e); }
}

// --- Grafico: stima di fatturato dell'anno scelto e ponderato totale, mese per mese ---
function monthShort(ym){ return `${MONTHS_SHORT[+ym.slice(5,7)-1]} ${ym.slice(2,4)}`; }
function niceMax(v){ if(v<=0) return 1; const e = Math.pow(10, Math.floor(Math.log10(v))); const f = v/e; return (f<=1 ? 1 : f<=2 ? 2 : f<=2.5 ? 2.5 : f<=5 ? 5 : 10) * e; }
function eurShort(v){ return v>=1e6 ? (Math.round(v/1e5)/10).toLocaleString('it-IT')+' M€' : v>=1e3 ? Math.round(v/1e3).toLocaleString('it-IT')+'K €' : Math.round(v)+' €'; }
function trendData(){
  return forecastHistory.map(h=>({ mese:h.mese, stima: h.anni && h.anni[budgetYear] ? h.anni[budgetYear].stima : null, ponderato: h.ponderato, fatturato: h.anni && h.anni[budgetYear] ? h.anni[budgetYear].fatturato : null, aperte: h.aperte }));
}
function trendCardHtml(){
  const data = trendData(), budget = budgetOf(budgetYear);
  const head = `<h3 style="margin-bottom:4px;">Andamento nel tempo</h3>
    <div class="fc-note" style="margin-bottom:10px;">Ogni mese l'app registra la situazione del forecast: così vedi se la previsione cresce o cala.</div>`;
  if(!data.length) return `<div class="card" id="fcTrend" style="margin-top:14px;">${head}<div class="fc-note">Il primo punto viene registrato tra pochi secondi, appena i dati sono caricati.</div></div>`;
  const vals = data.flatMap(d=>[d.stima, d.ponderato]).filter(v=>v!=null);
  const max = niceMax(Math.max(...vals, budget||0) * 1.05);
  const n = data.length, pad = 6;
  const xp = i=>n===1 ? 50 : pad + i*(100-2*pad)/(n-1);       // percentuale della larghezza
  const yp = v=>100 - v*100/max;                               // percentuale dell'altezza
  const line = key=>{ const pts = data.map((d,i)=>d[key]==null ? null : `${xp(i)*10},${yp(d[key])*2}`).filter(Boolean); return pts.length>1 ? `<polyline class="trend-line ${key}" points="${pts.join(' ')}" vector-effect="non-scaling-stroke"/>` : ''; };
  const dots = key=>data.map((d,i)=>d[key]==null ? '' : `<span class="trend-dot ${key}" style="left:${xp(i)}%;top:${yp(d[key])}%;"></span>`).join('');
  const ticks = [0, 0.5, 1].map(f=>`<line class="trend-grid" x1="0" x2="1000" y1="${yp(max*f)*2}" y2="${yp(max*f)*2}" vector-effect="non-scaling-stroke"/>`).join('');
  const yLabels = [0, 0.5, 1].map(f=>`<span class="trend-ylab" style="top:${yp(max*f)}%;">${eurShort(max*f)}</span>`).join('');
  const step = Math.ceil(n/8);
  const xLabels = data.map((d,i)=>i%step && i!==n-1 ? '' : `<span style="left:${xp(i)}%;">${monthShort(d.mese)}</span>`).join('');
  const hits = data.map((d,i)=>`<div class="trend-hit" data-trend-i="${i}" style="left:${n===1 ? 0 : (i===0 ? 0 : (xp(i-1)+xp(i))/2)}%;width:${n===1 ? 100 : ((i===n-1 ? 100 : (xp(i)+xp(i+1))/2) - (i===0 ? 0 : (xp(i-1)+xp(i))/2))}%;"></div>`).join('');
  const last = data[n-1];
  return `<div class="card" id="fcTrend" style="margin-top:14px;">${head}
    <div class="trend-legend">
      <span><i class="trend-sw stima"></i>Fatturato stimato ${budgetYear}${last.stima!=null ? ` <strong>${eurShort(last.stima)}</strong>` : ''}</span>
      <span><i class="trend-sw ponderato"></i>Forecast ponderato (tutte le aperte) <strong>${eurShort(last.ponderato)}</strong></span>
      ${budget ? `<span><i class="trend-sw budget"></i>Budget ${budgetYear} <strong>${eurShort(budget)}</strong></span>` : ''}
    </div>
    <div class="trend">
      <div class="trend-plot">
        <svg viewBox="0 0 1000 200" preserveAspectRatio="none" aria-hidden="true">${ticks}
          ${budget ? `<line class="trend-budget" x1="0" x2="1000" y1="${yp(budget)*2}" y2="${yp(budget)*2}" vector-effect="non-scaling-stroke"/>` : ''}
          ${line('ponderato')}${line('stima')}</svg>
        ${yLabels}${dots('ponderato')}${dots('stima')}${hits}
        <div class="trend-tip hidden" id="trendTip"></div>
      </div>
      <div class="trend-x">${xLabels}</div>
    </div>
    ${n===1 ? '<div class="fc-note" style="margin-top:6px;">Per ora c\'è solo il mese in corso: la linea si forma dal mese prossimo.</div>' : ''}
    <details class="trend-table"><summary class="fc-note">Vedi i valori</summary>
      <div class="rep-table"><div class="trend-trow trend-th"><span>Mese</span><span>Fatturato stimato ${budgetYear}</span><span>di cui fatturato</span><span>Forecast ponderato</span><span>Aperte</span></div>
      ${data.slice().reverse().map(d=>`<div class="trend-trow"><span>${monthLabel(d.mese)}</span><span>${fmtEuro(d.stima)}</span><span>${fmtEuro(d.fatturato)}</span><span>${fmtEuro(d.ponderato)}</span><span>${d.aperte ?? '—'}</span></div>`).join('')}</div>
    </details>
  </div>`;
}
function bindTrend(){
  const tip = document.getElementById('trendTip');
  if(!tip) return;

    const d = data[+el.dataset.trendI]; if(!d) return;

    tip.classList.remove('hidden');

    const cx = r.left + r.width/2 - plot.left;

    document.querySelectorAll('.trend-hit.on').forEach(h=>h.classList.remove('on')); el.classList.add('on');
  };
  document.querySelectorAll('.trend-hit').forEach(el=>{

// ---------------------------------------------------------------------------
// Ordini da PDF: legge la conferma d'ordine Schöck (PDF con testo, non scansione) con
// pdf.js e precompila il modulo dell'ordine: n° ordine, data, consegna, importo (Totale
// merce, senza trasporto e IVA) e note. Il "Progetto nr." del PDF trova la commessa.
// Si controlla e si salva a mano: nulla viene registrato senza conferma.
// ---------------------------------------------------------------------------
function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve();
  return new Promise((resolve, reject)=>{
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    sc.onload = ()=>{ pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; resolve(); };
    sc.onerror = ()=>reject(new Error('lettore PDF non caricato, controlla la connessione'));
    document.head.appendChild(sc);
  });
}
// Testo di una pagina (item di pdf.js) -> righe, dall'alto in basso, parole da sinistra.
function pdfItemsToLines(items){
  const rows = [];
  items.filter(it=>it.str && it.str.trim()).forEach(it=>{
    const x = it.transform[4], y = it.transform[5];
    let row = rows.find(r=>Math.abs(r.y - y) < 2.5);
    if(!row){ row = { y, parts:[] }; rows.push(row); }
    row.parts.push({ x, s: it.str });
  });
  return rows.sort((a,b)=>b.y - a.y).map(r=>r.parts.sort((a,b)=>a.x - b.x).map(p=>p.s.trim()).join(' ').replace(/\s+/g,' ').trim());
}
function parseOrderConfirmation(lines){
  const text = lines.join('\n');
  const num = s=>s ? Number(s.replace(/\./g,'').replace(',', '.')) : null;
  const date = s=>{ const m = /(\d{2})\.(\d{2})\.(\d{4})/.exec(s||''); return m ? `${m[3]}-${m[2]}-${m[1]}` : ''; };
  const find = re=>{ const m = re.exec(text); return m ? m[1].trim() : ''; };
  const iLuogo = lines.findIndex(l=>/^Luogo di consegna/.test(l));
  return {
    numero: find(/^Ordine nr\.?\s*(\d+)/m) || find(/Ordine nr\.\/Data:\s*(\d+)/),
    data: date(find(/^Data\s+(\d{2}\.\d{2}\.\d{4})/m) || find(/Ordine nr\.\/Data:\s*\d+\s*\/\s*(\d{2}\.\d{2}\.\d{4})/)),
    progetto: find(/Progetto nr\.?\s*(\d{5,})/),
    consegna: date(find(/Data di consegna\s+(\d{2}\.\d{2}\.\d{4})/)),
    riferimento: find(/N° ordine\s+(\S+)/),
    cliente: find(/^(.+?)\s+Cliente nr\./m),
    luogo: iLuogo>=0 ? (lines[iLuogo+3] || '').trim() : '',
    totaleMerce: num(find(/Totale merce\s+([\d.]+,\d{2})/)),
    trasporto: num(find(/Spese di trasporto\s+([\d.]+,\d{2})/)),
    imponibile: num(find(/Imponibile\s+([\d.]+,\d{2})/)),
    confermaOrdine: /Conferma d'ordine/i.test(text)
  };
}
async function readOrderPdf(file){
  await loadPdfJs();
  const doc = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  let lines = [];
  for(let i=1; i<=doc.numPages; i++){ const pg = await doc.getPage(i); lines = lines.concat(pdfItemsToLines((await pg.getTextContent()).items)); }
  if(!lines.length) throw new Error('il PDF non contiene testo (forse è una scansione): inserisci l\'ordine a mano');
  return parseOrderConfirmation(lines);
}
// Apre il modulo dell'ordine precompilato. p = progetto (dalla scheda) o null (dall'elenco).
function pickOrderPdf(p){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'application/pdf,.pdf';
  input.addEventListener('change', async ()=>{
    const file = input.files && input.files[0];
    if(!file) return;
    let r;
    try{ r = await readOrderPdf(file); }catch(e){ alert('Impossibile leggere il PDF: '+(e.message||e)); return; }
    if(!r.numero && !r.totaleMerce && !r.progetto){ alert('Nel PDF non ho trovato i dati di una conferma d\'ordine Schöck (numero, progetto, importi): inserisci l\'ordine a mano.'); return; }
    const target = p || projects.find(x=>String(x.codice||'')===r.progetto);
    if(!target){
      alert(r.progetto ? `Il PDF è del progetto ${r.progetto}, che non è nell'elenco. Crea prima il progetto con questo ID, poi rileggi il PDF.` : 'Nel PDF non c\'è il numero di progetto: apri il progetto e usa "Leggi da PDF" negli ordini.');
      return;
    }
    if(isLost(target)){ alert(`Il progetto ${target.codice} è segnato come perso: riaprilo prima di aggiungere ordini.`); return; }
    const existing = r.numero ? (target.ordini||[]).find(o=>String(o.numero||'')===r.numero) : null;
    const note = [r.riferimento ? `Rif. ${r.riferimento}` : '', r.cliente, r.luogo ? `consegna a ${r.luogo}` : '', r.trasporto ? `trasporto ${fmtNum(r.trasporto)} € escluso` : ''].filter(Boolean).join(' · ');
    const prefill = { data: r.data || todayISO(), numero: r.numero, importo: r.totaleMerce, consegna: r.consegna, note };
    openProject(target.id);
    orderEdit = { projectId: target.id, id: existing ? existing.id : 'new', prefill, file,
      info: { ...r, fileName: file.name, existing: !!existing, otherProject: r.progetto && r.progetto!==String(target.codice||'') ? r.progetto : '' } };
    renderMain();
    document.getElementById('ordSaveBtn')?.scrollIntoView({ block:'center' });
  });
  input.click();
}
function pdfInfoHtml(info){
  return `<div class="pdf-info">
    <div><strong>Letto dal PDF</strong> ${esc(info.fileName||'')}${info.confermaOrdine ? '' : ' (non sembra una conferma d\'ordine: controlla bene i dati)'}</div>
    ${info.otherProject ? `<div class="pdf-warn">Attenzione: il PDF è del progetto ${esc(info.otherProject)}, non di questo.</div>` : ''}

  </div>`;
}

// ---------------------------------------------------------------------------
// Invito Outlook: apre in Outlook (web, account Microsoft 365) un nuovo evento gia'
// compilato - cliente invitato, data e ora (1 ora), luogo, oggetto e testo - che si
// invia con "Invia". Parte dal proprio indirizzo e il cliente riceve un vero invito,
// con il promemoria del suo calendario.
// ---------------------------------------------------------------------------
const INVITE_MINUTES = 60;
const INVITE_SUBJECT = 'PROMEMORIA APPUNTAMENTO TAGLIO TERMICO - SCHOCK';
const PROF_TITLES = { Architetto:'Arch.', Ingegnere:'Ing.', Geometra:'Geom.', Avvocato:'Avv.', Notaio:'Notaio', Commercialista:'Dott.' };
function inviteSalutation(c){   // "Gentile Arch. Izzo" / "Gentile Mario Rossi" / "Buongiorno,"
  const t = PROF_TITLES[c.professione];
  if(c.cognome) return `Gentile ${t || c.nome || ''} ${c.cognome}`.replace(/\s+/g,' ').trim();
  if(c.nome) return `Gentile ${t ? t+' ' : ''}${c.nome}`;
  return 'Buongiorno,';
}
function isoWithOffset(local){   // 'YYYY-MM-DDTHH:MM' (ora italiana del dispositivo) -> ISO con fuso
  const d = new Date(local), off = -d.getTimezoneOffset(), a = Math.abs(off);
  const pad = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:00${off>=0 ? '+' : '-'}${pad(Math.floor(a/60))}:${pad(a%60)}`;
}
function outlookInviteUrl(k){
  const c = contacts.find(x=>x.id===k.contactId) || {};
  const start = new Date(k.appuntamento), end = new Date(start.getTime() + INVITE_MINUTES*60000);
  const pad = n=>String(n).padStart(2,'0');
  const endLocal = `${end.getFullYear()}-${pad(end.getMonth()+1)}-${pad(end.getDate())}T${pad(end.getHours())}:${pad(end.getMinutes())}`;
  // Testo del promemoria che l'utente manda di solito (es. "mercoledì 09 alle ore 15").
  const when = `${start.toLocaleDateString('it-IT', { weekday:'long' })} ${pad(start.getDate())}`;
  const time = start.getMinutes() ? `${start.getHours()}:${pad(start.getMinutes())}` : String(start.getHours());
  const place = fullAddress(c);
  const body = [inviteSalutation(c), '', `Come da intese telefoniche, le mando questo promemoria per l'appuntamento di ${when} alle ore ${time} presso i vostri uffici.`, '', 'Cordiali Saluti'].join('\n');
  const q = new URLSearchParams({ path:'/calendar/action/compose', rru:'addevent', subject: INVITE_SUBJECT,
    startdt: isoWithOffset(k.appuntamento), enddt: isoWithOffset(endLocal), location: place, body });
  if(c.email) q.set('to', c.email);
  return 'https://outlook.office.com/calendar/0/deeplink/compose?' + q.toString();
}
function inviteBtn(k){ return k && k.appuntamento && new Date(k.appuntamento) > new Date() ? `<button class="btn secondary small" data-outlook-invite="${k.id}">Invia invito Outlook</button>` : ''; }
function openOutlookInvite(k){ if(k && k.appuntamento) window.open(outlookInviteUrl(k), '_blank', 'noopener'); }
// Un solo ascoltatore su #main (fase di cattura): il pulsante funziona anche dentro le schede
// cliccabili senza aprirle.
function onInviteClick(e){
  const b = e.target.closest && e.target.closest('[data-outlook-invite]');
  if(!b) return;
  e.stopPropagation(); e.preventDefault();
  openOutlookInvite(calls.find(x=>x.id===b.dataset.outlookInvite));
}
// Dopo aver fissato un appuntamento: proposta dell'invito nella barra in alto (versione online).
function offerOutlookInvite(k){
  if(typeof showNotice!=='function' || !document.getElementById('noticeBar') || !k.appuntamento || new Date(k.appuntamento) <= new Date()) return;
  const c = contacts.find(x=>x.id===k.contactId) || {};
  showNotice(`<strong>Appuntamento fissato</strong> con ${esc(fullName(c))} il ${fmtDateTime(k.appuntamento)}.
    <div class="notice-hint">${c.email ? `Vuoi mandargli l'invito? Si apre Outlook con l'evento già compilato: controlla e premi "Invia".` : 'Il contatto non ha un\'email: puoi aggiungerla nella scheda, oppure scrivere l\'invitato direttamente in Outlook.'}</div>
    <div class="notice-actions"><button class="btn small" id="noticeInviteBtn">Invia invito Outlook</button><button class="btn secondary small" id="noticeClose">Non ora</button></div>`);
  document.getElementById('noticeInviteBtn').addEventListener('click', ()=>{ openOutlookInvite(k); hideNotice(); });
}

// ---------------------------------------------------------------------------
// Documenti del progetto (solo versione online, Firebase Storage, piano Blaze):
// file in users/<uid>/projects/<projectId>/<timestamp>-<nome>, elenco in projects.allegati
// [{id, nome, path, tipo, size, caricatoIl}]. Regole in storage.rules (da pubblicare nella
// console Firebase). "Ordine da PDF" puo' allegare il PDF dell'ordine al salvataggio.
// ---------------------------------------------------------------------------
const MAX_ATTACH_MB = 20;
let attachBusy = '', confirmDeleteAttachId = null;
function storageAvailable(){ return typeof firebase!=='undefined' && typeof firebase.storage==='function' && !!(firebase.auth && firebase.auth().currentUser); }
function fmtSize(b){ return b>=1048576 ? (Math.round(b/104857.6)/10).toLocaleString('it-IT')+' MB' : Math.max(1, Math.round(b/1024))+' KB'; }
async function uploadProjectFile(p, file, tag){
  if(file.size > MAX_ATTACH_MB*1048576) throw new Error(`"${file.name}" supera i ${MAX_ATTACH_MB} MB`);
  const uid = firebase.auth().currentUser.uid;
  const safe = file.name.replace(/[^\w.\- ()àèéìòù]/gi, '_');
  const path = `users/${uid}/projects/${p.id}/${Date.now()}-${safe}`;
  await firebase.storage().ref(path).put(file, { contentType: file.type || 'application/octet-stream' });
  return { id: 'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), nome: file.name, path, tipo: file.type||'', size: file.size, caricatoIl: todayISO(), ...(tag ? { tag } : {}) };
}
async function addProjectFiles(p, files, tag){
  const fresh = projects.find(x=>x.id===p.id) || p;
  const added = [];
  for(const f of files){ attachBusy = `Caricamento di "${f.name}"…`; renderAttachStatus(); added.push(await uploadProjectFile(fresh, f, tag)); }
  await db.collection('projects').doc(p.id).update({ allegati: [...(fresh.allegati||[]), ...added], updatedAt: Date.now() });
  return added;
}
function renderAttachStatus(){ const s = document.getElementById('attachStatus'); if(s) s.textContent = attachBusy; }
function attachmentsCardHtml(p){
  if(!storageAvailable()) return '';
  const list = (p.allegati||[]).slice().sort((a,b)=>(b.caricatoIl||'').localeCompare(a.caricatoIl||''));
  return `<div class="card" id="attachCard">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;">
      <h3 style="margin:0;">Documenti (${list.length})</h3>
      <button class="btn secondary small" id="attachAddBtn">+ Allega file</button>
    </div>
    <div class="fc-note" id="attachStatus">${esc(attachBusy)}</div>
    ${list.length ? list.map(a=>`<div class="attach-row">
      <div class="attach-main"><span class="name-link" data-attach-open="${a.id}">${esc(a.nome)}</span>
        <span class="fc-note">${a.tag==='ordine' ? 'ordine · ' : ''}${fmtDate(a.caricatoIl)} · ${fmtSize(a.size||0)}</span></div>
      <div class="todo-actions">${confirmDeleteAttachId===a.id ? `
        <span style="color:var(--danger);font-size:12.5px;font-weight:600;">Eliminare il file?</span>
        <button class="btn small" data-attach-del-yes="${a.id}" style="background:var(--danger);border-color:var(--danger);color:#fff;">Sì</button>
        <button class="btn secondary small" data-attach-del-no>No</button>` : `<button class="btn secondary small" data-attach-del="${a.id}">Elimina</button>`}</div>
    </div>`).join('') : '<div class="empty" style="padding:4px 0;">Nessun documento. Allega offerte, disegni, conferme d\'ordine (PDF, immagini, Excel, fino a 20 MB l\'uno).</div>'}
  </div>`;
}
function bindAttachments(p, fail){
  if(!storageAvailable()) return;
  document.getElementById('attachAddBtn')?.addEventListener('click', ()=>{
    const input = document.createElement('input');
    input.type = 'file'; input.multiple = true;
    input.addEventListener('change', async ()=>{
      const files = [...(input.files||[])];
      if(!files.length) return;
      try{ await addProjectFiles(p, files); attachBusy = ''; }
      catch(e){ attachBusy = ''; fail(e); }
      renderAttachStatus();
    });
    input.click();
  });
  document.querySelectorAll('[data-attach-open]').forEach(el=>el.addEventListener('click', async ()=>{
    const a = (p.allegati||[]).find(x=>x.id===el.dataset.attachOpen); if(!a) return;
    const win = window.open('', '_blank');   // aperta subito: su iPhone una finestra aperta dopo un'attesa viene bloccata
    try{ const url = await firebase.storage().ref(a.path).getDownloadURL(); if(win) win.location = url; else location.href = url; }
    catch(e){ if(win) win.close(); fail(e); }
  }));
  document.querySelectorAll('[data-attach-del]').forEach(b=>b.addEventListener('click', ()=>{ confirmDeleteAttachId = b.dataset.attachDel; renderMain(); }));
  document.querySelector('[data-attach-del-no]')?.addEventListener('click', ()=>{ confirmDeleteAttachId = null; renderMain(); });
  document.querySelector('[data-attach-del-yes]')?.addEventListener('click', async e=>{
    const a = (p.allegati||[]).find(x=>x.id===e.target.dataset.attachDelYes); confirmDeleteAttachId = null;
    if(!a) return renderMain();
    try{
      await firebase.storage().ref(a.path).delete().catch(err=>{ if(err.code!=='storage/object-not-found') throw err; });
      await db.collection('projects').doc(p.id).update({ allegati: (p.allegati||[]).filter(x=>x.id!==a.id), updatedAt: Date.now() });
    }catch(err){ fail(err); }
  });
}

// ---------------------------------------------------------------------------
// Mappa (voce di menu): clienti (cerchi, raggruppati per indirizzo: i colleghi dello
// stesso studio stanno in un solo punto) e cantieri (quadrati: in corso / confermati /
// persi). Leaflet + OpenStreetMap da cdnjs. Coordinate da Nominatim (OpenStreetMap),
// una richiesta al secondo, salvate sul documento: contacts.geo / projects.geo =
// {lat, lng, a} (a = indirizzo cercato; se cambia si ricerca; nf = non trovato).
// "Vicino a…": centra su una localita' e mostra cosa c'e' entro 20 km.
// ---------------------------------------------------------------------------
let mapObj = null, mapLayer = null, mapFilters = { clienti:true, aperti:true, confermati:true, persi:false };
let mapNear = null, mapGeoRunning = false, mapGeoMsg = '';
const geoCache = new Map();   // indirizzo -> {lat,lng} | null (non trovato)
function loadLeaflet(){
  if(window.L) return Promise.resolve();
  const css = document.createElement('link');
  css.rel = 'stylesheet'; css.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';
  document.head.appendChild(css);
  return new Promise((resolve, reject)=>{
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
    sc.onload = ()=>resolve();
    sc.onerror = ()=>reject(new Error('mappa non caricata, controlla la connessione'));
    document.head.appendChild(sc);
  });
}
function geoKey(a){ return String(a||'').trim().toLowerCase().replace(/\s+/g,' '); }
function docGeo(x, addr){ return x.geo && geoKey(x.geo.a)===geoKey(addr) ? x.geo : null; }
async function geocode(q){
  const k = geoKey(q);
  if(geoCache.has(k)) return geoCache.get(k);
  const res = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=it&accept-language=it&q='+encodeURIComponent(q));
  if(!res.ok) throw new Error('ricerca indirizzi non disponibile ('+res.status+')');
  const j = await res.json();
  const g = j && j[0] ? { lat:+j[0].lat, lng:+j[0].lon } : null;
  geoCache.set(k, g);
  return g;
}
function mapPoints(){
  const pts = [];
  if(mapFilters.clienti){
    const byAddr = new Map();
    contacts.forEach(c=>{ const a = fullAddress(c); if(!a) return; const g = docGeo(c, a); if(!g || g.nf) return;
      const k = geoKey(a); const e = byAddr.get(k) || { kind:'cliente', addr:a, lat:g.lat, lng:g.lng, contacts:[] }; e.contacts.push(c); byAddr.set(k, e); });
    pts.push(...byAddr.values());
  }
  projects.forEach(p=>{
    const st = isLost(p) ? 'persi' : isWon(p) ? 'confermati' : 'aperti';
    if(!mapFilters[st]) return;
    const a = projectAddress(p); if(!a) return; const g = docGeo(p, a); if(!g || g.nf) return;
    pts.push({ kind:'cantiere', st, addr:a, lat:g.lat, lng:g.lng, p });
  });
  return pts;
}
// Elementi senza coordinate (o con indirizzo cambiato), da cercare.
function mapToGeocode(){
  const out = [];
  contacts.forEach(c=>{ const a = fullAddress(c); if(a && !docGeo(c, a)) out.push({ col:'contacts', x:c, a }); });
  projects.forEach(p=>{ const a = projectAddress(p); if(a && !docGeo(p, a)) out.push({ col:'projects', x:p, a }); });
  return out;
}
function lastContactDays(c){ const d = calls.filter(k=>k.contactId===c.id).map(k=>k.data||'').sort().pop(); return d ? daysBetween(d, todayISO()) : null; }
function mapPopupHtml(pt){
  if(pt.kind==='cantiere'){ const p = pt.p, ph = projectPhase(p);
    return `<div class="map-pop"><div class="proj-code">${esc(p.codice||'')}</div><strong>${esc(p.nome||'Progetto')}</strong>
      <div>${esc(pt.addr)}</div><div class="fc-note">${isLost(p) ? 'Persa' : ph ? esc(ph.label) : 'Da avviare'}${p.importoOfferta!=null ? ' · '+fmtEuro(projectAmount(p)) : ''}</div>
      <div class="map-pop-actions"><button class="btn small" data-map-project="${p.id}">Apri progetto</button><a class="btn secondary small" href="${mapsUrl({ via:p.via, citta:p.citta })}" target="_blank" rel="noopener">Indicazioni</a></div></div>`; }
  return `<div class="map-pop"><div>${esc(pt.addr)}</div>
    ${pt.contacts.map(c=>{ const d = lastContactDays(c); return `<div class="map-pop-c"><span class="name-link" data-map-contact="${c.id}">${esc(fullName(c))}</span>${c.azienda ? ` · ${esc(c.azienda)}` : ''}<div class="fc-note">${d==null ? 'mai sentito' : `ultimo contatto ${d} giorni fa`}</div></div>`; }).join('')}
    <div class="map-pop-actions"><a class="btn secondary small" href="${mapsUrl(pt.contacts[0])}" target="_blank" rel="noopener">Indicazioni</a></div></div>`;
}
function distKm(a, b){ const R = 6371, r = x=>x*Math.PI/180; const dLat = r(b.lat-a.lat), dLng = r(b.lng-a.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function mapNearHtml(){
  if(!mapNear) return '';
  const near = mapPoints().map(pt=>({ pt, d: distKm(mapNear, pt) })).filter(x=>x.d <= 20).sort((a,b)=>a.d - b.d);
  return `<div class="card"><h3>Vicino a ${esc(mapNear.label)} (entro 20 km): ${near.length}</h3>
    ${near.length ? near.map(({pt, d})=>`<div class="todo-row"><div class="todo-main">${pt.kind==='cantiere'
        ? `<span class="map-sw sq ${pt.st}"></span><span class="proj-code">${esc(pt.p.codice||'')}</span> <span class="name-link" data-map-project="${pt.p.id}">${esc(pt.p.nome||'Progetto')}</span>`
        : `<span class="map-sw cl"></span>${pt.contacts.map(c=>`<span class="name-link" data-map-contact="${c.id}">${esc(fullName(c))}</span>`).join(', ')}`}
      <div class="todo-sub">${esc(pt.addr)} · ${d<1 ? 'meno di 1 km' : Math.round(d)+' km'}${pt.kind==='cliente' ? (()=>{ const ds = pt.contacts.map(lastContactDays).filter(x=>x!=null); return ds.length ? ` · ultimo contatto ${Math.min(...ds)} giorni fa` : ' · mai sentito'; })() : ''}</div></div></div>`).join('')
      : '<div class="empty">Niente entro 20 km.</div>'}
  </div>`;
}
function mapView(){
  const f = (k, label, sw)=>`<label class="map-filter"><input type="checkbox" data-map-filter="${k}" ${mapFilters[k] ? 'checked' : ''}><span class="map-sw ${sw}"></span>${label}</label>`;
  return `<h2 style="margin-bottom:10px;">Mappa</h2>
    <div class="card" style="padding:12px 14px;">
      <div class="map-tools">
        <div class="map-search"><input id="mapPlace" placeholder="Vicino a… (es. Cuneo, Via Roma 10 Alba)" autocomplete="off"><button class="btn small" id="mapPlaceBtn">Cerca</button><button class="btn secondary small" id="mapMeBtn">Vicino a me</button></div>
        <div class="map-filters">${f('clienti','Clienti','cl')}${f('aperti','Cantieri in corso','sq aperti')}${f('confermati','Cantieri confermati','sq confermati')}${f('persi','Cantieri persi','sq persi')}</div>
      </div>
      <div class="fc-note" id="mapGeoMsg">${esc(mapGeoMsg)}</div>
    </div>
    <div id="mapBox" class="map-box"></div>
    <div id="mapNear">${mapNearHtml()}</div>
    <div class="fc-note" style="margin-top:6px;">Mappa © OpenStreetMap. Gli indirizzi vengono posizionati una volta sola con il servizio di OpenStreetMap (solo l'indirizzo, senza nomi).</div>`;
}
function drawMapPoints(fit){
  if(!mapObj) return;
  mapLayer.clearLayers();
  const pts = mapPoints();
  pts.forEach(pt=>{
    const cls = pt.kind==='cantiere' ? `map-mk sq ${pt.st}` : 'map-mk cl';
    const n = pt.kind==='cliente' && pt.contacts.length>1 ? `<span>${pt.contacts.length}</span>` : '';
    L.marker([pt.lat, pt.lng], { icon: L.divIcon({ className:'', html:`<div class="${cls}">${n}</div>`, iconSize:[18,18], iconAnchor:[9,9] }),
      title: pt.kind==='cantiere' ? `${pt.p.codice} ${pt.p.nome||''}` : pt.contacts.map(fullName).join(', ') })
      .bindPopup(mapPopupHtml(pt)).addTo(mapLayer);
  });
  if(fit && pts.length) mapObj.fitBounds(L.latLngBounds(pts.map(p=>[p.lat, p.lng])), { padding:[30,30], maxZoom:13 });
  const nearEl = document.getElementById('mapNear'); if(nearEl) nearEl.innerHTML = mapNearHtml();
}
async function runMapGeocoding(){
  if(mapGeoRunning) return;
  mapGeoRunning = true;
  const todo = mapToGeocode();
  let done = 0, found = 0;
  const msg = t=>{ mapGeoMsg = t; const el = document.getElementById('mapGeoMsg'); if(el) el.textContent = t; };
  try{
    for(const it of todo){
      if(view!=='map') break;
      msg(`Posiziono gli indirizzi sulla mappa: ${done} di ${todo.length}… (solo la prima volta)`);
      const cached = geoCache.has(geoKey(it.a));
      const g = await geocode(it.a);
      const geo = g ? { lat:g.lat, lng:g.lng, a:it.a } : { a:it.a, nf:true };
      it.x.geo = geo; done++; if(g) found++;
      db.collection(it.col).doc(it.x.id).update({ geo }).catch(()=>{});
      if(g && done % 5 === 0) drawMapPoints(false);
      if(!cached) await new Promise(r=>setTimeout(r, 1100));   // regola di OpenStreetMap: max 1 richiesta al secondo
    }
    const nf = contacts.filter(c=>{ const g = docGeo(c, fullAddress(c)); return g && g.nf; }).length + projects.filter(p=>{ const g = docGeo(p, projectAddress(p)); return g && g.nf; }).length;
    msg(todo.length ? `Indirizzi posizionati.${nf ? ` ${nf} non trovati: controlla via e città nelle schede.` : ''}` : '');
  }catch(e){ msg('Posizionamento interrotto: '+(e.message||e)); }
  mapGeoRunning = false;
  drawMapPoints(false);
}
async function bindMap(){
  const main = document.getElementById('main');
  main.querySelectorAll('[data-map-filter]').forEach(cb=>cb.addEventListener('change', ()=>{ mapFilters[cb.dataset.mapFilter] = cb.checked; drawMapPoints(false); }));
  // pulsanti nei fumetti e nell'elenco "vicino a" (creati dopo): un solo ascoltatore, registrato una volta
  if(!window.__mapClickBound){ window.__mapClickBound = true; main.addEventListener('click', e=>{
    if(view!=='map') return;
    const pr = e.target.closest('[data-map-project]'); if(pr){ openProject(pr.dataset.mapProject); return; }
    const ct = e.target.closest('[data-map-contact]'); if(ct){ selectedId = ct.dataset.mapContact; view='detail'; confirmDeleteId=null; setActiveTab('navContacts'); renderMain(); }
  }); }
  const place = document.getElementById('mapPlace');
  const goPlace = async ()=>{
    const q = place.value.trim(); if(!q) return;
    try{ const g = await geocode(q); if(!g){ alert('Località non trovata.'); return; }
      mapNear = { ...g, label:q }; mapObj && mapObj.setView([g.lat, g.lng], 11); drawMapPoints(false); }
    catch(e){ alert(e.message||e); }
  };
  document.getElementById('mapPlaceBtn').addEventListener('click', goPlace);
  place.addEventListener('keydown', e=>{ if(e.key==='Enter') goPlace(); });
  document.getElementById('mapMeBtn').addEventListener('click', ()=>{
    if(!navigator.geolocation){ alert('Posizione non disponibile su questo dispositivo.'); return; }
    navigator.geolocation.getCurrentPosition(pos=>{ mapNear = { lat:pos.coords.latitude, lng:pos.coords.longitude, label:'te' }; mapObj && mapObj.setView([mapNear.lat, mapNear.lng], 11); drawMapPoints(false); },
      ()=>alert('Non riesco a leggere la tua posizione (permesso negato?).'), { enableHighAccuracy:false, timeout:10000 });
  });
  try{ await loadLeaflet(); }catch(e){ document.getElementById('mapBox').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  if(view!=='map' || !document.getElementById('mapBox')) return;
  if(mapObj){ mapObj.remove(); mapObj = null; }
  mapObj = L.map('mapBox', { zoomControl:true }).setView([45.07, 7.68], 8);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'© OpenStreetMap' }).addTo(mapObj);
  mapLayer = L.layerGroup().addTo(mapObj);
  drawMapPoints(true);
  if(mapNear) mapObj.setView([mapNear.lat, mapNear.lng], 11);
  runMapGeocoding();
}

  let body = {}; try{ body = await res.json(); }catch(e){}

}

// Cantieri dal portale (Progetti -> "Cantieri dal portale"): legge nel browser il PDF del
// portale NII Progetti (una scheda per progetto), senza inviarlo a nessun servizio (il PDF e'
// protetto da copyright). Per ogni cantiere: volume stimato = unita' abitative x metri di
// balconi per unita' x euro al metro (settings.portaleMl / portaleEuro, default 10 e 80),
// soggetti confrontati con la rubrica (email, telefono, nome, studio), punteggio.
// Di default solo nuove costruzioni. "Da seguire" / "Scarta" in collection "portale"
// ({pid, stato, dati, aggiornatoIl}); ID gia' visti in settings.portaleVisti, cosi' al PDF
// successivo si riconoscono i cantieri nuovi. "Crea progetto" apre il modulo precompilato
// (projects.portaleId = ID del portale).
// ---------------------------------------------------------------------------
// Lettura delle schede NII Progetti (PDF esportato dal portale): una scheda per progetto,
// colonna sinistra = descrizione e soggetti (Committenza, Progettazione, Impresa...),
// colonna destra = stato, categorie e dettagli (Valore stimato, Unita' abitative...).
// Le schede lunghe continuano sulla pagina dopo: si chiudono con "ID Progetto ... del ...".
// Intestazioni dei soggetti (colonna sinistra): si riconoscono dal testo, il grassetto non e'
// affidabile (pdf.js rinumera i font pagina per pagina).
const PORTAL_ROLE = /^(Committenza|Progettazione|Progetto (di|Impianti|Strutture|esecutivo|definitivo)|Appalto|Responsabile|Direzione|Coordinatore|Contatto|Masterplan|Studio di Fattibilit|Promotore|Consulenza|Propriet|Stazione Appaltante|VAS|Commercializzazione|Sviluppatore|Investitore|General Contractor|Concessionari|Gestione|Collaud|Subappalto|Fornitur)/i;
const PORTAL_SECTIONS = /^(Stato del Progetto|Livello di approfondimento|Categorie|Dettagli)$/;
function portalPageItems(items){
  return items.filter(it=>it.str && it.str.trim()).map(it=>({ x: it.transform[4], y: it.transform[5], s: it.str.trim(), bold: /_f3$/.test(it.fontName||'') }));
}
// Righe (stessa altezza) di un gruppo di item, dall'alto in basso.
function portalRows(items){
  const rows = [];
  items.slice().sort((a,b)=>b.y - a.y || a.x - b.x).forEach(it=>{
    const r = rows.find(r=>Math.abs(r.y - it.y) < 2.5);
    if(r) r.items.push(it); else rows.push({ y: it.y, items: [it] });
  });
  rows.forEach(r=>r.items.sort((a,b)=>a.x - b.x));
  return rows;
}
const PORTAL_SKIP = /^(Tel\. 02 3032181|Tutte le informazioni pubblicate|Powered by TCPDF)/;
function parsePortalPages(pages){   // pages = [[item...], ...] gia' passati da portalPageItems
  const projects = [];
  let cur = null, curRole = null;
  const finish = ()=>{ if(cur){ projects.push(cur); } cur = null; curRole = null; };
  pages.forEach((items, pi)=>{
    items = items.filter(it=>!PORTAL_SKIP.test(it.s) && it.y > 60 || /^ID Progetto$/.test(it.s) || (it.y > 60 && it.y < 90));
    const footer = portalRows(items.filter(it=>it.y < 90 && it.y > 60)).map(r=>r.items.map(i=>i.s).join(' ')).join(' ');
    const body = items.filter(it=>it.y >= 90);
    const left = body.filter(it=>it.x < 330), right = body.filter(it=>it.x >= 330);
    const lrows = portalRows(left);
    // nuova scheda: titolo in alto a sinistra (y > 770) in grassetto
    const titleRows = lrows.filter(r=>r.y > 770);
    if(titleRows.length && (!cur || cur.closed)){
      finish();
      // in alto a destra: comune (anche su piu' righe) e zona ("Piemonte - Cuneo")
      const rt = portalRows(right.filter(it=>it.y > 770)).map(r=>r.items.map(i=>i.s).join(' '));
      const iz = rt.findIndex(t=>/ - /.test(t));
      cur = { titolo: titleRows[0].items.map(i=>i.s).join(' '), indirizzo: titleRows.slice(1).map(r=>r.items.map(i=>i.s).join(' ')).join(' '),
        comune: (iz>0 ? rt.slice(0, iz) : rt.slice(0, 1)).join(' '), zona: iz>=0 ? rt[iz] : (rt[1]||''),
        descrizione: [], soggetti: [], stato: [], categorie: [], dettagli: {}, pagina: pi+1 };
    }
    if(!cur) return;
    // colonna sinistra: descrizione (x<120, prima dei ruoli), ruoli (grassetto x<120), soggetti (x>=120)
    let ent = null, lastY = null, lastHeaderY = null;
    lrows.filter(r=>r.y <= 770).forEach(r=>{
      const first = r.items[0];
      const line = r.items.map(i=>i.s).join(' ');
      if(first.x < 120 && line.length <= 60 && PORTAL_ROLE.test(line)){
        // due intestazioni di seguito (es. "Committenza" e "Appalto"): lo stesso soggetto ha entrambi i ruoli
        curRole = curRole && !ent && lastHeaderY!=null && lastHeaderY - r.y < 14 ? curRole + ' / ' + line : line;
        lastHeaderY = r.y; ent = null; lastY = null; return;
      }
      if(first.x < 120 && !curRole){ cur.descrizione.push(r.items.map(i=>i.s).join(' ')); return; }
      if(first.x < 120 && curRole){ // sotto-ruolo non in grassetto: va col ruolo
        curRole += ' – ' + r.items.map(i=>i.s).join(' '); return; }
      const text = r.items.map(i=>i.s);
      if(!ent || (lastY!=null && lastY - r.y > 13)){ ent = { ruolo: curRole || '', righe: [] }; cur.soggetti.push(ent); }
      ent.righe.push(...text); lastY = r.y;
    });
    // colonna destra: sezioni con intestazione centrata in grassetto
    let sect = null;
    portalRows(right.filter(it=>it.y <= 770)).forEach(r=>{
      const t = r.items.map(i=>i.s);
      if(r.items.length===1 && PORTAL_SECTIONS.test(t[0])){ sect = t[0]; return; }
      if(sect==='Stato del Progetto') cur.stato.push(t.join(' '));
      else if(sect==='Categorie') cur.categorie.push(t.join(' '));
      else if(sect==='Dettagli' && t.length>=2) cur.dettagli[t[0]] = t.slice(1).join(' ');
      else if(sect==='Livello di approfondimento') cur.livello = t.join(' ');
    });
    const m = /ID Progetto\s+(\d+)\s*-\s*Notizia\s+(\d+)\s+del\s+(\d{2}\/\d{2}\/\d{4})/.exec(footer);
    if(m){ cur.id = m[1]; cur.notizia = m[2]; cur.dataNotizia = m[3]; cur.closed = true; }
  });
  finish();
  // Le schede lunghe ripetono titolo e ID su ogni pagina: si uniscono le parti con lo stesso ID.
  const byId = new Map(), merged = [];
  projects.forEach(p=>{
    const prev = p.id && byId.get(p.id);
    if(!prev){ if(p.id) byId.set(p.id, p); merged.push(p); return; }
    prev.descrizione.push(...p.descrizione); prev.soggetti.push(...p.soggetti);
    prev.stato.push(...p.stato); prev.categorie.push(...p.categorie);
    Object.assign(prev.dettagli, p.dettagli);
  });
  return merged.map(portalNormalize);
}
function portalNum(s){ if(!s || /^ND$/i.test(s)) return null; const n = Number(String(s).replace(/[€\s.]/g,'').replace(',', '.')); return isFinite(n) ? n : null; }
function portalEntity(e){
  const out = { ruolo: e.ruolo, righe: e.righe, tel: [], email: [], web: '' };
  const rest = [];
  e.righe.forEach(l=>{
    let m;
    if((m = /^Tel\.:\s*(.+)$/.exec(l))) out.tel.push(m[1].replace(/[^\d+]/g,''));
    else if((m = /^Fax:/.exec(l))) {}
    else if((m = /^E-mail:\s*(\S+)/.exec(l))) out.email.push(m[1].toLowerCase());
    else if((m = /^Web:\s*(\S+)/.exec(l))) out.web = m[1];
    else rest.push(l);
  });
  // nome (prima riga), eventuale studio/societa', indirizzo e citta' (riga con CAP)
  const iCap = rest.findIndex(l=>/^\d{5}\s/.test(l));
  out.nome = rest[0] || '';
  out.citta = iCap>=0 ? rest[iCap] : '';
  out.via = iCap>0 ? rest[iCap-1] : '';
  out.altro = rest.slice(1, iCap>0 ? iCap-1 : rest.length).filter(Boolean);   // es. "Studio Tecnoprogetti"
  return out;
}
function portalNormalize(p){
  const d = p.dettagli;
  const statoTxt = p.stato.join(' ');
  return {
    id: p.id || '', titolo: p.titolo, indirizzo: p.indirizzo, comune: p.comune, zona: p.zona,
    descrizione: p.descrizione.join(' '),
    fase: (/Fase\s+(\S+)/.exec(statoTxt) || [])[1] || '',
    stato: p.stato.join(' · '),
    nuovaCostruzione: /Nuova costruzione/i.test(statoTxt),
    intervento: p.stato.filter(s=>!/^Fase /.test(s)).pop() || '',
    categorie: p.categorie.join(' · '),
    unita: portalNum(d['Unità abitative']),
    valore: portalNum(d['Valore stimato']),
    committente: d['Committente'] || '',
    inizio: d['Inizio cantiere'] || '', fine: d['Fine lavori'] || '', appalto: d['Appalto'] || '',
    dataNotizia: p.dataNotizia || '', pagina: p.pagina,
    soggetti: p.soggetti.map(portalEntity)
  };
}
let portalData = null, portalBusy = '', portalShow = 40, portalSaved = new Map();
let portalFilters = { ristrutturazioni:false, noti:false, nuovi:false, fase:'', prov:'', minUnita:0, q:'', vista:'tutti' };
function onPortalSnapshot(snap){
  portalSaved = new Map(snap.docs.map(d=>{ const x = { docId:d.id, ...d.data() }; return [x.pid, x]; }));
  if(view==='portal' && canAutoRender()) renderMain();
}
function portalMl(){ return Number(appSettings.portaleMl) > 0 ? Number(appSettings.portaleMl) : 10; }
function portalEuro(){ return Number(appSettings.portaleEuro) > 0 ? Number(appSettings.portaleEuro) : 80; }
function portalProv(p){ return (/\(\s*([A-Z]{2})\s*\)/.exec(p.indirizzo||'') || [])[1] || ''; }
function portalViaCitta(p){
  const m = /^(.*?)\s*\d{5}\s+(.+?)\s*\(\s*[A-Z]{2}\s*\)/.exec(p.indirizzo||'');
  return m ? { via: m[1].trim(), citta: m[2].trim() } : { via:'', citta: p.comune||'' };
}
// --- confronto con la rubrica ---
const PORTAL_TITLES = { 'arch.':'Architetto', 'ing.':'Ingegnere', 'geom.':'Geometra', 'p.i.':'Perito industriale', 'per.ind.':'Perito industriale', 'dott.':'', 'avv.':'Avvocato', 'arch':'Architetto', 'ing':'Ingegnere', 'geom':'Geometra' };
function digits9(s){ const d = String(s||'').replace(/\D/g,'').replace(/^0039|^39(?=\d{9,10}$)/,''); return d.length>=8 ? d.slice(-9) : ''; }
function portalIndex(){
  const ix = { email:new Map(), tel:new Map(), person:new Map(), studio:new Map() };
  contacts.forEach(c=>{
    if(c.email) ix.email.set(c.email.trim().toLowerCase(), c);
    [c.cellulare, c.telefono].forEach(t=>{ const d = digits9(t); if(d && !ix.tel.has(d)) ix.tel.set(d, c); });
    if(c.cognome && c.nome) ix.person.set(normName(c.cognome)+'|'+normName(c.nome), c);
    if(c.azienda){ const k = normStudio(c.azienda); if(k.length>=4 && !ix.studio.has(k)) ix.studio.set(k, c); }
  });
  return ix;
}
function portalPerson(nome){   // "Marengo arch. Viviana" -> {cognome, nome, professione}
  const m = /^(.+?)\s+(arch\.?|ing\.?|geom\.?|p\.i\.|per\.\s?ind\.|dott\.(?:ssa)?|avv\.)\s+(.+)$/i.exec(nome||'');
  if(!m) return null;
  return { cognome: m[1].trim(), nome: m[3].trim(), professione: PORTAL_TITLES[m[2].toLowerCase().replace(/\s/g,'')] ?? '' };
}
function portalMatch(s, ix){
  for(const e of s.email){ const c = ix.email.get(e); if(c) return { c, how:'email' }; }
  for(const t of s.tel){ const c = ix.tel.get(digits9(t)); if(c) return { c, how:'telefono' }; }
  const per = portalPerson(s.nome);
  if(per){ const c = ix.person.get(normName(per.cognome)+'|'+normName(per.nome)); if(c) return { c, how:'nome' }; }
  for(const n of [s.nome, ...(s.altro||[])]){ const c = ix.studio.get(normStudio(n)); if(c) return { c, how:'studio' }; }
  return null;
}
function portalScore(p, noti){
  const vol = p.unita ? p.unita * portalMl() * portalEuro() : null;
  const w = (p.fase==='Progettazione' ? 1.2 : p.fase==='Esecuzione' ? 0.6 : 1) * (p.nuovaCostruzione ? 1 : 0.5) * (noti ? 1.5 : 1);
  const prio = vol!=null ? vol * w : 0;
  return { vol, prio, stelle: vol==null ? 0 : prio >= 25000 ? 3 : prio >= 8000 ? 2 : 1 };
}
function portalAllRows(){
  if(!portalData) return [];
  const ix = portalIndex(), visti = portalData.visti || new Set();
  return portalData.projects.map(p=>{
    const matches = p.soggetti.map(s=>({ s, m: portalMatch(s, ix) }));
    const noti = matches.filter(x=>x.m);
    const proj = projects.find(x=>x.portaleId===p.id);
    return { p, matches, noti, proj, saved: portalSaved.get(p.id), nuovo: !visti.has(p.id), prov: portalProv(p), ...portalScore(p, noti.length>0) };
  });
}
function portalFiltered(rows){
  const f = portalFilters, q = normName(f.q);
  return rows.filter(r=>{
    const p = r.p;
    if(f.vista==='seguiti' && !(r.saved && r.saved.stato==='seguito')) return false;
    if(f.vista==='tutti' && r.saved && r.saved.stato==='scartato') return false;
    if(f.vista==='scartati' && !(r.saved && r.saved.stato==='scartato')) return false;
    if(!f.ristrutturazioni && !p.nuovaCostruzione) return false;
    if(f.noti && !r.noti.length) return false;
    if(f.nuovi && !r.nuovo) return false;
    if(f.fase==='presto' && p.fase==='Esecuzione') return false;
    if(f.fase && f.fase!=='presto' && p.fase!==f.fase) return false;
    if(f.prov && r.prov!==f.prov) return false;
    if(f.minUnita && !(p.unita >= f.minUnita)) return false;
    if(q && !normName([p.titolo, p.comune, p.descrizione, ...p.soggetti.map(s=>s.nome+' '+(s.altro||[]).join(' '))].join(' ')).includes(q)) return false;
    return true;
  }).sort((a,b)=>b.prio - a.prio || (b.p.unita||0) - (a.p.unita||0));
}
// I cantieri "da seguire" restano consultabili anche senza ricaricare il PDF.
function portalSavedRows(){
  const ix = portalIndex();
  return [...portalSaved.values()].filter(x=>x.stato==='seguito' && x.dati).map(x=>{

async function loadPortalPdf(file){
  portalBusy = 'Lettura del PDF…'; renderMain();
  try{
    await loadPdfJs();
    const doc = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
    const pages = [];
    for(let i=1; i<=doc.numPages; i++){
      const pg = await doc.getPage(i);
      pages.push(portalPageItems((await pg.getTextContent()).items));
      pg.cleanup();
      if(i % 25 === 0){ portalBusy = `Lettura del PDF: pagina ${i} di ${doc.numPages}…`; const el = document.querySelector('#main .card strong'); if(el) el.textContent = portalBusy; }
    }
    const list = parsePortalPages(pages).filter(p=>p.id);
    if(!list.length) throw new Error('nel PDF non ho trovato schede del portale (ID Progetto)');
    const prevVisti = new Set(String(appSettings.portaleVisti||'').split(',').filter(Boolean));
    portalData = { projects:list, file:file.name, visti:prevVisti };
    portalShow = 40;
    saveSettings({ portaleVisti: [...new Set([...prevVisti, ...list.map(p=>p.id)])].join(','), portaleCaricatoIl: Date.now() });
  }catch(e){ alert('Impossibile leggere il PDF: '+(e.message||e)); }
  portalBusy = ''; renderMain();
}

// ---------------------------------------------------------------------------
// Forecast: solo commesse aperte (ne' perse ne' con ordine confermato). Valore
// ponderato = importo offerta x probabilita' di chiusura. Campi sul progetto:
// probabilita (0-100; se assente si usa quella suggerita per la fase),
// chiusuraPrevista ('YYYY-MM', facoltativa) e ripartizione {'YYYY': %}: come si
// distribuisce sugli anni il fatturato ancora da fare (aperte: il ponderato;
// confermate: deliberato, o offerta, meno lo spedito). Senza ripartizione va tutto
// nell'anno di chiusura prevista (aperte) o nell'anno in corso (confermate).
// Il fatturato reale e' quello degli ordini (DDT), per data dell'ordine.
// ---------------------------------------------------------------------------
const FORECAST_DEFAULT_PROB = { none:10, richiesta:10, elaborati:20, propostaTecnica:30, offertaEconomica:40, offertaPresentata:50 };
let forecastSort = 'id';   // id | weighted | close
let budgetYear = String(new Date().getFullYear());
function forecastProb(p){
  if(p.probabilita!==undefined && p.probabilita!==null && p.probabilita!=='') return { value:Number(p.probabilita), suggested:false };
  const ph = projectPhase(p);
  return { value: FORECAST_DEFAULT_PROB[ph ? ph.key : 'none'] ?? 50, suggested:true };
}
function forecastWeighted(p){ const v = Number(p.importoOfferta); return isFinite(v) && p.importoOfferta!=null ? v * forecastProb(p).value / 100 : 0; }
function openForecastProjects(){ return projects.filter(p=>!isLost(p) && !isWon(p)); }
function quarterKey(ym){ if(!ym) return ''; const y = ym.slice(0,4), m = +ym.slice(5,7); return `${y}-Q${Math.ceil(m/3)}`; }
function quarterLabel(k){ return k ? `${k.slice(6)}° trimestre ${k.slice(0,4)}` : 'Senza data di chiusura'; }
function monthLabel(ym){ return ym ? `${MONTHS_LONG[+ym.slice(5,7)-1]} ${ym.slice(0,4)}` : ''; }

// --- Ripartizione del fatturato per anno ---
function currentYear(){ return String(new Date().getFullYear()); }
function splitYears(){ const y = +currentYear(); return [String(y), String(y+1), String(y+2)]; }
function defaultSplit(p){
  const y0 = currentYear(), c = isWon(p) ? '' : (p.chiusuraPrevista||'').slice(0,4);
  return { [c > y0 ? c : y0]: 100 };
}
function hasSplit(p){ return !!(p.ripartizione && Object.values(p.ripartizione).some(v=>Number(v)>0)); }
// Quote (0-1) per anno; quelle di anni gia' passati confluiscono nell'anno in corso.
function yearShares(p){
  const y0 = currentYear(), out = {};
  let tot = 0;
  Object.entries(hasSplit(p) ? p.ripartizione : defaultSplit(p)).forEach(([y, v])=>{
    v = Number(v)||0; if(v<=0) return;
    const k = y < y0 ? y0 : y; out[k] = (out[k]||0) + v; tot += v;
  });
  Object.keys(out).forEach(k=>out[k] /= tot);
  return out;
}
function shareIn(p, year){ return yearShares(p)[year] || 0; }
function supplyBase(p){ return p.importoDeliberato!=null ? Number(p.importoDeliberato)||0 : Number(p.importoOfferta)||0; }
function toShip(p){ return Math.max(0, supplyBase(p) - orderedTotal(p)); }
function shippingProjects(){ return projects.filter(p=>isWon(p) && toShip(p)>0); }
function invoicedInYear(year){
  return projects.filter(p=>!isLost(p)).reduce((s,p)=>s+(p.ordini||[]).filter(o=>(o.data||'').startsWith(year)).reduce((a,o)=>a+(Number(o.importo)||0), 0), 0);
}
function toShipInYear(year){ return shippingProjects().reduce((s,p)=>s+toShip(p)*shareIn(p, year), 0); }
function weightedInYear(year){ return openForecastProjects().reduce((s,p)=>s+forecastWeighted(p)*shareIn(p, year), 0); }
function estimateInYear(year){ return invoicedInYear(year) + toShipInYear(year) + weightedInYear(year); }
function splitInputsHtml(p){
  const sh = yearShares(p);
  return `<div class="fc-split" data-split-project="${p.id}">${splitYears().map(y=>`<label class="fc-split-y">${y}
      <span><input type="number" min="0" max="100" step="5" inputmode="numeric" data-split-year="${y}" value="${Math.round((sh[y]||0)*100)}"> %</span></label>`).join('')}</div>`;
}
function refreshSplitInputs(p){
  const sh = yearShares(p);
  document.querySelectorAll(`[data-split-project="${p.id}"] [data-split-year]`).forEach(i=>{ i.value = Math.round((sh[i.dataset.splitYear]||0)*100); });
}
// Si modifica un anno: gli anni precedenti restano (se ci stanno), il resto fino a 100
// va all'anno successivo (o, se si modifica l'ultimo, a quello prima).
function rebalanceSplit(vals, idx){
  const out = vals.map(v=>Math.max(0, Math.min(100, Math.round(v)||0)));
  let room = 100 - out[idx];
  for(let i=0; i<idx; i++){ out[i] = Math.min(out[i], room); room -= out[i]; }
  for(let i=idx+1; i<out.length; i++) out[i] = 0;
  if(idx < out.length-1) out[idx+1] = room;
  else if(room > 0) out[idx-1] += room;
  return out;
}
function bindSplits(fail){
  document.querySelectorAll('#main [data-split-project]').forEach(box=>{
    const p = projects.find(x=>x.id===box.dataset.splitProject);
    if(!p) return;
    const inputs = [...box.querySelectorAll('[data-split-year]')];
    inputs.forEach((inp, idx)=>{
      inp.addEventListener('keydown', e=>{ if(e.key==='Enter') inp.blur(); });
      inp.addEventListener('change', ()=>{
        if(inp.value==='' || !isFinite(Number(inp.value))){ refreshSplitInputs(p); return; }
        const vals = rebalanceSplit(inputs.map(i=>Number(i.value)), idx);
        const rip = {};
        inputs.forEach((i, k)=>{ i.value = vals[k]; if(vals[k]>0) rip[i.dataset.splitYear] = vals[k]; });
        p.ripartizione = rip; refreshForecastFigures(p);
        db.collection('projects').doc(p.id).update({ ripartizione:rip, updatedAt:Date.now() }).catch(fail);
      });
    });
  });
}

function forecastSummaryHtml(){
  const open = openForecastProjects();
  const year = currentYear();
  const offerte = open.reduce((s,p)=>s+(Number(p.importoOfferta)||0), 0);
  const ponderato = open.reduce((s,p)=>s+forecastWeighted(p), 0);
  const confermato = projects.filter(p=>isWon(p) && (p.fasi.confermaOrdine||'').startsWith(year)).reduce((s,p)=>s+(Number(projectAmount(p))||0), 0);

  return `<div class="fc-tiles">
      ${tile('Commesse aperte', String(open.length), `offerte per ${fmtEuro(offerte)}`)}
      ${tile('Forecast ponderato', fmtEuro(ponderato), offerte ? `${Math.round(ponderato*100/offerte)}% del valore in offerta` : '')}
      ${tile(`Conferme d'ordine ${year}`, fmtEuro(confermato), 'commesse confermate nell\'anno')}
      ${tile(`Fatturato stimato ${year}`, fmtEuro(estimateInYear(year)), `spedito + da spedire + forecast nel ${year}`)}
    </div>

}

// --- Budget di fatturato (settings.budget {'YYYY': euro}) ---
const fmtBudget = v=>new Intl.NumberFormat('it-IT', { maximumFractionDigits:2, useGrouping:'always' }).format(v);
function budgetOf(year){ const v = (appSettings.budget||{})[year]; return v==null || v==='' ? null : Number(v); }
function budgetYears(){ return [...new Set([...splitYears().slice(0,2), ...Object.keys(appSettings.budget||{})])].sort(); }
function budgetFiguresHtml(){
  const budget = budgetOf(budgetYear);
  const fatt = invoicedInYear(budgetYear), ship = toShipInYear(budgetYear), fc = weightedInYear(budgetYear);
  const stima = fatt + ship + fc;
  const legend = `<div class="budget-legend">
      <span><i class="budget-inv"></i>Fatturato (merce spedita) <strong>${fmtEuro(fatt)}</strong>${budget ? ` · ${Math.round(fatt*100/budget)}%` : ''}</span>
      <span><i class="budget-ship"></i>Confermato da spedire nel ${budgetYear} <strong>${fmtEuro(ship)}</strong></span>
      <span><i class="budget-fc"></i>Forecast nel ${budgetYear} <strong>${fmtEuro(fc)}</strong></span>
    </div>`;
  if(!budget) return `${legend}<div class="budget-msg">Stima ${budgetYear}: <strong>${fmtEuro(stima)}</strong>. Inserisci il budget per vedere a che punto sei.</div>`;
  const pc = v=>Math.round(v*100/budget);
  const w = [fatt, ship, fc].reduce((acc, v)=>{ const used = acc.reduce((a,b)=>a+b, 0); acc.push(Math.max(0, Math.min(100-used, v*100/budget))); return acc; }, []);
  const gap = budget - fatt, gapAll = budget - stima;
  // Scala 0 - budget sotto la barra; sopra il fatturato attuale, sotto la stima dell'anno.
  const eur0 = v=>new Intl.NumberFormat('it-IT', { maximumFractionDigits:0, useGrouping:'always' }).format(v)+' €';
  // Freccia centrata esattamente sul valore; il testo le sta accanto (a sinistra se il valore e' oltre il 70%).
  const pin = (v, cls, arrow, text)=>{ const x = Math.max(0, Math.min(100, v*100/budget));
    return `<span class="budget-pin ${cls}" style="left:${x}%;">${arrow}</span><span class="budget-mark ${cls}" style="left:${x}%;transform:translateX(${x>70 ? 'calc(-100% - 8px)' : '8px'});">${text}</span>`; };
  const at = v=>{ const x = Math.max(0, Math.min(100, v*100/budget)); return `left:${x}%;transform:translateX(${x<12 ? '0' : x>88 ? '-100%' : '-50%'});`; };
  return `<div class="budget-marks top">${pin(fatt, 'inv', '▼', `Fatturato ${eur0(fatt)}`)}</div>
    <div class="budget-track" title="Fatturato ${fmtEuro(fatt)} · da spedire ${fmtEuro(ship)} · forecast ${fmtEuro(fc)}">
      <div class="budget-inv" style="width:${w[0]}%;"></div><div class="budget-ship" style="width:${w[1]}%;"></div><div class="budget-fc" style="width:${w[2]}%;"></div>
      ${[25,50,75].map(t=>`<i class="budget-tick" style="left:${t}%;"></i>`).join('')}
    </div>
    <div class="budget-marks">${pin(stima, 'est', '▲', `Stima ${eur0(stima)}`)}</div>
    <div class="budget-axis">${[0,25,50,75,100].map(t=>`<span class="${t%50 ? 'q' : ''}" style="${at(budget*t/100)}">${eur0(budget*t/100)}</span>`).join('')}</div>
    ${legend}
    <div class="budget-msg ${gap<=0 ? 'ok' : ''}">${gap<=0
      ? `Budget raggiunto: ${fmtEuro(-gap)} di fatturato oltre l'obiettivo (${pc(fatt)}%).`
      : `Mancano <strong>${fmtEuro(gap)}</strong> di fatturato al budget. Con le confermate da spedire e il forecast la stima è ${fmtEuro(stima)} (${pc(stima)}% del budget)${gapAll<=0
          ? ': obiettivo alla portata.'
          : `: servono altri ${fmtEuro(gapAll)} di nuove trattative.`}`}</div>`;
}

function bindBudget(){
  document.getElementById('budgetYear').addEventListener('change', e=>{ budgetYear = e.target.value; renderMain(); });
  const inp = document.getElementById('budgetInput');
  const save = ()=>{
    const n = parseEuro(inp.value);
    const cur = budgetOf(budgetYear);
    if(Number.isNaN(n) || (n!=null && n<0)){ inp.value = cur!=null ? fmtBudget(cur) : ''; return; }
    inp.value = n!=null ? fmtBudget(n) : '';
    if(n===cur) return;
    const budget = { ...(appSettings.budget||{}) };
    if(n==null) delete budget[budgetYear]; else budget[budgetYear] = n;
    saveSettings({ budget });
    document.getElementById('budgetFig').innerHTML = budgetFiguresHtml();
  };
  inp.addEventListener('blur', save);
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') inp.blur(); });
}

// Ponderato delle aperte per anno secondo la ripartizione; dentro l'anno la quota cade nel
// trimestre di chiusura prevista se e' quello l'anno, altrimenti e' "ripartita sull'anno".
function forecastQuartersHtml(){
  const y0 = currentYear(), years = new Map();
  openForecastProjects().forEach(p=>{
    const w = forecastWeighted(p), off = Number(p.importoOfferta)||0;
    const ym = p.chiusuraPrevista||'', cy = ym.slice(0,4);
    Object.entries(yearShares(p)).forEach(([y, s])=>{
      const g = years.get(y) || { n:0, offerta:0, ponderato:0, subs:new Map() };
      g.n++; g.offerta += off*s; g.ponderato += w*s;
      const k = !ym ? 'nodate' : y===cy ? quarterKey(ym) : cy < y0 && y===y0 ? 'late' : 'split';
      g.subs.set(k, (g.subs.get(k)||0) + w*s);
      years.set(y, g);
    });
  });
  if(!years.size) return '<div class="empty">Nessuna commessa aperta.</div>';
  const SUB_ORDER = { split:1, late:2, nodate:3 };
  const subLabel = k=>k==='split' ? 'ripartito sull\'anno (chiusura in un altro anno)' : k==='late' ? 'chiusura prevista già passata' : k==='nodate' ? 'senza data di chiusura' : quarterLabel(k);
  const max = Math.max(1, ...[...years.values()].map(g=>g.ponderato));
  return [...years.keys()].sort().map(y=>{ const g = years.get(y);
    const subs = [...g.subs.entries()].sort((a,b)=>(SUB_ORDER[a[0]]||0)-(SUB_ORDER[b[0]]||0) || a[0].localeCompare(b[0]));
    return `<div class="fc-q-row">
      <div class="fc-q-label">${y} <span>${g.n} ${g.n===1?'commessa':'commesse'}</span></div>
      <div class="fc-q-track"><div class="fc-q-bar" style="width:${Math.max(1, Math.round(g.ponderato*100/max))}%;"></div></div>
      <div class="fc-q-num"><strong>${fmtEuro(g.ponderato)}</strong><span>su ${fmtEuro(g.offerta)}</span></div>
    </div>
    <div class="fc-q-subs">${subs.map(([k, v])=>`<div><span>${subLabel(k)}</span><span>${fmtEuro(v)}</span></div>`).join('')}</div>`; }).join('');
}

// --- Report PDF da condividere: parte alta come a video + tabelle dei progetti ---
function loadHtml2Pdf(){
  if(window.html2pdf) return Promise.resolve();
  return new Promise((resolve, reject)=>{
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
    sc.onload = ()=>resolve();
    sc.onerror = ()=>reject(new Error('libreria PDF non caricata, controlla la connessione'));
    document.head.appendChild(sc);
  });
}

  const sum = (list, f)=>list.reduce((s,p)=>s+(Number(f(p))||0), 0);
  // Tabelle fatte di righe a blocco (.rep-row): html2pdf sa non spezzarle tra due pagine, i <tr> no.
  const cell = (v, cls)=>`<div class="${cls||''}">${v}</div>`;
  const row = (cells, cls)=>`<div class="rep-row ${cls||''}">${cells.join('')}</div>`;
  const openRows = open.map((p, i)=>{ const ph = projectPhase(p); return row([
      cell(esc(p.codice||''), 'rep-code'), cell(projCellHtml(p)), cell(ph ? esc(ph.label) : '—'),
      cell(fmtEuro(p.importoOfferta), 'num'), cell(forecastProb(p).value+'%', 'num'), cell(`<strong>${p.importoOfferta!=null ? fmtEuro(forecastWeighted(p)) : '—'}</strong>`, 'num'),
      cell(p.chiusuraPrevista ? esc(monthLabel(p.chiusuraPrevista)) : '—'), cell(splitText(p))], i%2 ? 'rep-alt' : ''); });
  const shipRows = ship.map((p, i)=>{ const s = supplyInfo(p); return row([
      cell(esc(p.codice||''), 'rep-code'), cell(projCellHtml(p)),
      cell(fmtEuro(supplyBase(p)), 'num'), cell(s ? s.pct+'%' : '—', 'num'), cell(`<strong>${fmtEuro(toShip(p))}</strong>`, 'num'), cell(splitText(p))], i%2 ? 'rep-alt' : ''); });
  // Titolo, intestazione e prima riga restano insieme; il resto puo' passare alla pagina dopo.
  const tableCard = (cls, title, head, rows, tot)=>`<div class="rep-section">
      <div class="rep-keep"><h3>${title}</h3><div class="rep-table ${cls}">${head}${rows[0]||''}</div></div>
      <div class="rep-table ${cls}" style="margin-top:0;">${rows.slice(1).join('')}${tot}</div></div>`;
  return `<div class="fc-report">
    <div class="rep-head"><div><div class="rep-title">Forecast commerciale</div><div class="rep-sub">Situazione al ${fmtDate(todayISO())}</div></div><div class="rep-brand">Registro Chiamate</div></div>
    ${forecastSummaryHtml()}
    <div class="card rep-keep" style="margin-top:14px;"><h3 style="margin:0;">Budget di fatturato ${budgetYear}${budget ? `: ${fmtEuro(budget)}` : ''}</h3>${budgetFiguresHtml()}</div>
    <div class="card rep-keep" style="margin-top:14px;"><h3>Forecast ponderato per anno</h3>${forecastQuartersHtml()}</div>
    ${open.length ? tableCard('rep-open', `Commesse aperte (${open.length})`,
        row(['ID','Progetto','Fase','Offerta','Prob.','Ponderato','Chiusura prevista','Fatturato per anno'].map((h, i)=>cell(h, [3,4,5].includes(i) ? 'num' : '')), 'rep-th'),
        openRows,
        row([cell(''), cell('Totale'), cell(''), cell(fmtEuro(sum(open, p=>p.importoOfferta)), 'num'), cell(''), cell(fmtEuro(sum(open, forecastWeighted)), 'num'), cell(''), cell('')], 'rep-tot'))
      : '<div class="rep-section"><h3>Commesse aperte</h3><div class="fc-note">Nessuna commessa aperta.</div></div>'}
    ${ship.length ? tableCard('rep-ship', `Confermate ancora da spedire (${ship.length})`,
        row(['ID','Progetto','Deliberato','Spedito','Da spedire','Fatturato per anno'].map((h, i)=>cell(h, [2,3,4].includes(i) ? 'num' : '')), 'rep-th'),
        shipRows,
        row([cell(''), cell('Totale'), cell(fmtEuro(sum(ship, supplyBase)), 'num'), cell(''), cell(fmtEuro(sum(ship, toShip)), 'num'), cell('')], 'rep-tot'))
      : '<div class="rep-section"><h3>Confermate ancora da spedire</h3><div class="fc-note">Nessuna commessa confermata con merce ancora da spedire.</div></div>'}
  </div>`;
}
// A4 orizzontale; i riquadri piccoli (.rep-keep) e le righe delle tabelle non si spezzano tra due pagine.
function forecastPdfWorker(){
  const el = document.createElement('div');
  el.innerHTML = forecastReportHtml();
  return html2pdf().set({
    margin: [8, 8, 10, 8],
    filename: `forecast-${todayISO()}.pdf`,
    image: { type:'jpeg', quality:0.95 },
    // Niente windowWidth: con una finestra diversa da quella reale il report (centrato da html2pdf)
    // verrebbe disegnato spostato e tagliato. L'aspetto da desktop lo garantiscono le regole .fc-report.
    html2canvas: { scale:2, backgroundColor:'#ffffff', scrollX:0, scrollY:0 },
    jsPDF: { unit:'mm', format:'a4', orientation:'landscape' },
    pagebreak: { mode:['css', 'legacy'], avoid:['.rep-row', '.rep-keep', '.fc-tiles', 'h3'] }
  }).from(el.firstElementChild);
}
async function exportForecastPdf(btn){
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = 'Preparazione PDF…';
  try{
    await loadHtml2Pdf();
    await forecastPdfWorker().save();
  }catch(e){ alert('Impossibile creare il PDF: '+(e.message||e)); }
  btn.disabled = false; btn.textContent = label;
}

// Aggiorna riepilogo, trimestri, budget e valori della riga senza ridisegnare i campi.
function refreshForecastFigures(p){
  const s = document.getElementById('fcSummary'); if(s) s.innerHTML = forecastSummaryHtml();
  const q = document.getElementById('fcQuarters'); if(q) q.innerHTML = forecastQuartersHtml();
  const bf = document.getElementById('budgetFig'); if(bf) bf.innerHTML = budgetFiguresHtml();
  const row = document.querySelector(`#fcRows [data-fc-project="${p.id}"]`);
  if(row){
    row.querySelector('.fc-weighted').textContent = p.importoOfferta!=null ? fmtEuro(forecastWeighted(p)) : '—';
    const sugg = row.querySelector('.fc-sugg'); if(sugg && !forecastProb(p).suggested) sugg.remove();
  }
  refreshSplitInputs(p);   // senza ripartizione salvata segue la chiusura prevista
}
function bindForecast(){
  document.getElementById('fcSort').addEventListener('change', e=>{ forecastSort = e.target.value; renderMain(); });
  document.getElementById('fcPdfBtn').addEventListener('click', e=>exportForecastPdf(e.currentTarget));
  bindBudget();
  bindTrend();
  document.querySelectorAll('#fcRows [data-open-project], #fcShipRows [data-open-project]').forEach(el=>el.addEventListener('click', ()=>openProject(el.dataset.openProject)));
  const fail = e=>alert('Errore nel salvataggio: '+(e.message||e.code||''));
  bindSplits(fail);
  document.querySelectorAll('#fcRows [data-fc-project]').forEach(row=>{
    const p = projects.find(x=>x.id===row.dataset.fcProject);
    if(!p) return;
    // Probabilita': si salva all'uscita dal campo (o con Invio), tra 0 e 100.
    const prob = row.querySelector('.fc-prob');
    const saveProb = ()=>{
      const n = Math.round(Number(prob.value));
      if(prob.value==='' || !isFinite(n) || n<0 || n>100){ prob.value = forecastProb(p).value; return; }
      if(!forecastProb(p).suggested && n===Number(p.probabilita)) return;
      prob.value = n; p.probabilita = n; refreshForecastFigures(p);
      db.collection('projects').doc(p.id).update({ probabilita:n, updatedAt:Date.now() }).catch(fail);
    };
    prob.addEventListener('change', saveProb);
    prob.addEventListener('keydown', e=>{ if(e.key==='Enter') prob.blur(); });
    // Chiusura prevista (mese): stesso criterio delle date della timeline, anno 2000-2100.
    const close = row.querySelector('.fc-close');
    const saveClose = ()=>{
      const v = close.value;
      if(v===(p.chiusuraPrevista||'')) return;
      if(v && !(/^\d{4}-\d{2}$/.test(v) && +v.slice(0,4)>=2000 && +v.slice(0,4)<=2100)){ close.value = p.chiusuraPrevista||''; return; }
      p.chiusuraPrevista = v; refreshForecastFigures(p);
      db.collection('projects').doc(p.id).update({ chiusuraPrevista:v, updatedAt:Date.now() }).catch(fail);
    };
    close.addEventListener('blur', saveClose);
    close.addEventListener('change', ()=>{ if(document.activeElement!==close) saveClose(); });
  });
}

// Gli aggiornamenti in tempo reale non ridisegnano i moduli mentre si scrive.
// Nel Forecast non si ridisegna mentre si sta scrivendo in un campo (le cifre si aggiornano a parte).
function canAutoRender(){
  const typing = document.activeElement && document.activeElement.matches && document.activeElement.matches('#main input');
  return view!=='new' && view!=='projectForm' && view!=='settings' && view!=='map' && !(view==='call' && callStep==='entry') && !((view==='forecast' || view==='portal') && typing)
    && !(view==='projectDetail' && (orderEdit || loseFormProjectId));

function onProjectsSnapshot(snap){

// Una fase conta come raggiunta solo se la sua data e' oggi o passata (le date future sono "previste").
function phaseDone(p, key){ const d = p.fasi && p.fasi[key]; return !!d && d <= todayISO(); }
function projectPhase(p){ let cur = null; PROJECT_PHASES.forEach(ph=>{ if(phaseDone(p, ph.key)) cur = ph; }); return cur; }
function projectTitle(p){ return p.nome ? `${p.codice} · ${p.nome}` : (p.codice||''); }
function orderedTotal(p){ return (p.ordini||[]).reduce((s,o)=>s+(Number(o.importo)||0), 0); }
function projectOrders(p){ return (p.ordini||[]).slice().sort((a,b)=>(a.data||'').localeCompare(b.data||'') || (a.consegna||'').localeCompare(b.consegna||'')); }
// Valore della commessa: offerta finche' non e' confermata; poi il deliberato (o l'offerta),
// oppure il totale ordinato se con gli ordini (materiale aggiunto) lo supera.
function projectAmount(p){
  if(!phaseDone(p, 'confermaOrdine')) return p.importoOfferta;
  const base = p.importoDeliberato!=null ? p.importoDeliberato : p.importoOfferta;
  const ord = orderedTotal(p);
  return ord > (Number(base)||0) ? ord : base;
}
function fmtEuro(v){ return (v===null || v===undefined || v==='' || isNaN(v)) ? '—' : new Intl.NumberFormat('it-IT', { style:'currency', currency:'EUR', useGrouping:'always' }).format(v); }
function fmtNum(v){ return (v===null || v===undefined || v==='' || isNaN(v)) ? '' : new Intl.NumberFormat('it-IT', { minimumFractionDigits:2, maximumFractionDigits:2, useGrouping:'always' }).format(v); }
// "12.345,67" / "12345.67" / "12.345" / "€ 1.200" -> numero; '' -> null; testo non valido -> NaN
function parseEuro(s){
  s = String(s||'').replace(/[€\s]/g,'');
  if(!s) return null;
  if(s.includes(',')) s = s.replace(/\./g,'').replace(',', '.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,'');
  const n = Number(s);
  return isFinite(n) ? Math.round(n*100)/100 : NaN;
}
// Ordine delle commesse: per ID crescente (il piu' vecchio in alto, i piu' recenti sotto).
function byProjectId(a, b){ return String(a.codice||'').localeCompare(String(b.codice||''), undefined, { numeric:true }); }
function projectsOfContact(contactId){ return projects.filter(p=>(p.partecipanti||[]).some(x=>x.contactId===contactId)).sort(byProjectId); }
// Commessa persa (chiusa) / chiusa con ordine confermato / in corso.
function isLost(p){ return p.esito==='persa'; }
function isWon(p){ return !isLost(p) && phaseDone(p, 'confermaOrdine'); }
function projectStateClass(p){ return isLost(p) ? 'proj-lost' : isWon(p) ? 'proj-won' : ''; }
function phaseBadge(p){
  if(isLost(p)) return '<span class="phase-badge lost">Persa</span>';
  const ph = projectPhase(p);
  return `<span class="phase-badge ${isWon(p) ? 'won' : ''}">${ph ? esc(ph.label) : 'Da avviare'}</span>`;
}
function guessRole(c){

}

// Commesse confermate: percentuale di merce spedita (ordini/DDT) sul deliberato, o
// sull'offerta se il deliberato non e' indicato; oltre il 100% si suggerisce di adeguare.
function supplyInfo(p){
  if(!isWon(p)) return null;
  const base = p.importoDeliberato!=null ? p.importoDeliberato : p.importoOfferta;
  if(!base) return null;
  const tot = orderedTotal(p);
  return { base, tot, pct: Math.round(tot*100/base), baseLbl: p.importoDeliberato!=null ? 'deliberato' : 'offerta' };
}
function supplyRowHtml(p){
  const s = supplyInfo(p);
  if(!s) return '';
  return `<div class="supply-row ${s.pct>100 ? 'over' : ''}">
    <span class="supply-label">Merce spedita</span>
    <div class="supply-track"><div class="supply-bar" style="width:${Math.min(100, s.pct)}%;"></div></div>
    <strong>${s.pct}%</strong>
    <div class="supply-note">${fmtEuro(s.tot)} su ${fmtEuro(s.base)} (${s.baseLbl})${s.pct>100 ? ' · oltre il deliberato: adegua la conferma d\'ordine' : ''}</div>
  </div>`;
}
// Mini-timeline per l'elenco: un punto per fase (pieno = fatta, bordo giallo = prevista),
// barra di avanzamento fino alla fase attuale (punto evidenziato) e, a parole, fase attuale,
// da quanti giorni e' ferma (in rosso da 30 giorni) e prossima fase.
function phaseTrackHtml(p){
  const today = todayISO(), cur = projectPhase(p);
  const idx = cur ? PROJECT_PHASES.findIndex(ph=>ph.key===cur.key) : -1;
  const last = PROJECT_PHASES.length - 1;
  const pct = idx>0 ? idx/last : 0;
  const dots = PROJECT_PHASES.map((ph,i)=>{
    const d = p.fasi && p.fasi[ph.key];
    const cls = d ? (d<=today ? 'done' : 'planned') : '';
    return `<span class="pt-dot ${cls} ${i===idx ? 'current' : ''}" title="${esc(ph.label)}${d ? ': '+fmtDate(d) : ''}${d && d>today ? ' (prevista)' : ''}"></span>`;
  }).join('');
  let text;
  if(isLost(p)) text = `<strong>Persa</strong>${p.persaIl ? ` il ${fmtDate(p.persaIl)}` : ''}${cur ? ` · era a: ${esc(cur.label)}` : ''}`;
  else if(cur && cur.key==='cantiereFinito') text = `<strong>Cantiere finito</strong> il ${fmtDate(p.fasi.cantiereFinito)}`;
  else{
    const doneDates = PROJECT_PHASES.map(ph=>p.fasi && p.fasi[ph.key]).filter(d=>d && d<=today).sort();
    const lastDate = doneDates[doneDates.length-1];
    const days = lastDate ? daysBetween(lastDate, today) : null;
    const next = PROJECT_PHASES[idx+1];
    text = `<strong>${cur ? esc(cur.label) : 'Da avviare'}</strong>`
      + (days!=null ? ` · <span class="${days>=30 && !isWon(p) ? 'ptrack-stall' : ''}">ferma da ${days} ${days===1 ? 'giorno' : 'giorni'}</span>` : '')
      + (next ? ` · prossima: ${esc(next.label)}${next.owner ? ` (${esc(next.owner)})` : ''}` : '');
  }
  return `<div class="ptrack ${isLost(p) ? 'lost' : ''}">
    <div class="ptrack-bar"><div class="ptrack-fill" style="width:calc((100% - 12px) * ${pct.toFixed(3)});"></div>${dots}</div>
    <div class="ptrack-text">${text}</div>
  </div>`;
}

async function saveProject(){
  const p = window.__editingProject || {};
  const err = msg=>{ document.getElementById('projFormErr').textContent = msg; };
  const codice = document.getElementById('fPCodice').value.trim();
  if(!/^\d{7}$/.test(codice)) return err('L\'ID progetto deve essere di 7 cifre.');
  const dup = projects.find(x=>x.codice===codice && x.id!==p.id);
  if(dup) return err(`Esiste già un progetto con ID ${codice}${dup.nome ? ' ('+dup.nome+')' : ''}.`);
  const importo = parseEuro(document.getElementById('fPImporto').value);
  if(Number.isNaN(importo)) return err('Importo dell\'offerta non valido (es. 12.500,00).');
  const byLabel = new Map(contacts.map(c=>[normName(contactLabel(c)), c.id]));
  const partecipanti = [], problems = [];
  document.querySelectorAll('#fPParts .part-row').forEach(row=>{
    const txt = row.querySelector('.part-contact').value.trim();
    const ruolo = row.querySelector('.part-role').value;
    if(!txt) return;
    const id = byLabel.get(normName(txt));
    if(!id) problems.push(`"${txt}" non è nell'elenco contatti (sceglilo dai suggerimenti o crealo prima in Contatti)`);
    else if(!ruolo) problems.push(`indica il ruolo di ${txt}`);
    else partecipanti.push({ contactId:id, ruolo });
  });
  if(problems.length) return err(problems.join('; ')+'.');
  const data = {
    codice, nome: document.getElementById('fPNome').value.trim(),
    via: document.getElementById('fPVia').value.trim(), citta: document.getElementById('fPCitta').value.trim(),
    importoOfferta: importo, offertaUrl: document.getElementById('fPUrl').value.trim(),
    note: document.getElementById('fPNote').value.trim(), partecipanti, updatedAt: Date.now()
  };
  try{
    if(p.id){ await db.collection('projects').doc(p.id).update(data); selectedProjectId = p.id; }
    else{
      const rich = document.getElementById('fPRichiesta').value;
      const ref = await db.collection('projects').add({ ...data, fasi: rich ? { richiesta: rich } : {}, importoDeliberato: null, createdAt: Date.now(), ...(p.portaleId ? { portaleId: p.portaleId } : {}) });
      selectedProjectId = ref.id;
    }
    window.__editingProject = null; view = 'projectDetail'; setActiveTab('navProjects'); renderMain();
  }catch(e){ err('Errore nel salvataggio: '+(e.message||e.code||'')); }
}
