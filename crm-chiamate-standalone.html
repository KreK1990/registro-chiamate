<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registro Chiamate</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#00487E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Registro">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&family=Fira+Sans+Condensed:wght@600;700;800&family=Fira+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<style>
:root{
  --bg:#EEEEEE; --panel:#FFFFFF; --border:#D3DBE5; --border-strong:#BEC8DA; --text:#1A1A1A; --muted:#5F6B77; --trend-1:#2a6fb0; --trend-2:#b97f00;
  --accent:#00487E; --accent-soft:#E3E9F1; --on-accent:#FFFFFF; --brand-yellow:#DC9D00; --danger:#B3261E;
  --serif:"Fira Sans Condensed","Arial Narrow",sans-serif;
  --sans:"Fira Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"Fira Mono",ui-monospace,monospace;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1822; --panel:#14222F; --border:#27394B; --border-strong:#34506A; --text:#E6ECF2; --muted:#98A8B8; --trend-1:#4a8acb; --trend-2:#c08a10;
    --accent:#7DB2E3; --accent-soft:#1B3246; --on-accent:#0D1822; --danger:#F08C80;
  }
  :root:not([data-theme="light"]) .followup.due{background:#3E1F1C;}
}
:root[data-theme="dark"]{
  --bg:#0D1822; --panel:#14222F; --border:#27394B; --border-strong:#34506A; --text:#E6ECF2; --muted:#98A8B8; --trend-1:#4a8acb; --trend-2:#c08a10;
  --accent:#7DB2E3; --accent-soft:#1B3246; --on-accent:#0D1822; --danger:#F08C80;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);height:100%;-webkit-font-smoothing:antialiased;}
html,body{height:100%;}
.layout{display:flex;flex-direction:column;height:100vh;height:100dvh;}
.app{display:flex;flex:1;min-height:0;}
.bottom-cal{flex-shrink:0;border-top:1px solid var(--border);background:var(--panel);padding:9px 26px 11px;max-height:30vh;overflow-y:auto;}
.sidebar{width:320px;min-width:260px;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--panel);}
.main{flex:1;overflow-y:auto;padding:28px 32px;}
.sidebar-head{padding:20px 18px 14px;border-bottom:1px solid var(--border);}
.sidebar-head h1{font-family:var(--serif);font-weight:700;font-size:23px;letter-spacing:.2px;margin:0 0 2px;color:var(--text);}
.brand-sub{font-size:11.5px;color:var(--muted);letter-spacing:.3px;margin:0 0 14px;}
input,textarea,select{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:5px;background:var(--bg);color:var(--text);font-size:14px;font-family:var(--sans);transition:border-color .15s;}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);}
textarea{resize:vertical;min-height:60px;}
.btn{cursor:pointer;border:1px solid var(--text);border-radius:5px;padding:9px 15px;font-size:13.5px;font-weight:500;font-family:var(--sans);background:var(--text);color:var(--bg);letter-spacing:.1px;transition:opacity .15s;}
.btn:hover{opacity:.85;}
.btn.secondary{background:transparent;color:var(--text);border-color:var(--border);}
.btn.small{padding:6px 11px;font-size:12.5px;}
.btn.block{width:100%;margin-top:8px;}
.contact-list{overflow-y:auto;flex:1;}
.contact-item{padding:12px 18px;border-bottom:1px solid var(--border);cursor:pointer;border-left:3px solid transparent;transition:background .1s,border-color .1s;}
.contact-item:hover{background:var(--accent-soft);}
.contact-item.active{background:var(--accent-soft);border-left-color:var(--accent);}
.contact-item .name{font-weight:600;font-size:14px;}
.contact-item .sub{font-size:12px;color:var(--muted);margin-top:2px;}
.empty{color:var(--muted);padding:16px;font-size:14px;font-style:italic;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:20px;margin-bottom:18px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px;letter-spacing:.2px;}
h2{font-family:var(--serif);font-weight:700;margin:0 0 4px;font-size:24px;}
h3{font-family:var(--serif);font-weight:700;font-size:18px;margin:0 0 12px;color:var(--accent);}
.call-item{border-left:2px solid var(--accent);padding:8px 0 8px 12px;margin-bottom:10px;}
.call-item .date{font-size:12px;color:var(--muted);font-family:var(--mono);}
.call-item .esito{display:inline-block;font-size:11px;font-weight:500;padding:2px 8px;border-radius:4px;background:var(--accent-soft);color:var(--accent);margin-left:6px;}
.call-item .note{font-size:14px;margin-top:4px;white-space:pre-wrap;}
.top-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-bottom:12px;}
.followup{display:inline-block;font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:4px;margin-top:8px;border:1px solid transparent;}
.followup.ok{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);}
.followup.due{background:#F8E1DF;color:var(--danger);border-color:var(--danger);}
:root[data-theme="dark"] .followup.due{background:#3E1F1C;}
.custom-row{margin-top:6px;}
.nav{display:flex;flex-wrap:wrap;gap:4px;padding:2px 18px 0;border-bottom:1px solid var(--border);}
.nav button{flex:1 1 30%;padding:10px 4px;border:none;border-bottom:2px solid transparent;background:transparent;color:var(--muted);font-size:12px;font-family:var(--sans);cursor:pointer;font-weight:500;letter-spacing:.1px;margin-bottom:-1px;transition:color .15s,border-color .15s;white-space:nowrap;}
.nav button{position:relative;}
.nav-badge{position:absolute;top:2px;right:4px;min-width:15px;height:15px;padding:0 3px;border-radius:999px;background:var(--danger);color:#fff;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1;font-family:var(--sans);}
.nav button:hover{color:var(--text);}
.nav button.active{color:var(--accent);border-bottom-color:var(--accent);}
.day-group{margin-bottom:24px;}
.day-title{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--text);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border);}
table.calls-table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);border-radius:6px;overflow:hidden;}
table.calls-table th,table.calls-table td{text-align:left;padding:9px 12px;font-size:13px;border-bottom:1px solid var(--border);}
table.calls-table th{color:var(--muted);font-weight:600;background:var(--accent-soft);font-size:11.5px;letter-spacing:.2px;}
table.calls-table tr:last-child td{border-bottom:none;}
table.calls-table tbody tr[data-call-id]:hover{background:var(--accent-soft);}
.table-wrap{overflow-x:auto;}
.subnav{display:flex;gap:8px;margin-bottom:16px;}
.subnav button{padding:6px 13px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12.5px;font-family:var(--sans);cursor:pointer;font-weight:500;}
.subnav button.active{background:var(--text);color:var(--bg);border-color:var(--text);}
.week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;}
.week-nav .week-label{font-family:var(--serif);font-size:16px;}
.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:6px;overflow:hidden;min-width:918px;}
.calendar-day{background:var(--panel);padding:10px;min-height:130px;}
.calendar-day-head{font-size:11.5px;color:var(--muted);margin-bottom:8px;font-weight:600;letter-spacing:.2px;}
.calendar-day-head.today{color:var(--accent);}
.appt-chip{background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:5px 7px;font-size:12px;margin-bottom:5px;cursor:pointer;line-height:1.35;}
.appt-chip .t{font-family:var(--mono);font-weight:500;}
.appt-chip:hover{opacity:.8;}
.bar-clickable:hover{fill:color-mix(in srgb, var(--accent) 8%, transparent);}
.sidebar-today{flex:1;overflow-y:auto;padding:16px;border-top:1px solid var(--border);min-height:0;}
.sidebar-today-title{font-family:var(--serif);font-size:15px;margin-bottom:2px;}
.sidebar-today-date{font-size:11px;color:var(--muted);margin-bottom:14px;}
.mini-section-label{font-size:10px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase;margin:14px 0 6px;}
.mini-section-label:first-of-type{margin-top:0;}
.mini-row{font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--border);cursor:pointer;line-height:1.4;}
.mini-row:hover{color:var(--accent);}
.mini-row:last-of-type{border-bottom:none;}
.mini-time{font-family:var(--mono);color:var(--accent);margin-right:4px;}
.mini-empty{font-size:11.5px;color:var(--muted);font-style:italic;padding:2px 0;}
.addr-link{color:var(--accent);text-decoration:none;}
.addr-link:hover{text-decoration:underline;}
.tel-link{white-space:nowrap;font-weight:500;}
.map-embed{margin-top:12px;height:240px;border:1px solid var(--border);border-radius:2px;overflow:hidden;background:var(--accent-soft);}
.map-embed iframe{display:block;width:100%;height:100%;border:0;}
.ac-wrap{position:relative;}
.ac-list{position:absolute;left:0;right:0;top:100%;z-index:30;background:var(--panel);border:1px solid var(--border-strong);border-top:none;max-height:260px;overflow-y:auto;box-shadow:0 6px 16px rgba(0,0,0,.12);}
.ac-item{padding:9px 11px;cursor:pointer;border-top:1px solid var(--border);}
.ac-item:first-child{border-top:none;}
.ac-item:hover{background:var(--accent-soft);}
.ac-name{font-weight:600;font-size:14px;color:var(--accent);}
.ac-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.imp-map{display:grid;grid-template-columns:minmax(150px,230px) 1fr;gap:8px 12px;align-items:center;}
.funnel-row{display:grid;grid-template-columns:minmax(150px,210px) 1fr 90px;grid-template-areas:"label track num" ". note .";gap:2px 12px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--border);cursor:pointer;}
.funnel-row:last-child{border-bottom:none;}
.funnel-row:hover{background:var(--accent-soft);}
.funnel-label{grid-area:label;font-size:14px;font-weight:600;}
.funnel-track{grid-area:track;height:20px;background:var(--bg);border-radius:2px;overflow:hidden;}
.funnel-bar{height:100%;border-radius:2px;}
.funnel-num{grid-area:num;text-align:right;font-size:13px;color:var(--muted);white-space:nowrap;}
.funnel-num strong{font-size:17px;color:var(--text);}
.funnel-note{grid-area:note;font-size:12px;color:var(--muted);}
.proj-code{font-family:var(--mono);font-size:12.5px;color:var(--muted);letter-spacing:.5px;}
.fc-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;}
.fc-tile{background:var(--panel);border:1px solid var(--border);border-radius:2px;padding:12px 14px;}
.budget-marks{position:relative;height:17px;font-size:12px;}
.budget-marks.top{margin-top:10px;}
.budget-mark{position:absolute;top:1px;white-space:nowrap;font-weight:600;}
.budget-pin{position:absolute;top:1px;transform:translateX(-50%);font-size:10px;line-height:16px;}
.budget-mark{line-height:16px;}
.budget-mark.inv,.budget-pin.inv{color:var(--accent);}
.budget-mark.est,.budget-pin.est{color:#a77700;}
.budget-axis{position:relative;container-type:inline-size;height:16px;font-size:11px;color:var(--muted);border-top:1px dashed var(--border);padding-top:2px;}
.budget-axis span{position:absolute;top:2px;white-space:nowrap;}
@container (max-width:480px){ .budget-axis span.q{display:none;} }
.budget-tick{position:absolute;top:0;bottom:0;width:1px;background:rgba(0,0,0,.2);}
.budget-track{position:relative;display:flex;height:14px;margin-top:2px;background:var(--bg);border:1px solid var(--border);border-radius:2px;overflow:hidden;}
.budget-inv{background:var(--accent);}
.budget-ship{background:#7aa3c7;}
.fc-split-cell{grid-column:1/-1;}
.fc-split{display:flex;gap:6px 14px;flex-wrap:wrap;}
.fc-split-y{display:flex;align-items:center;gap:6px;margin:0;font-size:13px;color:var(--muted);}
.fc-split-y span{display:flex;align-items:center;gap:3px;color:var(--text);}
.fc-split input{width:70px;}
.fc-ship-row{display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--border);}
.budget-fc{background-color:var(--brand-yellow);background-image:repeating-linear-gradient(135deg,var(--brand-yellow) 0 6px,#e9be4d 6px 12px);}
.budget-legend{display:flex;gap:6px 18px;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:var(--muted);}
.budget-legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px;border-radius:2px;}
.budget-msg{margin-top:8px;font-size:13.5px;}
.budget-msg.ok{color:var(--success,#2e7d32);font-weight:600;}
.backup-list{margin-top:10px;max-width:420px;}
.backup-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);font-size:14px;}
.fc-tile:nth-child(2){border-top:3px solid var(--brand-yellow);}
.fc-label{font-size:12px;color:var(--muted);}
.fc-value{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--accent);margin-top:2px;}
.fc-note{font-size:11.5px;color:var(--muted);margin-top:2px;}
.fc-q-row{display:grid;grid-template-columns:minmax(170px,230px) 1fr auto;gap:4px 12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);}
.fc-q-row:last-child{border-bottom:none;}
.fc-q-label{font-size:13.5px;font-weight:600;}
.fc-q-label span{font-weight:400;color:var(--muted);font-size:12px;margin-left:4px;}
.fc-q-row:has(+ .fc-q-subs){border-bottom:none;padding-bottom:2px;}
.fc-report{width:100%;box-sizing:border-box;background:#fff;color:var(--text);font-family:var(--sans,inherit);}
.fc-report .card{box-shadow:none;}
/* Il report PDF ha sempre l'impaginazione da desktop: le regole sotto battono quelle del
   telefono (@media max-width:720px), cosi' i salti pagina calcolati sulla finestra reale
   coincidono con il disegno del PDF. */
.fc-report .card{padding:20px;margin-bottom:18px;row-gap:normal !important;column-gap:normal !important;}
.fc-report .fc-tiles{grid-template-columns:repeat(4,minmax(0,1fr));}
.fc-report .fc-value{font-size:22px;}
.fc-report .fc-q-row{grid-template-columns:minmax(170px,230px) 1fr auto;}
.fc-report .fc-q-track{grid-column:auto;grid-row:auto;}
.trend-legend{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:10px;}
.trend-legend strong{color:var(--text);}
.trend-sw{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:3px;}
.trend-sw.stima{background:var(--trend-1);}
.trend-sw.ponderato{background:var(--trend-2);}
.trend-sw.budget{background:none;border-top:2px dashed var(--muted);height:0;}
.trend-plot{position:relative;height:180px;margin-left:58px;margin-top:6px;}
.trend-plot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
.trend-grid{stroke:var(--border);stroke-width:1;}
.trend-budget{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:6 4;}
.trend-line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;}
.trend-line.stima{stroke:var(--trend-1);}
.trend-line.ponderato{stroke:var(--trend-2);}
.trend-dot{position:absolute;width:9px;height:9px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 2px var(--panel);pointer-events:none;}
.trend-dot.stima{background:var(--trend-1);}
.trend-dot.ponderato{background:var(--trend-2);}
.trend-ylab{position:absolute;right:calc(100% + 8px);transform:translateY(-50%);font-size:11px;color:var(--muted);white-space:nowrap;}
.trend-hit{position:absolute;top:0;bottom:0;cursor:pointer;}
.trend-hit.on{background:linear-gradient(to right,transparent calc(50% - 0.5px),var(--border-strong) calc(50% - 0.5px),var(--border-strong) calc(50% + 0.5px),transparent calc(50% + 0.5px));}
.trend-tip{position:absolute;top:-6px;transform:translateY(-100%);z-index:2;background:var(--panel);border:1px solid var(--border-strong);border-radius:4px;padding:7px 10px;font-size:12.5px;line-height:1.5;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.12);pointer-events:none;}
.trend-tip.hidden{display:none;}
.trend-x{position:relative;height:18px;margin-left:58px;margin-top:4px;font-size:11px;color:var(--muted);}
.trend-x span{position:absolute;transform:translateX(-50%);white-space:nowrap;}
.trend-table{margin-top:8px;}
.trend-table summary{cursor:pointer;}
.trend-trow{display:grid;grid-template-columns:1.2fr 1.4fr 1.2fr 1.4fr 0.6fr;gap:10px;padding:4px 8px;border-bottom:1px solid var(--border);font-size:12.5px;}
.trend-trow span:not(:first-child){text-align:right;}
.trend-th{font-weight:600;color:var(--muted);}
.pdf-info{border-left:3px solid var(--accent);background:var(--panel);padding:8px 12px;margin-bottom:10px;font-size:13px;display:grid;gap:4px;}
.pdf-warn{color:var(--danger);font-weight:600;}
.attach-row{display:flex;justify-content:space-between;align-items:center;gap:6px 12px;flex-wrap:wrap;padding:7px 0;border-bottom:1px solid var(--border);}
.attach-main{display:flex;flex-direction:column;min-width:0;flex:1 1 220px;}
.attach-main .name-link{font-weight:600;cursor:pointer;word-break:break-word;}
.pdf-attach{display:flex;align-items:center;gap:8px;margin:0;font-size:13px;color:var(--text);cursor:pointer;}
.pdf-attach input{width:auto;margin:0;}
.map-box{height:calc(100vh - 260px);min-height:360px;border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-bottom:12px;z-index:0;position:relative;}
.map-tools{display:flex;justify-content:space-between;gap:10px 18px;flex-wrap:wrap;align-items:center;}
.map-search{display:flex;gap:6px;flex:1 1 320px;}
.map-search input{flex:1;min-width:0;}
.map-filters{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;}
.map-filter{display:flex;align-items:center;gap:6px;margin:0;cursor:pointer;color:var(--text);}
.map-filter input{width:auto;margin:0;}
.map-sw{display:inline-block;width:11px;height:11px;margin-right:4px;vertical-align:-1px;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25);}
.map-sw.cl,.map-mk.cl{border-radius:50%;background:#2a6fb0;}
.map-sw.sq.aperti,.map-mk.sq.aperti{background:#b97f00;}
.map-sw.sq.confermati,.map-mk.sq.confermati{background:#7a4fb5;}
.map-sw.sq.persi,.map-mk.sq.persi{background:#fff;border-color:#8a96a3;box-shadow:0 0 0 1px #8a96a3;}
.map-mk{width:14px;height:14px;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;color:#fff;font:700 9px/1 var(--sans);}
.map-mk.sq{border-radius:2px;}
.map-pop{font-size:13px;line-height:1.45;min-width:180px;}
.map-pop .name-link{font-weight:600;cursor:pointer;}
.map-pop-c{margin-top:6px;}
.map-pop-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.map-pop-actions .btn{text-decoration:none;}
.ai-prio{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:9px;font-size:11px;font-weight:600;background:var(--bg);color:var(--muted);border:1px solid var(--border);}

.portal-people{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px 16px;margin-top:8px;font-size:13px;}

.portal-param{width:52px;display:inline-block;padding:2px 6px;font-size:12.5px;}

.todo-section{margin-top:10px;}

.todo-act .btn.small{padding:2px 8px;font-size:12px;}

.todo-linked{color:var(--accent);font-weight:600;}
.todo-section + .todo-section{margin-top:16px;}
.todo-title{font-weight:700;font-size:14px;color:var(--accent);}
.todo-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px 14px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--border);}
.todo-main{flex:1 1 260px;min-width:0;font-size:14px;}
.todo-main .name-link{font-weight:600;cursor:pointer;}
.todo-sub{font-size:12.5px;color:var(--muted);margin-top:2px;}
.todo-actions{display:flex;gap:6px;flex-wrap:wrap;}

.todo-sets{display:grid;gap:8px;max-width:560px;}

.rep-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid var(--accent);padding-bottom:8px;margin-bottom:14px;}
.rep-title{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--accent);}
.rep-brand{font-weight:600;color:var(--brand-yellow);}
.rep-sub{font-size:11.5px;color:var(--muted);}
.rep-section{margin-top:22px;}
.rep-table{font-size:12px;margin-top:6px;}
.rep-row{display:grid;gap:0 12px;padding:5px 8px;border-bottom:1px solid var(--border);align-items:start;}
.rep-open .rep-row{grid-template-columns:70px minmax(0,2fr) minmax(0,1.2fr) 105px 45px 105px minmax(0,1fr) minmax(0,1.3fr);}

.rep-alt{background:#f5f7fa;}
.rep-th{background:var(--accent);color:#fff;font-weight:600;border-bottom:none;padding:6px 8px;}
.rep-tot{font-weight:700;border-top:2px solid var(--accent);border-bottom:none;}
.rep-table .num{text-align:right;white-space:nowrap;}
.rep-code{font-family:monospace;white-space:nowrap;}
.fc-addr{color:var(--muted);font-size:13px;}
.fc-q-subs{padding:2px 0 8px 14px;border-bottom:1px solid var(--border);font-size:12.5px;color:var(--muted);}
.fc-q-subs div{display:flex;justify-content:space-between;gap:10px;padding:1px 0;}
.fc-q-track{height:16px;background:var(--bg);border-radius:2px;overflow:hidden;}
.fc-q-bar{height:100%;background:var(--accent);}
.fc-q-num{text-align:right;white-space:nowrap;font-size:13px;}
.fc-q-num span{display:block;font-size:11.5px;color:var(--muted);}
.fc-row .fc-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
.fc-row .proj-code{margin-right:6px;}
.fc-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 14px;align-items:end;}
.fc-amount{font-size:15px;font-weight:600;padding:8px 0;}
.fc-weighted{color:var(--accent);}
.fc-sugg{font-size:10.5px;color:var(--brand-yellow);font-weight:600;text-transform:uppercase;letter-spacing:.3px;}
.phase-badge{display:inline-block;padding:3px 9px;border-radius:2px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600;white-space:nowrap;}
.phase-badge.done,.phase-badge.won{background:var(--accent);color:var(--on-accent);}
.phase-badge.lost{background:var(--border);color:var(--muted);}
.card.proj-won{border-left:4px solid var(--brand-yellow);background:color-mix(in srgb, var(--brand-yellow) 9%, var(--panel));}
.card.proj-lost{opacity:.55;filter:grayscale(1);}
.card.proj-lost:hover{opacity:.8;}
tr.proj-lost td{opacity:.5;}
tr.proj-won td{background:color-mix(in srgb, var(--brand-yellow) 12%, transparent);}
tr.proj-won td:first-child{box-shadow:inset 4px 0 0 var(--brand-yellow);}
.proj-state-banner{font-size:14px;}
.proj-state-banner.lost{background:var(--bg);border-color:var(--border-strong);color:var(--muted);}
.proj-state-banner.won{border-left:4px solid var(--brand-yellow);background:color-mix(in srgb, var(--brand-yellow) 12%, var(--panel));}
.timeline{list-style:none;margin:0;padding:0;}
.timeline li{display:grid;grid-template-columns:22px 1fr auto;grid-template-areas:"dot text date" ". extra extra";gap:4px 10px;align-items:center;padding:9px 0;position:relative;}
.timeline li::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:2px;background:var(--border);}
.timeline li:first-child::before{top:50%;}
.timeline li:last-child::before{bottom:50%;}
.timeline .dot{grid-area:dot;width:14px;height:14px;border-radius:50%;border:2px solid var(--border-strong);background:var(--panel);justify-self:center;position:relative;z-index:1;}
.timeline li.done .dot{background:var(--accent);border-color:var(--accent);}
.timeline li.planned .dot{border-color:var(--brand-yellow);}
.timeline .ph-label{font-weight:600;font-size:14px;}
.timeline li:not(.done):not(.planned) .ph-label{color:var(--muted);font-weight:500;}
.timeline .ph-owner{font-size:12px;color:var(--muted);}
.timeline .ph-date{grid-area:date;display:flex;gap:6px;align-items:center;}
.timeline .ph-date input{width:auto;}
.timeline .ph-extra{grid-area:extra;background:var(--bg);padding:8px 10px;border-radius:2px;}
.part-row{display:grid;grid-template-columns:1fr 230px auto;grid-template-areas:"contact role del";gap:8px;margin-bottom:8px;}
.part-row .part-contact{grid-area:contact;}
.part-row .part-role{grid-area:role;}
.part-row .part-del{grid-area:del;}
.part-item{border-bottom:1px solid var(--border);padding:9px 0;}
.part-item:last-child{border-bottom:none;}
.part-item summary{list-style:none;cursor:pointer;}
.part-item summary::-webkit-details-marker{display:none;}
.part-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13.5px;}
.part-toggle{font-size:12.5px;color:var(--accent);margin-top:5px;font-weight:600;}
.part-toggle::before{content:"\25B8  ";}
details[open] > summary .part-toggle::before{content:"\25BE  ";}
.part-history{margin:8px 0 2px 4px;border-left:2px solid var(--border);padding-left:12px;}
.hist-item{padding:8px 6px;border-bottom:1px dashed var(--border);cursor:pointer;}
.hist-item:last-child{border-bottom:none;}
.hist-item:hover{background:var(--accent-soft);}
.hist-item.linked{box-shadow:inset 3px 0 0 var(--brand-yellow);padding-left:10px;}
.hist-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;}
.hist-date{font-family:var(--mono);font-size:12px;color:var(--muted);}
.hist-tag{font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:1px 6px;border-radius:2px;}
.hist-note{font-size:13.5px;white-space:pre-wrap;margin-top:3px;}
.hist-sub{font-size:12.5px;color:var(--muted);margin-top:2px;}
.hist-meet{margin-top:6px;padding-left:10px;border-left:2px solid var(--accent-soft);}
.order-summary{background:var(--bg);padding:10px 12px;border-radius:2px;margin-bottom:8px;font-size:13.5px;}
.order-track{height:8px;background:var(--panel);border:1px solid var(--border);border-radius:2px;overflow:hidden;margin:6px 0 4px;}
.order-bar{height:100%;background:var(--brand-yellow);}
.order-note{font-size:12.5px;color:var(--muted);}
.order-note.extra{color:var(--accent);font-weight:600;}
.order-item{display:grid;grid-template-columns:1fr auto;grid-template-areas:"main actions" "sub actions";gap:2px 12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);}
.order-item:last-of-type{border-bottom:none;}
.order-main{grid-area:main;}
.order-amount{font-size:15px;font-weight:700;margin-right:6px;}
.order-meta{font-size:12.5px;color:var(--muted);}
.order-sub{grid-area:sub;font-size:12.5px;color:var(--muted);}
.order-done{color:var(--accent);font-weight:600;}
.order-actions{grid-area:actions;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;}
.order-form{background:var(--bg);padding:10px 12px;border-radius:2px;margin:8px 0;}
.appt-search{display:flex;gap:8px;align-items:center;margin:0 0 14px;}
.appt-search input{flex:1;}
.proj-chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);padding:4px 4px 4px 9px;border-radius:2px;font-size:13px;font-weight:600;margin:0 6px 6px 0;}
.supply-row{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"label track pct" "note note note";gap:2px 10px;align-items:center;margin-top:8px;font-size:12.5px;}
.supply-label{grid-area:label;color:var(--muted);}
.supply-track{grid-area:track;height:8px;background:var(--bg);border:1px solid var(--border);border-radius:2px;overflow:hidden;}
.supply-bar{height:100%;background:var(--brand-yellow);}
.supply-row > strong{grid-area:pct;}
.supply-note{grid-area:note;color:var(--muted);font-size:12px;}
.supply-row.over .supply-bar{background:var(--danger);}
.supply-row.over > strong,.supply-row.over .supply-note{color:var(--danger);font-weight:600;}
.order-summary.over{box-shadow:inset 3px 0 0 var(--danger);}

.ptrack{margin-top:10px;}
.ptrack-bar{position:relative;display:flex;justify-content:space-between;align-items:center;height:16px;}
.ptrack-bar::before{content:"";position:absolute;left:6px;right:6px;top:50%;height:3px;margin-top:-1.5px;background:var(--border);border-radius:2px;}
.ptrack-fill{position:absolute;left:6px;top:50%;height:3px;margin-top:-1.5px;background:var(--accent);border-radius:2px;}
.pt-dot{position:relative;z-index:1;width:12px;height:12px;border-radius:50%;background:var(--panel);border:2px solid var(--border-strong);box-sizing:border-box;flex:none;}
.pt-dot.done{background:var(--accent);border-color:var(--accent);}
.pt-dot.planned{border-color:var(--brand-yellow);}
.pt-dot.current{transform:scale(1.35);box-shadow:0 0 0 3px color-mix(in srgb, var(--brand-yellow) 55%, transparent);}
.ptrack-text{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.45;}
.ptrack-text strong{color:var(--text);}
.ptrack-stall{color:var(--danger);font-weight:600;}
.ptrack.lost .pt-dot.done,.ptrack.lost .ptrack-fill{background:var(--muted);border-color:var(--muted);}
.ptrack.lost .pt-dot.current{box-shadow:none;}

.proj-head{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start;}
.proj-head .proj-map{margin-top:0;height:230px;}
.dash-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:6px;}
.dash-legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px;border-radius:2px;}
.dash-tile{cursor:pointer;}
.dash-tile:hover{background:var(--accent-soft);}
.proj-chip-addr{display:block;font-weight:400;font-size:11.5px;color:var(--muted);}
.proj-chip button{border:none;background:transparent;color:inherit;font-size:17px;line-height:1;cursor:pointer;padding:0 5px;}
.appt-proj-chips:empty{display:none;}


.imp-map label{margin:0;font-size:13px;color:var(--text);}
.name-link{cursor:pointer;color:var(--accent);}
.name-link:hover,[data-contact-id]:hover .name-link{text-decoration:underline;}
.tag-pill{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:500;margin:4px 4px 0 0;}
.esito-tag{display:inline-block;padding:2px 9px;border-radius:4px;font-size:12px;font-weight:500;}
.esito-tag.appt{background:var(--accent);color:var(--panel);font-weight:600;}
table.calls-table tbody tr.row-appt{background:color-mix(in srgb, var(--accent-soft) 55%, transparent);}
table.calls-table tbody tr.row-appt:hover{background:var(--accent-soft);}
.bottom-cal-inner{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap;}
.bottom-cal-left{flex:0 0 auto;}
.bottom-cal-right{flex:1 1 220px;min-width:200px;max-width:320px;border-left:1px solid var(--border);padding-left:24px;}
.bottom-cal-right h4{font-family:var(--serif);font-weight:700;font-size:14.5px;margin:0 0 10px;}
.month-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;max-width:640px;}
.month-header .label{font-family:var(--serif);font-size:14.5px;min-width:150px;text-align:center;}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:6px;overflow:hidden;max-width:640px;}
.month-grid .dow{background:var(--accent-soft);color:var(--muted);font-size:9.5px;font-weight:600;text-align:center;padding:2px 0;letter-spacing:.3px;}
.month-cell{background:var(--panel);min-height:27px;padding:2px 5px;}
.month-cell.other-month{opacity:.35;}
.month-cell.today .daynum{color:var(--accent);font-weight:700;}
.month-cell.has-appt{cursor:pointer;}
.month-cell.has-appt:hover{background:var(--accent-soft);}
.month-cell.selected{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent);}
.month-cell .daynum{font-size:10.5px;line-height:1.2;}
.month-cell .dots{display:flex;gap:2px;margin-top:1px;flex-wrap:wrap;}

.day-appts-strip{display:flex;flex-direction:column;gap:6px;}
.day-appt-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 10px;background:var(--bg);border:1px solid var(--border);border-radius:5px;font-size:13px;cursor:pointer;}
.day-appt-row:hover{background:var(--accent-soft);}
.gate{max-width:420px;margin:10vh auto;padding:0 20px;}
.gate h2{margin-bottom:6px;}
.gate p{color:var(--muted);font-size:13.5px;line-height:1.5;margin:0 0 16px;}
.gate textarea{min-height:120px;font-family:var(--mono);font-size:12px;}
.gate .err{color:var(--danger);font-size:13px;margin-top:8px;}
.hidden{display:none !important;}
/* Stile Schock: blu istituzionale, angoli squadrati, titoli condensed, accento giallo */
h2{color:var(--accent);font-weight:800;}
.sidebar-head h1{color:var(--accent);font-weight:800;letter-spacing:0;display:flex;align-items:center;gap:9px;}
.sidebar-head h1::before{content:"";width:13px;height:13px;background:var(--brand-yellow);flex:none;}
.topbar-title{color:var(--accent);}
.btn{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600;border-radius:2px;}
.btn.secondary{background:var(--panel);color:var(--accent);border-color:var(--border-strong);}

.contact-item.active{border-left-color:var(--brand-yellow);}
.call-item{border-left-color:var(--accent);}
.week-nav .week-label,.sidebar-today-title,.month-header .label{font-weight:700;}

.head-actions .btn{flex:1;font-size:11px;padding:6px;}

.gate .link-row{margin-top:14px;font-size:13px;}
.gate .ok{color:var(--accent);font-size:13px;margin-top:8px;}

  .sidebar-today{flex:none;overflow:visible;}
  .sidebar .bottom-cal{max-height:none;overflow:visible;padding:14px 16px 18px;}
  .bottom-cal-left{width:100%;}

function renderConfigGate(err){

function renderLoginGate(err, info, emailValue){
  showGate(`
    <h2>Accedi</h2>
    <p>Accedi con l'email e la password del tuo account.</p>
    <label>Email</label><input id="loginEmail" type="email" autocomplete="username" value="${esc(emailValue||'')}">
    <div style="margin-top:10px;"></div>

    ${info?`<div class="ok">${esc(info)}</div>`:''}
    <div class="link-row"><a href="#" id="resetPassLink" style="color:var(--accent);">Password dimenticata?</a></div>
    ${FIREBASE_CONFIG?'':`<p style="margin-top:18px;font-size:12px;">Configurazione errata? <a href="#" id="resetCfgLink" style="color:var(--accent);">Cambia progetto Firebase</a></p>`}
  `);
  const doLogin = async ()=>{

  };
  document.getElementById('loginBtn').addEventListener('click', doLogin);
  document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

// Configurazione del progetto Firebase (non è un segreto: la protezione dei dati è
// affidata al login e alle regole di Firestore). Se è impostata qui, i colleghi non
// devono incollare nulla al primo accesso; se è null si usa quella salvata nel browser.
const FIREBASE_CONFIG = {"apiKey":"AIzaSyBOA1oZUMLONDDAddWQ5P3tWEZz5GLdmWI","authDomain":"registro-chiamate.firebaseapp.com","projectId":"registro-chiamate","storageBucket":"registro-chiamate.firebasestorage.app","messagingSenderId":"457672432964","appId":"1:457672432964:web:574fbc366261aa3f0acb11"};

// Ogni utente legge e scrive solo nel proprio archivio: users/<uid>/contacts e
// users/<uid>/calls (le regole di Firestore impediscono l'accesso a quello degli altri).
// Le scritture non aspettano la conferma del server oltre pochi secondi: senza rete
// Firestore le tiene sul dispositivo e le invia quando la connessione torna, mentre
// l'app prosegue (altrimenti un salvataggio offline resterebbe in attesa all'infinito).
// add() crea l'ID sul dispositivo, cosi' e' subito disponibile anche offline.
function settleWrite(p, value){
  p.catch(e=>console.warn('Scrittura non riuscita:', e));
  return Promise.race([p.then(()=>value), new Promise(r=>setTimeout(()=>r(value), 2500))]);
}
function firestoreAdapter(uid){
  const fs = firebase.firestore();
  const base = fs.collection('users').doc(uid);
  return {
    collection(path){
      const col = base.collection(path);
      return {
        onSnapshot: (...a)=>col.onSnapshot(...a),
        get: (...a)=>col.get(...a),
        add(data){ const ref = col.doc(); return settleWrite(ref.set(data), ref); },
        doc(id){
          const d = col.doc(id);
          return { id: d.id, get: ()=>d.get(), onSnapshot: (...a)=>d.onSnapshot(...a),
            update: data=>settleWrite(d.update(data)), set: (data, opt)=>settleWrite(d.set(data, opt||{})), delete: ()=>settleWrite(d.delete()) };
        }
      };
    },
    doc(path){ return fs.doc(`users/${uid}/${path}`); }
  };
}

function boot(){
  let cfg = FIREBASE_CONFIG;
  if(!cfg){
    const raw = localStorage.getItem('firebaseConfig');
    if(!raw){ renderConfigGate(); return; }
    try{ cfg = JSON.parse(raw); }catch(e){ localStorage.removeItem('firebaseConfig'); renderConfigGate(); return; }
  }
  try{
    if(!firebase.apps.length){
      firebase.initializeApp(cfg);
      // Archivio anche sul dispositivo: l'app si apre e registra chiamate senza rete e
      // sincronizza quando la connessione torna. Se il browser non lo consente si resta online.
      firebase.firestore().enablePersistence({ synchronizeTabs:true }).catch(()=>{});
    }
  }catch(e){ renderConfigGate('Errore di inizializzazione: '+(e.message||'')); return; }
  firebase.auth().onAuthStateChanged(user=>{
    if(!user){ stopListeners(); resetSession(); renderLoginGate(); return; }
    hideGate();
    document.getElementById('userLine').textContent = user.email || '';
    startApp(user.uid);
    checkLegacyMigration(user.uid);
  });
}

// Importazione dall'archivio condiviso della versione mono-utente (collezioni
// "contacts" e "calls" alla radice). Si propone solo se l'archivio personale è
// vuoto e quello vecchio è leggibile; la copia mantiene gli stessi ID dei documenti
// (così le chiamate restano collegate ai contatti) e non modifica l'originale.
async function checkLegacyMigration(uid){
  const fs = firebase.firestore();
  let legacyC, legacyK;
  try{
    const mine = await fs.collection('users').doc(uid).collection('contacts').limit(1).get();
    if(!mine.empty) return;
    [legacyC, legacyK] = await Promise.all([fs.collection('contacts').get(), fs.collection('calls').get()]);
  }catch(e){ return; } // archivio vecchio non accessibile (regole): niente da importare
  if(legacyC.empty && legacyK.empty) return;
  showNotice(`<strong>Archivio precedente trovato:</strong> ${legacyC.size} contatti e ${legacyK.size} chiamate.
    <div class="notice-hint">Vuoi copiarli nel tuo archivio personale? L'archivio precedente non viene modificato né cancellato.</div>
    <div class="notice-actions"><button class="btn small" id="migrateBtn">Copia nel mio archivio</button><button class="btn secondary small" id="noticeClose">Non ora</button></div>`);
  document.getElementById('migrateBtn').addEventListener('click', ()=>migrateLegacy(uid, legacyC, legacyK));
}
async function migrateLegacy(uid, legacyC, legacyK){
  const fs = firebase.firestore();
  const base = fs.collection('users').doc(uid);
  showNotice('Copia in corso, non chiudere l\'app…');
  try{
    const ops = [];
    legacyC.forEach(d=>ops.push([base.collection('contacts').doc(d.id), d.data()]));
    legacyK.forEach(d=>ops.push([base.collection('calls').doc(d.id), d.data()]));
    for(let i=0; i<ops.length; i+=400){
      const batch = fs.batch();
      ops.slice(i, i+400).forEach(([ref, data])=>batch.set(ref, data));
      await batch.commit();
    }
    const [c2, k2] = await Promise.all([base.collection('contacts').get(), base.collection('calls').get()]);
    if(c2.size >= legacyC.size && k2.size >= legacyK.size){
      showNotice(`<strong>Copia completata:</strong> ${c2.size} contatti e ${k2.size} chiamate sono ora nel tuo archivio personale.
        <div class="notice-actions"><button class="btn small" id="noticeClose">Chiudi</button></div>`);
    }else{
      showNotice(`<strong>Copia incompleta:</strong> ${c2.size} contatti su ${legacyC.size} e ${k2.size} chiamate su ${legacyK.size}.
        <div class="notice-actions"><button class="btn small" id="migrateRetryBtn">Riprova</button></div>`);
      document.getElementById('migrateRetryBtn').addEventListener('click', ()=>migrateLegacy(uid, legacyC, legacyK));
    }
  }catch(e){
    showNotice(`<strong>Errore durante la copia</strong> (${esc(e.code||e.message||'')}). Nessun dato è stato perso: l'archivio precedente è intatto.
      <div class="notice-actions"><button class="btn small" id="migrateRetryBtn">Riprova</button></div>`);
    document.getElementById('migrateRetryBtn').addEventListener('click', ()=>migrateLegacy(uid, legacyC, legacyK));
  }
}

// Link al feed calendario personale: il token è salvato in users/<uid>.calendarToken
// e la function "calendar" lo usa per trovare l'utente.
function randomToken(){
  return Array.from(crypto.getRandomValues(new Uint8Array(24))).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function showCalendarLink(regenerate){
  const user = firebase.auth().currentUser;
  if(!user) return;
  const ref = firebase.firestore().collection('users').doc(user.uid);
  showNotice('Preparazione del link…');
  try{
    let token = (await ref.get()).data()?.calendarToken;
    if(!token || regenerate){
      token = randomToken();
      await ref.set({ calendarToken: token, email: user.email||'' }, { merge: true });
    }
    const url = `${location.origin}/.netlify/functions/calendar?token=${token}`;
    showNotice(`<strong>Il tuo calendario personale</strong>
      <div class="notice-hint">Aggiungilo come calendario in abbonamento (iPhone: Impostazioni → Calendario → Account → Aggiungi account → Altro → Aggiungi calendario in abbonamento). Non condividerlo: chi ha il link vede i tuoi appuntamenti.</div>
      <input id="calLinkInput" readonly value="${esc(url)}">
      <div class="notice-actions">
        <button class="btn small" id="calCopyBtn">Copia link</button>
        <button class="btn secondary small" id="calRegenBtn">Genera nuovo link</button>
        <button class="btn secondary small" id="noticeClose">Chiudi</button>
      </div>`);
    const input = document.getElementById('calLinkInput');
    input.addEventListener('focus', ()=>input.select());
    document.getElementById('calCopyBtn').addEventListener('click', async (e)=>{
      try{ await navigator.clipboard.writeText(url); e.target.textContent = 'Copiato'; }
      catch(err){ input.focus(); input.select(); }
    });
    const regen = document.getElementById('calRegenBtn');
    regen.addEventListener('click', ()=>{
      if(regen.dataset.confirm){ showCalendarLink(true); return; }
      regen.dataset.confirm = '1';
      regen.textContent = 'Conferma: il link attuale smetterà di funzionare';
    });
  }catch(e){
    showNotice(`Impossibile preparare il link del calendario (${esc(e.code||e.message||'')}).
      <div class="notice-actions"><button class="btn secondary small" id="noticeClose">Chiudi</button></div>`);
  }
}

let unsubscribers = [];
function stopListeners(){ unsubscribers.forEach(u=>{ try{ u(); }catch(e){} }); unsubscribers = []; }
function showDataError(err){
  const code = (err && (err.code||err.message)) || '';
  const hint = code==='permission-denied'
    ? 'Accesso negato dalle regole di Firestore: prova a uscire e rientrare.'
    : 'Controlla la connessione e ricarica la pagina.';
  document.getElementById('main').innerHTML = `<div class="empty">Impossibile leggere i dati (${esc(code)}). ${hint}</div>`;
}

function startApp(uid){
  stopListeners();
  db = firestoreAdapter(uid);
  renderFooter();
  renderSidebarToday();
  unsubscribers.push(db.collection('contacts').onSnapshot(snap=>{
    contacts = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(canAutoRender()) renderMain();
    renderFooter();
    renderSidebarToday();
    updateNavBadges();
  }, showDataError));
  unsubscribers.push(db.collection('calls').onSnapshot(snap=>{
    calls = snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>(b.data||'').localeCompare(a.data||''));
    if(canAutoRender()) renderMain();
    renderFooter();
    renderSidebarToday();
  }, showDataError));
  unsubscribers.push(db.collection('projects').onSnapshot(onProjectsSnapshot, showDataError));
  unsubscribers.push(db.collection('forecastStorico').onSnapshot(onHistorySnapshot, showDataError));
  unsubscribers.push(db.collection('portale').onSnapshot(onPortalSnapshot, showDataError));
  unsubscribers.push(db.collection('settings').onSnapshot(onSettingsSnapshot, showDataError));
}

function contactsListView(){
  const q = contactsSearchQuery.trim().toLowerCase();
  const filtered = contacts.filter(c=>!q || (c.nome||'').toLowerCase().includes(q) || (c.cognome||'').toLowerCase().includes(q) || (c.azienda||'').toLowerCase().includes(q) || (c.telefono||'').includes(q) || (c.cellulare||'').includes(q) || (c.tag||'').toLowerCase().includes(q));
  filtered.sort((a,b)=>{
    const ka = (sortField==='cognome' ? (a.cognome||a.nome||'') : (a.nome||''));
    const kb = (sortField==='cognome' ? (b.cognome||b.nome||'') : (b.nome||''));
    return ka.localeCompare(kb);
  });
  const toolbar = `<div class="card" style="padding:14px 16px;">
    <div class="field-row" style="grid-template-columns:2fr 1fr;">
      <div><label>Cerca</label><input id="contactsSearch" value="${esc(contactsSearchQuery)}" placeholder="Nome, cognome, azienda, tag..."></div>
      <div><label>Ordina per</label><select id="contactsSortSelect">
        <option value="cognome" ${sortField==='cognome'?'selected':''}>Cognome</option>
        <option value="nome" ${sortField==='nome'?'selected':''}>Nome</option>
      </select></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:10px;">
      <button class="btn" id="newContactBtn">+ Nuovo contatto</button>
      <button class="btn secondary" id="exportXlsBtn">⬇ Esporta tutto (Excel)</button>
    </div>
  </div>`;
  const listHtml = filtered.length===0 ? '<div class="empty">Nessun contatto trovato.</div>' : filtered.map(c=>{
    const n = calls.filter(k=>k.contactId===c.id).length;
    const fu = followUpBadge(c.followUp);
    return `<div class="card" data-contact-id="${c.id}" style="cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;">
      <div>
        <div style="font-weight:600;font-size:15px;">${esc(fullName(c))}</div>
        <div style="font-size:12.5px;color:var(--muted);margin-top:2px;">${esc(c.professione||'')}${c.professione&&c.azienda?' · ':''}${esc(c.azienda||'')}${(c.professione||c.azienda)?' · ':''}${n} chiamat${n===1?'a':'e'}</div>
        ${c.tag?`<div style="margin-top:4px;">${tagPills(c.tag)}</div>`:''}
      </div>
      ${fu}
    </div>`;
  }).join('');
  return `<h2 style="margin-bottom:16px;">Contatti (${contacts.length})</h2>${toolbar}${listHtml}`;
}

        setActiveTab('navCall');
        renderMain();
      });
    });
    main.querySelectorAll('[data-contact-id]').forEach(el=>{
      el.addEventListener('click', ()=>{
        selectedId=el.dataset.contactId; view='detail'; confirmDeleteId=null; tableDetailCallId=null;
        setActiveTab('navContacts');
        renderMain();
      });
    });
    main.querySelectorAll('[data-mail-done]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ btn.disabled = true; markMailSent(btn.dataset.mailDone); });
    });
    bindTodo(main);
    return;
  }
  if(view==='followup'){
    main.innerHTML = followupView();
    main.querySelectorAll('[data-fu-id]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        selectedId=btn.dataset.fuId; clearFollowUpOnEntry=true; view='call'; callStep='entry';
        document.getElementById('navCall').classList.add('active');
        document.getElementById('navFollowup').classList.remove('active');
        renderMain();
      });
    });
    main.querySelectorAll('[data-contact-id]').forEach(el=>{
      el.addEventListener('click', ()=>{ selectedId=el.dataset.contactId; view='detail'; confirmDeleteId=null; tableDetailCallId=null; renderMain(); });
    });
    return;
  }
  if(view==='appt'){
    main.innerHTML = apptView();
    const icsBtn = document.getElementById('exportIcsBtn');
    if(icsBtn) icsBtn.addEventListener('click', exportICS);
    document.getElementById('importMeetingsBtn')?.addEventListener('click', ()=>{ window.__imp = { step:'file' }; view = 'import'; renderMain(); });
    document.getElementById('apptListBtn').addEventListener('click', ()=>{ apptSubView='list'; renderMain(); });
    document.getElementById('apptCalBtn').addEventListener('click', ()=>{ apptSubView='calendar'; renderMain(); });
    document.getElementById('apptDoneBtn').addEventListener('click', ()=>{ apptSubView='done'; renderMain(); });
    const aSearch = document.getElementById('apptSearch');
    aSearch.addEventListener('input', e=>{
      apptSearch = e.target.value; renderMain();
      const n = document.getElementById('apptSearch'); n.focus(); n.setSelectionRange(n.value.length, n.value.length);
    });
    document.getElementById('apptSearchClear')?.addEventListener('click', ()=>{ apptSearch = ''; renderMain(); });
    if(apptSubView==='calendar'){

async function deleteContact(c){
  try{
    const related = calls.filter(k=>k.contactId===c.id);
    for(const k of related){ await db.collection('calls').doc(k.id).delete(); }
    await db.collection('contacts').doc(c.id).delete();
    confirmDeleteId=null; selectedId=null; view='contactsList'; renderMain();
  }catch(e){ alert('Errore durante l\'eliminazione: '+(e.message||e.code||'')); }
}

// ---------------------------------------------------------------------------
// Dashboard "Progetti": flusso delle commesse nel periodo (nuove richieste, offerte
// presentate, conferme d'ordine, perse), tasso di successo, tempi medi, motivi di
// perdita, grafico mensile e ordinato per mese (dagli ordini). Le date sono quelle delle
// fasi (solo oggi o passate); colonne e riquadri aprono l'elenco dei progetti.
// ---------------------------------------------------------------------------
let dashProjPeriod = 'year';
const DASH_PROJ_PERIODS = { year:'Anno in corso', quarter:'Trimestre in corso', month:'Mese in corso', '12m':'Ultimi 12 mesi', all:'Sempre' };
function isoDay(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function dashProjRange(){
  const now = new Date(), y = now.getFullYear(), m = now.getMonth();
  if(dashProjPeriod==='year') return [`${y}-01-01`, `${y}-12-31`];
  if(dashProjPeriod==='quarter'){ const q = Math.floor(m/3); return [isoDay(new Date(y, q*3, 1)), isoDay(new Date(y, q*3+3, 0))]; }
  if(dashProjPeriod==='month') return [isoDay(new Date(y, m, 1)), isoDay(new Date(y, m+1, 0))];
  if(dashProjPeriod==='12m') return [isoDay(new Date(y, m-11, 1)), isoDay(new Date(y, m+1, 0))];
  return ['0000-01-01', '9999-12-31'];
}
function inDashRange(d, range){ return !!d && d>=range[0] && d<=range[1] && d<=todayISO(); }
const PROJ_EVENTS = {
  richiesta: { label:'Nuove richieste',     date:p=>p.fasi && p.fasi.richiesta,         value:p=>Number(p.importoOfferta)||0,   color:'var(--border-strong)' },
  offerta:   { label:'Offerte presentate',  date:p=>p.fasi && p.fasi.offertaPresentata, value:p=>Number(p.importoOfferta)||0,   color:'var(--accent)' },
  conferma:  { label:'Conferme d\'ordine',  date:p=>p.fasi && p.fasi.confermaOrdine,    value:p=>Number(projectAmount(p))||0,   color:'var(--brand-yellow)' },
  persa:     { label:'Commesse perse',      date:p=>isLost(p) ? p.persaIl : '',         value:p=>Number(p.importoOfferta)||0,   color:'var(--danger)' }
};
function projEvents(type, range){ return projects.filter(p=>inDashRange(PROJ_EVENTS[type].date(p), range)); }
function sumValue(type, list){ return list.reduce((s,p)=>s+PROJ_EVENTS[type].value(p), 0); }
function daysBetween(a, b){ return Math.round((new Date(b) - new Date(a)) / 864e5); }
function avgDays(list, fromKey, toKey){
  const d = list.filter(p=>p.fasi && p.fasi[fromKey] && p.fasi[toKey] && p.fasi[toKey]>=p.fasi[fromKey]).map(p=>daysBetween(p.fasi[fromKey], p.fasi[toKey]));
  return d.length ? { avg: Math.round(d.reduce((s,x)=>s+x, 0)/d.length), n: d.length } : null;
}
function ordersIn(range){
  const out = [];
  projects.forEach(p=>(p.ordini||[]).forEach(o=>{ if(inDashRange(o.data, range)) out.push({ p, o }); }));
  return out.sort((a,b)=>(a.o.data||'').localeCompare(b.o.data||''));
}
function dashMonths(){
  const now = new Date(), y = now.getFullYear();
  if(dashProjPeriod==='year') return [...Array(12)].map((_,i)=>`${y}-${String(i+1).padStart(2,'0')}`);
  return [...Array(12)].map((_,i)=>{ const d = new Date(y, now.getMonth()-11+i, 1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; });
}
function monthRange(ym){ const y = +ym.slice(0,4), m = +ym.slice(5,7); return [`${ym}-01`, isoDay(new Date(y, m, 0))]; }
function compactEuro(v){ return v>=1e6 ? (Math.round(v/1e5)/10).toString().replace('.', ',')+'M' : v>=1000 ? Math.round(v/1000)+'k' : String(Math.round(v)); }
// Colonne raggruppate per mese; ogni colonna apre l'elenco di quel mese.
function groupedBarsSVG(months, series, fmtVal){
  const w=640, h=200, padL=8, padR=8, padT=18, padB=26, innerW=w-padL-padR, innerH=h-padT-padB;
  const max = Math.max(1, ...series.flatMap(s=>s.values));
  const gap = innerW/months.length, slot = gap*0.84/series.length, bw = Math.min(16, slot*0.8);
  let out = '';
  months.forEach((ym,i)=>{
    series.forEach((s,j)=>{
      const v = s.values[i], bh = v/max*innerH;
      const sx = padL + i*gap + gap*0.08 + j*slot, x = sx + (slot-bw)/2, y = padT + innerH - bh;
      out += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(bh,1).toFixed(1)}" rx="2" fill="${s.color}"></rect>`;
      if(v>0) out += `<text x="${(x+bw/2).toFixed(1)}" y="${(y-4).toFixed(1)}" text-anchor="middle" font-size="9" fill="var(--text)" font-family="var(--sans)" style="pointer-events:none;">${fmtVal ? fmtVal(v) : v}</text>`;
      out += `<rect x="${sx.toFixed(1)}" y="${padT}" width="${slot.toFixed(1)}" height="${innerH+padB}" fill="transparent"${drillAttrs(s.drill(ym), 'projects')}></rect>`;
    });
    out += `<text x="${(padL + i*gap + gap/2).toFixed(1)}" y="${h-8}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="var(--sans)" style="pointer-events:none;">${MONTHS_SHORT[+ym.slice(5,7)-1]}${dashProjPeriod==='year' ? '' : " '"+ym.slice(2,4)}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;max-width:680px;"><line x1="${padL}" y1="${padT+innerH}" x2="${w-padR}" y2="${padT+innerH}" stroke="var(--border)"/>${out}</svg>`;
}
function dashLegend(items){ return `<div class="dash-legend">${items.map(([l,c])=>`<span><i style="background:${c};"></i>${l}</span>`).join('')}</div>`; }

function dashboardProjectsView(){
  const range = dashProjRange();
  const ev = Object.fromEntries(Object.keys(PROJ_EVENTS).map(t=>[t, projEvents(t, range)]));
  const conf = ev.conferma.length, lost = ev.persa.length;
  const confVal = sumValue('conferma', ev.conferma), lostVal = sumValue('persa', ev.persa);
  const winN = conf+lost ? Math.round(conf*100/(conf+lost)) : null;
  const winV = confVal+lostVal ? Math.round(confVal*100/(confVal+lostVal)) : null;
  const cycleOffer = avgDays(ev.offerta, 'richiesta', 'offertaPresentata');
  const cycleOrder = avgDays(ev.conferma, 'offertaPresentata', 'confermaOrdine');
  const ord = ordersIn(range), ordVal = ord.reduce((s,x)=>s+(Number(x.o.importo)||0), 0);
  const tile = (type)=>`<div class="fc-tile dash-tile bar-clickable" data-drill="${esc(JSON.stringify({ kind:'projEvents', type }))}" data-chart-type="projects" style="border-top:3px solid ${PROJ_EVENTS[type].color};">
      <div class="fc-label">${PROJ_EVENTS[type].label}</div><div class="fc-value">${ev[type].length}</div><div class="fc-note">${fmtEuro(sumValue(type, ev[type]))}</div></div>`;
  const plain = (label, value, note)=>`<div class="fc-tile"><div class="fc-label">${label}</div><div class="fc-value">${value}</div>${note ? `<div class="fc-note">${note}</div>` : ''}</div>`;
  const months = dashMonths();
  const series = ['richiesta','offerta','conferma'].map(t=>({ color:PROJ_EVENTS[t].color, values: months.map(ym=>projEvents(t, monthRange(ym)).length), drill: ym=>({ kind:'projEvents', type:t, ym }) }));
  const ordSeries = [{ color:'var(--accent)', values: months.map(ym=>ordersIn(monthRange(ym)).reduce((s,x)=>s+(Number(x.o.importo)||0), 0)), drill: ym=>({ kind:'ordersMonth', ym }) }];
  const reasons = new Map();
  ev.persa.forEach(p=>{ const k = p.motivoPerdita || 'Non indicato'; const r = reasons.get(k) || { n:0, v:0 }; r.n++; r.v += Number(p.importoOfferta)||0; reasons.set(k, r); });
  const reasonRows = [...reasons.entries()].sort((a,b)=>b[1].v-a[1].v || b[1].n-a[1].n);
  const maxR = Math.max(1, ...reasonRows.map(([,r])=>r.v));
  return `
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;">
      <label style="margin:0;font-size:13px;color:var(--muted);">Periodo</label>
      <select id="dashProjPeriod" style="width:auto;">${Object.entries(DASH_PROJ_PERIODS).map(([v,l])=>`<option value="${v}" ${dashProjPeriod===v?'selected':''}>${l}</option>`).join('')}</select>
    </div>
    <div class="fc-tiles">${tile('richiesta')}${tile('offerta')}${tile('conferma')}${tile('persa')}</div>
    <div class="fc-tiles" style="margin-top:10px;">
      ${plain('Tasso di successo', winN==null ? '—' : winN+'%', winN==null ? 'nessuna commessa chiusa nel periodo' : `in valore ${winV}% · ${conf} confermate su ${conf+lost} chiuse`)}
      ${plain('Dalla richiesta all\'offerta', cycleOffer ? cycleOffer.avg+' gg' : '—', cycleOffer ? `media su ${cycleOffer.n} ${cycleOffer.n===1?'offerta':'offerte'}` : 'nessun dato nel periodo')}
      ${plain('Dall\'offerta all\'ordine', cycleOrder ? cycleOrder.avg+' gg' : '—', cycleOrder ? `media su ${cycleOrder.n} ${cycleOrder.n===1?'conferma':'conferme'}` : 'nessun dato nel periodo')}
      <div class="fc-tile dash-tile bar-clickable" data-drill="${esc(JSON.stringify({ kind:'ordersMonth' }))}" data-chart-type="projects"><div class="fc-label">Ordinato nel periodo</div><div class="fc-value">${fmtEuro(ordVal)}</div><div class="fc-note">${ord.length} ${ord.length===1?'ordine':'ordini'} (consegne)</div></div>
    </div>
    <div class="card" style="margin-top:14px;">
      <h3>Andamento mese per mese</h3>
      ${dashLegend(['richiesta','offerta','conferma'].map(t=>[PROJ_EVENTS[t].label, PROJ_EVENTS[t].color]))}
      ${groupedBarsSVG(months, series)}
      <div style="font-size:12px;color:var(--muted);margin-top:6px;">Numero di commesse per mese${dashProjPeriod==='year' ? '' : ' (ultimi 12 mesi)'} · clicca una colonna per l'elenco</div>
    </div>
    <div class="card">
      <h3>Ordinato per mese</h3>
      ${groupedBarsSVG(months, ordSeries, compactEuro)}
      <div style="font-size:12px;color:var(--muted);margin-top:6px;">Somma degli ordini per data dell'ordine · clicca una colonna per l'elenco degli ordini</div>
    </div>
    <div class="card">
      <h3>Motivi delle commesse perse</h3>
      ${reasonRows.length ? reasonRows.map(([k,r])=>`<div class="fc-q-row">
        <div class="fc-q-label">${esc(k)} <span>${r.n} ${r.n===1?'commessa':'commesse'}</span></div>
        <div class="fc-q-track"><div class="fc-q-bar" style="width:${Math.max(1, Math.round(r.v*100/maxR))}%;background:var(--danger);"></div></div>
        <div class="fc-q-num"><strong>${fmtEuro(r.v)}</strong></div></div>`).join('') : '<div class="empty">Nessuna commessa persa nel periodo.</div>'}
    </div>`;

// Elenco di dettaglio (dashboardDrilldown): progetti di un tipo di evento (nel mese o
// nel periodo) oppure ordini (nel mese o nel periodo).
function projEventsListView(lvl){
  const range = lvl.ym ? monthRange(lvl.ym) : dashProjRange();
  const when = lvl.ym ? monthLabel(lvl.ym) : DASH_PROJ_PERIODS[dashProjPeriod].toLowerCase();
  const back = `<div class="top-actions" style="justify-content:space-between;"><button class="btn secondary small" id="drillBackBtn">← ${dashboardDrilldown.stack.length>1 ? 'Indietro' : 'Torna alla dashboard'}</button></div>`;
  if(lvl.kind==='ordersMonth'){
    const list = ordersIn(range);
    const tot = list.reduce((s,x)=>s+(Number(x.o.importo)||0), 0);
    return back + `<div class="card"><h3>Ordini — ${esc(when)}</h3>
      <div style="font-size:12.5px;color:var(--muted);margin-bottom:10px;">${list.length} ${list.length===1?'ordine':'ordini'} per ${fmtEuro(tot)} · clicca per aprire il progetto</div>
      ${list.length ? list.map(({p,o})=>`<div class="call-item" data-open-project="${p.id}" style="cursor:pointer;">
        <span class="date">${fmtDate(o.data)}</span> <strong>${fmtEuro(o.importo)}</strong>${o.numero ? ` <span style="color:var(--muted);">· n° ${esc(o.numero)}</span>` : ''}
        <div style="font-weight:600;font-size:14px;margin-top:3px;">${esc(projectTitle(p))}</div>
        <div style="font-size:12.5px;color:var(--muted);">${esc(projectAddress(p))}${o.note ? ` · ${esc(o.note)}` : ''}</div>
      </div>`).join('') : '<div class="empty">Nessun ordine.</div>'}</div>`;
  }
  const E = PROJ_EVENTS[lvl.type];
  const list = projEvents(lvl.type, range).sort((a,b)=>(E.date(a)||'').localeCompare(E.date(b)||''));
  return back + `<div class="card"><h3>${esc(E.label)} — ${esc(when)}</h3>
    <div style="font-size:12.5px;color:var(--muted);margin-bottom:10px;">${list.length} ${list.length===1?'commessa':'commesse'} per ${fmtEuro(sumValue(lvl.type, list))} · clicca per aprire il progetto</div>
    ${list.length ? list.map(p=>`<div class="call-item ${projectStateClass(p)}" data-open-project="${p.id}" style="cursor:pointer;">
      <span class="date">${fmtDate(E.date(p))}</span> ${phaseBadge(p)} <strong style="margin-left:4px;">${fmtEuro(E.value(p))}</strong>
      <div style="font-weight:600;font-size:14px;margin-top:3px;">${esc(projectTitle(p))}</div>
      <div style="font-size:12.5px;color:var(--muted);">${esc(projectAddress(p))}${lvl.type==='persa' && p.motivoPerdita ? ` · ${esc(p.motivoPerdita)}` : ''}</div>
    </div>`).join('') : '<div class="empty">Nessuna commessa.</div>'}</div>`;
}

let appSettings = {}, settingsDocId = null;
let backupList = null, backupMsg = '';   // null = elenco non ancora caricato
function onSettingsSnapshot(snap){
  const d = snap.docs[0];
  settingsDocId = d ? d.id : null;
  appSettings = d ? d.data() : {};
  scheduleForecastSnapshot();
  if(canAutoRender() && (view==='settings' || view==='forecast' || view==='agenda')) renderMain();
}
async function saveSettings(patch){
  Object.assign(appSettings, patch);
  try{
    if(settingsDocId) await db.collection('settings').doc(settingsDocId).update({ ...patch, updatedAt: Date.now() });
    else{ const ref = await db.collection('settings').add({ ...patch, updatedAt: Date.now() }); settingsDocId = settingsDocId || ref.id; }
  }catch(e){ alert('Errore nel salvataggio: '+(e.message||e.code||'')); }
}

// --- Backup ---
function cellDate(d){ return d ? fmtDate(String(d).slice(0,10)) : ''; }
async function exportAllExcel(){
  try{ await loadXLSX(); }catch(e){ alert('Impossibile creare il file Excel: '+e.message); return; }
  const byId = Object.fromEntries(contacts.map(c=>[c.id,c]));
  const projById = Object.fromEntries(projects.map(p=>[p.id,p]));
  const sheets = [];
  sheets.push(['Contatti', [['Cognome','Nome','Professione','Studio/Attività','Cellulare','Telefono studio','Email','Via','Città','Tag','Follow-up','Note'],
    ...contacts.slice().sort((a,b)=>fullName(a).localeCompare(fullName(b))).map(c=>[c.cognome||'', c.nome||'', c.professione||'', c.azienda||'', c.cellulare||'', c.telefono||'', c.email||'', c.via||'', c.citta||'', c.tag||'', c.followUp ? fmtDateTime(c.followUp) : '', c.note||''])]]);
  sheets.push(['Chiamate', [['Data','Contatto','Studio/Attività','Esito','Argomento','Progetti','Note','Appuntamento','Note incontro','Mail informativa'],
    ...calls.map(k=>{ const c = byId[k.contactId]||{}; return [cellDate(k.data), fullName(c), c.azienda||'', k.esito||'', k.progetto||'',
      (k.progetti||[]).map(id=>projById[id] ? projById[id].codice : '').filter(Boolean).join(', '), k.note||'', k.appuntamento ? fmtDateTime(k.appuntamento) : '', k.noteIncontro||'',
      k.mailDaInviare ? (k.mailInviataIl ? 'inviata il '+fmtDate(k.mailInviataIl) : 'da inviare') : '']; })]]);
  const phaseCols = PROJECT_PHASES.map(ph=>ph.label);
  sheets.push(['Progetti', [['ID','Nome','Via','Città','Stato','Fase','Offerta','Deliberato','Ordinato','% spedito','Probabilità %','Chiusura prevista','Partecipanti',...phaseCols,'Motivo perdita','Note'],
    ...projects.slice().sort(byProjectId).map(p=>{ const ph = projectPhase(p); const s = supplyInfo(p);
      return [p.codice||'', p.nome||'', p.via||'', p.citta||'', isLost(p) ? 'Persa' : isWon(p) ? 'Confermata' : 'Aperta', ph ? ph.label : '',
        p.importoOfferta ?? '', p.importoDeliberato ?? '', orderedTotal(p) || '', s ? s.pct : '', isLost(p)||isWon(p) ? '' : forecastProb(p).value, p.chiusuraPrevista||'',
        (p.partecipanti||[]).map(x=>{ const c = byId[x.contactId]; return c ? `${fullName(c)}${x.ruolo ? ' ('+x.ruolo+')' : ''}` : ''; }).filter(Boolean).join('; '),
        ...PROJECT_PHASES.map(ph=>cellDate((p.fasi||{})[ph.key])), p.motivoPerdita||'', p.note||'']; })]]);
  const orders = [];
  projects.slice().sort(byProjectId).forEach(p=>projectOrders(p).forEach(o=>orders.push([p.codice||'', p.nome||'', cellDate(o.data), o.numero||'', o.importo ?? '', cellDate(o.consegna), o.note||''])));
  sheets.push(['Ordini', [['ID progetto','Progetto','Data','Numero DDT','Importo','Consegna indicativa','Note'], ...orders]]);
  const wb = XLSX.utils.book_new();
  sheets.forEach(([name, rows])=>{
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = rows[0].map((_, i)=>({ wch: Math.min(45, Math.max(8, ...rows.slice(0, 200).map(r=>String(r[i]==null ? '' : r[i]).length + 1))) }));
    XLSX.utils.book_append_sheet(wb, ws, name);
  });
  XLSX.writeFile(wb, `registro-chiamate-${todayISO()}.xlsx`);
}
const cloudBackups = ()=>typeof firebase!=='undefined' && firebase.auth && firebase.auth().currentUser;
async function backupApi(method, query){
  const token = await firebase.auth().currentUser.getIdToken();
  const res = await fetch('/.netlify/functions/backups'+(query||''), { method, headers:{ Authorization:'Bearer '+token } });
  if(!res.ok){ let msg = res.status; try{ msg = (await res.json()).error || msg; }catch(e){} throw new Error(msg); }
  return res;
}
async function loadBackupList(){
  try{ backupList = (await (await backupApi('GET')).json()).backups || []; backupMsg = ''; }
  catch(e){ backupList = []; backupMsg = 'Elenco delle copie non disponibile ('+e.message+').'; }
  if(view==='settings') renderMain();
}
async function backupNow(btn){
  btn.disabled = true; btn.textContent = 'Copia in corso…';
  try{ const r = await (await backupApi('POST')).json(); backupMsg = r.date ? `Copia del ${fmtDate(r.date)} salvata.` : 'Archivio vuoto: niente da copiare.'; }
  catch(e){ backupMsg = 'Copia non riuscita ('+e.message+').'; }
  backupList = null; loadBackupList();
}
async function downloadBackup(date, btn){
  btn.disabled = true;
  try{
    const blob = await (await backupApi('GET', '?date='+encodeURIComponent(date))).blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `registro-chiamate-backup-${date}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }catch(e){ alert('Download non riuscito: '+e.message); }
  btn.disabled = false;
}

// ---------------------------------------------------------------------------
// Da fare (in Oggi): promemoria calcolati dai dati, senza doverli impostare a mano.
// - Offerte da sollecitare: offerta presentata (non confermata ne' persa) da piu' di
//   N giorni, contati dall'ultimo sollecito (projects.sollecitatoIl) se c'e'.
// - Commesse ferme: prima dell'offerta, nessuna fase nuova da N giorni.
// - Da ricontattare: clienti gia' sentiti senza progetti in corso, fermi da N giorni
//   (meno se l'ultima volta non si e' riusciti a parlarci). Esclusi: follow-up o
//   appuntamento in programma, commessa acquisita, "Non interessato" nell'ultimo anno.
// "Rimanda" nasconde la voce fino a una data (projects/contacts.rimandaAl).
// Intervalli in Impostazioni (settings.promemoria).
// ---------------------------------------------------------------------------
const TODO_DEFAULTS = { sollecito:15, ferma:30, ricontatto:60, nonRaggiunto:30 };
let todoShowAll = { ricontatto:false };
function todoDays(k){ const v = Number((appSettings.promemoria||{})[k]); return v>0 ? v : TODO_DEFAULTS[k]; }
function addDaysISO(iso, n){ const d = new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function snoozed(x){ return !!x.rimandaAl && x.rimandaAl > todayISO(); }
function lastPhaseDate(p){ const t = todayISO(); return PROJECT_PHASES.map(ph=>p.fasi && p.fasi[ph.key]).filter(d=>d && d<=t).sort().pop() || ''; }
function openProjects(){ return projects.filter(p=>!isLost(p) && !isWon(p)); }

// Ultima telefonata (data della chiamata) e ultimo incontro (appuntamento passato) con le
// persone del progetto, collegati o no al progetto.
function projectContactActivity(p){
  const ids = new Set((p.partecipanti||[]).map(x=>x.contactId)), now = new Date(), t = todayISO();
  const mine = calls.filter(k=>ids.has(k.contactId));
  return {
    lastCall: mine.filter(k=>k.data && k.data <= t).sort((a,b)=>b.data.localeCompare(a.data))[0] || null,
    lastMeet: mine.filter(k=>k.appuntamento && new Date(k.appuntamento) <= now).sort((a,b)=>b.appuntamento.localeCompare(a.appuntamento))[0] || null
  };
}
// Ultima telefonata o incontro indicati come relativi al progetto (calls.progetti): contano
// come contatto sulla commessa, il conteggio per il sollecito riparte da li'.
function linkedActivityDate(p){
  const now = new Date(), t = todayISO();
  return calls.filter(k=>(k.progetti||[]).includes(p.id))
    .flatMap(k=>[k.data && k.data <= t ? k.data : '', k.appuntamento && new Date(k.appuntamento) <= now ? k.appuntamento.slice(0,10) : ''])
    .filter(Boolean).sort().pop() || '';
}
function offersToChase(){
  const t = todayISO(), n = todoDays('sollecito');
  return openProjects().filter(p=>phaseDone(p, 'offertaPresentata') && !snoozed(p)).map(p=>{
    const sources = [[p.fasi.offertaPresentata, 'offerta presentata'], [p.sollecitatoIl||'', 'sollecitata'], [linkedActivityDate(p), 'ultimo contatto sulla commessa']];
    const [since, label] = sources.filter(s=>s[0]).sort((a,b)=>a[0].localeCompare(b[0])).pop();
    return { p, since, label, days: daysBetween(since, t) };
  }).filter(x=>x.days >= n).sort((a,b)=>b.days - a.days);
}
function stalledProjects(){
  const t = todayISO(), n = todoDays('ferma');
  return openProjects().filter(p=>!phaseDone(p, 'offertaPresentata') && !snoozed(p)).map(p=>{
    const since = lastPhaseDate(p) || (p.createdAt ? new Date(p.createdAt).toISOString().slice(0,10) : '');
    return { p, since, days: since ? daysBetween(since, t) : null };
  }).filter(x=>x.days!=null && x.days >= n).sort((a,b)=>b.days - a.days);
}
function contactsToRecall(){
  const now = new Date(), t = todayISO();
  const nRag = todoDays('ricontatto'), nNon = todoDays('nonRaggiunto');
  const yearAgo = addDaysISO(t, -365);
  const byContact = new Map();
  calls.forEach(k=>{ if(k.contactId) (byContact.get(k.contactId) || byContact.set(k.contactId, []).get(k.contactId)).push(k); });
  const out = [];
  contacts.forEach(c=>{
    const list = byContact.get(c.id);
    if(!list || !list.length || snoozed(c)) return;
    if(c.followUp && new Date(c.followUp) > now) return;
    if(list.some(k=>k.appuntamento && new Date(k.appuntamento) > now)) return;
    const projs = projectsOfContact(c.id);
    if(projs.some(isWon) || projs.some(p=>!isLost(p))) return;   // acquisito o in corso: lo segue il progetto
    const sorted = list.slice().sort((a,b)=>(b.data||'').localeCompare(a.data||''));
    const last = sorted[0];
    if(sorted.some(k=>k.esito==='Non interessato' && (k.data||'') >= yearAgo)) return;
    const lastAppt = list.map(k=>k.appuntamento||'').filter(a=>a && new Date(a) <= now).sort().pop() || '';
    const since = [last.data||'', lastAppt.slice(0,10)].sort().pop();
    if(!since) return;
    const reached = !ESITI_NON_RAGGIUNTO.includes(last.esito);
    const days = daysBetween(since, t);
    if(days < (reached || lastAppt ? nRag : nNon)) return;
    const hot = ['Interessato','Da richiamare'].includes(last.esito) ? 0 : lastAppt ? 1 : reached ? 2 : 3;
    out.push({ c, last, since, days, met: !!lastAppt, reached, hot });
  });
  return out.sort((a,b)=>a.hot - b.hot || b.days - a.days);
}
function dataToComplete(){
  const items = [];
  openProjects().sort(byProjectId).forEach(p=>{
    const miss = [];
    if(p.importoOfferta==null || p.importoOfferta==='') miss.push('importo dell\'offerta');
    if(!p.chiusuraPrevista) miss.push('chiusura prevista');
    if(miss.length) items.push({ kind:'project', p, miss });
  });
  projects.filter(isWon).sort(byProjectId).forEach(p=>{
    if(p.importoDeliberato==null && (p.importoOfferta==null || p.importoOfferta==='')) items.push({ kind:'project', p, miss:['deliberato (serve per la % di merce spedita)'] });
  });
  const inProjects = new Set(projects.filter(p=>!isLost(p)).flatMap(p=>(p.partecipanti||[]).map(x=>x.contactId)));
  contacts.filter(c=>inProjects.has(c.id)).sort((a,b)=>fullName(a).localeCompare(fullName(b))).forEach(c=>{

  });
  return items;
}
