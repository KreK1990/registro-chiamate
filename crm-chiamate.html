async function saveContact(){
  const nome = document.getElementById('fNome').value.trim();
  const cognome = document.getElementById('fCognome').value.trim();
  if(!nome || !cognome){ alert('Nome e cognome sono obbligatori.'); return; }
  const editing = window.__editing;
  const telefono = formatPhone(document.getElementById('fTel').value);
  const cellulare = formatPhone(document.getElementById('fCell').value);
  if(!(editing && editing.id) && !window.__dupConfirmed){
    // Il telefono dello studio e' condiviso tra colleghi: per i doppioni conta il cellulare.
    const cellNorm = cellulare.replace(/\s+/g,'');
    const dup = contacts.find(c=>{
      if(cellNorm && (c.cellulare||'').replace(/\s+/g,'')===cellNorm) return true;
      if(c.nome && c.cognome && c.nome.toLowerCase()===nome.toLowerCase() && c.cognome.toLowerCase()===cognome.toLowerCase()) return true;
      return false;
    });
    if(dup){
      window.__dupConfirmed = true;
      document.getElementById('dupWarning').innerHTML = `<div style="margin-top:10px;padding:10px 12px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:6px;font-size:13px;">Esiste già un contatto simile: <strong>${esc(fullName(dup))}</strong>${dup.cellulare?' · Cell '+esc(dup.cellulare):''}. Premi di nuovo "Salva" per crearlo comunque.</div>`;
      document.getElementById('saveContactBtn').textContent = 'Salva comunque';
      return;
    }
  }
  const profSel = document.getElementById('fProf').value;
  const professione = profSel==='Altro' ? document.getElementById('fProfAltro').value.trim() : profSel;
  const data = {
    nome, cognome, professione,
    azienda: document.getElementById('fAzienda').value.trim(),
    via: document.getElementById('fVia').value.trim(),
    citta: document.getElementById('fCitta').value.trim(),
    telefono,
    cellulare,
    email: document.getElementById('fEmail').value.trim(),
    followUp: combineDT(document.getElementById('fFollowUpDate').value, document.getElementById('fFollowUpTime').value),
    tag: document.getElementById('fTag').value.trim(),
    note: document.getElementById('fNote').value.trim()
  };
  // Studio gia' presente: stesso nome degli altri contatti, dati mancanti presi dallo
  // studio; se indirizzo/telefono cambiano, si chiede se aggiornare anche gli altri.
  const studio = findStudio(data.azienda, editing && editing.id);
  const studioFields = ['via','citta','telefono'];
  if(studio){
    data.azienda = bestStudioName([...studio.members.map(m=>m.azienda), data.azienda]);
    studioFields.forEach(f=>{ if(!data[f] && studio[f]) data[f] = studio[f]; });
    const changed = studioFields.some(f=>!sameStudioVal(f, studio[f], data[f]));
    if(changed && !window.__studioChoice){
      const n = studio.members.length;
      document.getElementById('dupWarning').innerHTML = `<div style="margin-top:10px;padding:10px 12px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:2px;font-size:13px;">Indirizzo o telefono di <strong>${esc(studio.name)}</strong> sono diversi da quelli ${n===1?'dell\'altro contatto':`degli altri ${n} contatti`} dello studio.
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
          <button class="btn small" id="studioAllBtn">Aggiorna anche ${n===1?'l\'altro contatto':`gli altri ${n}`}</button>
          <button class="btn secondary small" id="studioOneBtn">Salva solo questo contatto</button>
        </div></div>`;
      document.getElementById('studioAllBtn').addEventListener('click', ()=>{ window.__studioChoice='all'; saveContact(); });
      document.getElementById('studioOneBtn').addEventListener('click', ()=>{ window.__studioChoice='one'; saveContact(); });
      return;
    }
  }
  try{
    if(editing && editing.id){ await db.collection('contacts').doc(editing.id).update(data); selectedId = editing.id; }
    else { const ref = await db.collection('contacts').add({...data, createdAt: Date.now()}); selectedId = ref.id; }
    if(studio && window.__studioChoice==='all'){
      for(const m of studio.members){
        const upd = {};
        studioFields.forEach(f=>{ if(!sameStudioVal(f, m[f], data[f])) upd[f] = data[f]; });
        if(m.azienda!==data.azienda) upd.azienda = data.azienda;
        if(Object.keys(upd).length) await db.collection('contacts').doc(m.id).update(upd);
      }
    }
    window.__studioChoice = null;
    window.__editing=null;
    if(window.__returnToCall){ window.__returnToCall=false; view='call'; callStep='entry'; }
    else{ view='detail'; }
    renderMain();
  }catch(e){ alert('Errore nel salvataggio: '+(e.message||e.code||'')); }
}

async function saveCall(){
  const data = document.getElementById('callDate').value;
  const esito = document.getElementById('callEsito').value;
  const note = document.getElementById('callNote').value.trim();
  const progetto = document.getElementById('callProgetto').value.trim();
  const appuntamento = document.getElementById('callApptCheck').checked ? combineDT(document.getElementById('callApptDate').value, document.getElementById('callApptTime').value) : '';
  const followUp = combineDT(document.getElementById('callFollowUpDate').value, document.getElementById('callFollowUpTime').value);
  if(!data){ alert('Inserisci la data.'); return; }
  try{
    await db.collection('calls').add({ contactId: selectedId, data, esito, note, progetto, appuntamento, createdAt: Date.now() });
    await db.collection('contacts').doc(selectedId).update({ followUp: followUp||'' });
    document.getElementById('callNote').value='';
  }catch(e){ alert('Errore nel salvataggio: '+(e.message||e.code||'')); }
}

function updateNavBadges(){
  const now = new Date();
  const overdue = contacts.filter(c=>c.followUp && new Date(c.followUp) <= now).length;
  const badge = document.getElementById('fuBadge');
  if(!badge) return;
  const menuBadge = document.getElementById('menuBadge');
  [badge, menuBadge].forEach(b=>{
    if(!b) return;
    if(overdue>0){ b.textContent = overdue>99?'99+':overdue; b.classList.remove('hidden'); }
    else{ b.classList.add('hidden'); }
  });
}
function followUpBadge(dateStr, big){
  if(!dateStr) return '';
  const due = new Date(dateStr) <= new Date();
  const label = (due?'Follow-up scaduto: ':'Prossimo follow-up: ')+fmtDateTime(dateStr);
  return `<span class="followup ${due?'due':'ok'}" style="${big?'display:inline-block;':''}">${label}</span>`;
}

function updateNotifBtn(){
  const btn = document.getElementById('notifBtn');
  if(!btn) return;
  if(typeof Notification==='undefined'){ btn.style.display='none'; return; }
  if(Notification.permission==='granted'){ btn.textContent='Notifiche attive'; btn.disabled=true; }
  else if(Notification.permission==='denied'){ btn.textContent='Notifiche bloccate dal browser'; btn.disabled=true; }
  else { btn.textContent='Attiva notifiche'; btn.disabled=false; }
}
const notifiedFollowUps = new Set();
const notifiedAppts = new Set();
// Nell'app installata su iPhone il costruttore Notification non mostra nulla:
// le notifiche vanno emesse tramite il service worker, quando disponibile.
function showNotif(title, body){
  const opts = { body, icon:'icon-192.png' };
  const fallback = ()=>{ try{ new Notification(title, opts); }catch(e){} };
  if('serviceWorker' in navigator && navigator.serviceWorker.controller){
    navigator.serviceWorker.ready.then(reg=>reg.showNotification(title, opts)).catch(fallback);
    return;
  }
  fallback();
}
function checkDueNotifications(){
  if(typeof Notification==='undefined' || Notification.permission!=='granted') return;
  const now = new Date();
  contacts.forEach(c=>{
    const key = c.id+'|'+c.followUp;
    if(c.followUp && new Date(c.followUp)<=now && !notifiedFollowUps.has(key)){
      notifiedFollowUps.add(key);
      showNotif('Follow-up da fare', fullName(c));
    }
  });
  const byId = Object.fromEntries(contacts.map(c=>[c.id,c]));
  calls.forEach(k=>{
    if(!k.appuntamento || notifiedAppts.has(k.id)) return;
    const start = new Date(k.appuntamento);
    const diffMin = (start-now)/60000;
    if(diffMin>0 && diffMin<=15){
      notifiedAppts.add(k.id);
      const c = byId[k.contactId]||{};
      const hh=String(start.getHours()).padStart(2,'0'), mm=String(start.getMinutes()).padStart(2,'0');
      showNotif('Appuntamento tra poco', `${fullName(c)} alle ${hh}:${mm}`);
    }
  });
}
document.getElementById('notifBtn')?.addEventListener('click', async ()=>{
  if(typeof Notification==='undefined') return;
  try{ await Notification.requestPermission(); }catch(e){}
  updateNotifBtn();
});
updateNotifBtn();
setInterval(checkDueNotifications, 60000);

function esc(s){ return String(s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function csvEscape(v){ const s=String(v==null?'':v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function downloadCSV(filename, rows){
  const csv = rows.map(r=>r.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function exportICS(){
  const events = apptCalls();
  if(events.length===0){ alert('Nessun appuntamento da esportare.'); return; }
  const byId = Object.fromEntries(contacts.map(c=>[c.id,c]));
  const pad = n=>String(n).padStart(2,'0');
  const toICS = d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const now = new Date();
  const dtstamp = `${now.getUTCFullYear()}${pad(now.getUTCMonth()+1)}${pad(now.getUTCDate())}T${pad(now.getUTCHours())}${pad(now.getUTCMinutes())}${pad(now.getUTCSeconds())}Z`;
  const icsEsc = s=>String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
  const foldLine = line=>{
    const max = 73;
    if(line.length<=max) return line;
    let out = line.slice(0,max);
    let rest = line.slice(max);
    while(rest.length>0){
      out += '\r\n ' + rest.slice(0,max-1);
      rest = rest.slice(max-1);
    }
    return out;
  };
  // Orari dichiarati in Europe/Rome: senza fuso Google Calendar li legge come UTC.
  const vtimezone = ['BEGIN:VTIMEZONE','TZID:Europe/Rome',
    'BEGIN:DAYLIGHT','TZOFFSETFROM:+0100','TZOFFSETTO:+0200','TZNAME:CEST','DTSTART:19700329T020000','RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU','END:DAYLIGHT',
    'BEGIN:STANDARD','TZOFFSETFROM:+0200','TZOFFSETTO:+0100','TZNAME:CET','DTSTART:19701025T030000','RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU','END:STANDARD',
    'END:VTIMEZONE'].join('\r\n')+'\r\n';
  let ics = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Registro Chiamate//IT\r\nCALSCALE:GREGORIAN\r\nX-WR-TIMEZONE:Europe/Rome\r\n' + vtimezone;
  events.forEach(k=>{
    const c = byId[k.contactId]||{};
    const start = new Date(k.appuntamento);
    const end = new Date(start.getTime()+60*60*1000);
    const summary = icsEsc(fullName(c) + (k.progetto?' - '+k.progetto:''));
    const desc = icsEsc([k.progetto, k.note].filter(Boolean).join('\n'));
    const loc = icsEsc(fullAddress(c));
    ics += 'BEGIN:VEVENT\r\n';
    ics += foldLine(`UID:${k.id}@registro-chiamate`) + '\r\n';
    ics += foldLine(`DTSTAMP:${dtstamp}`) + '\r\n';
    ics += foldLine(`DTSTART;TZID=Europe/Rome:${toICS(start)}`) + '\r\n';
    ics += foldLine(`DTEND;TZID=Europe/Rome:${toICS(end)}`) + '\r\n';
    ics += foldLine(`SUMMARY:${summary}`) + '\r\n';
    if(desc) ics += foldLine(`DESCRIPTION:${desc}`) + '\r\n';
    if(loc) ics += foldLine(`LOCATION:${loc}`) + '\r\n';
    ics += 'END:VEVENT\r\n';
  });
  ics += 'END:VCALENDAR\r\n';
  const blob = new Blob([ics], {type:'text/calendar;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'appuntamenti.ics';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function exportBackupCSV(){
  const contactRows = [['Nome','Cognome','Professione','Cellulare','Studio/Attività','Via','Città','Telefono studio','Email','Follow-up','Note']];
  contacts.forEach(c=>{
    contactRows.push([c.nome||'', c.cognome||'', c.professione||'', c.cellulare||'', c.azienda||'', c.via||'', c.citta||'', c.telefono||'', c.email||'', c.followUp?fmtDateTime(c.followUp):'', c.note||'']);
  });
  downloadCSV('contatti.csv', contactRows);
  const byId = Object.fromEntries(contacts.map(c=>[c.id,c]));
  const callRows = [['Data','Contatto','Esito','Progetto','Note','Appuntamento','Note incontro']];
  calls.forEach(k=>{
    const c = byId[k.contactId]||{};
    callRows.push([fmtDate(k.data), fullName(c), k.esito||'', k.progetto||'', k.note||'', k.appuntamento?fmtDateTime(k.appuntamento):'', k.noteIncontro||'']);
  });
  setTimeout(()=>downloadCSV('chiamate.csv', callRows), 400);
}
function isApptCall(k){ return k.esito==='Appuntamento fissato' || !!k.appuntamento; }
function esitoCell(k){
  if(isApptCall(k)) return `<span class="esito-tag appt">${esc(k.esito||'Appuntamento fissato')}</span>`;
  return esc(k.esito||'—');
}
function fullName(c){
  if(c.cognome) return `${c.cognome} ${c.nome||''}`.trim();
  if(c.nome) return c.nome;
  return c.azienda || c.cellulare || c.telefono || c.email || '(senza nome)';
}
function tagPills(tag){ if(!tag) return ''; return tag.split(',').map(t=>t.trim()).filter(Boolean).map(t=>`<span class="tag-pill">${esc(t)}</span>`).join(''); }
function fullAddress(c){ if(c.via || c.citta) return [c.via, c.citta].filter(Boolean).join(', '); return c.indirizzo || ''; }
function mapsUrl(c){ return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(fullAddress(c))}`; }
// Mappa incorporata (Google Maps "output=embed": non richiede chiave API).
function mapEmbedUrl(c){ return `https://www.google.com/maps?q=${encodeURIComponent(fullAddress(c))}&z=16&output=embed`; }
function todayISO(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function fmtDate(d){ if(!d) return ''; const [y,m,day]=d.split('-'); return `${day}/${m}/${y}`; }
function fmtLongDate(dateStr){
  const days=['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
  const months=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
  const d = new Date(dateStr);
  return `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]}`;
}
function combineDT(dateVal, timeVal){ if(!dateVal || !timeVal) return ''; return `${dateVal}T${timeVal}`; }
function splitDT(v){ if(!v) return {date:'', time:''}; const parts=String(v).split('T'); return {date:parts[0]||'', time:(parts[1]||'').slice(0,5)}; }
function timeOptions(selected){
  let opts = '<option value="">--:--</option>';
  const primary = [], rest = [];
  for(let h=0; h<24; h++){
    for(const m of [0,30]){
      const hh=String(h).padStart(2,'0'), mm=String(m).padStart(2,'0');
      const val = `${hh}:${mm}`;
      const entry = `<option value="${val}" ${selected===val?'selected':''}>${val}</option>`;
      (h>=8 && h<=20 ? primary : rest).push(entry);
    }
  }
  return opts + primary.join('') + rest.join('');
}
function fmtDateTime(v){
  if(!v) return '';
  const d = new Date(v);
  if(isNaN(d)) return v;
  const dd=String(d.getDate()).padStart(2,'0'), mm=String(d.getMonth()+1).padStart(2,'0'), hh=String(d.getHours()).padStart(2,'0'), min=String(d.getMinutes()).padStart(2,'0');
  return `${dd}/${mm}/${d.getFullYear()} ore ${hh}:${min}`;
}
