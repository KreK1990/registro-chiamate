<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registro Chiamate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&family=Fira+Sans+Condensed:wght@600;700;800&family=Fira+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEEEEE; --panel:#FFFFFF; --border:#D3DBE5; --border-strong:#BEC8DA; --text:#1A1A1A; --muted:#5F6B77;
  --accent:#00487E; --accent-soft:#E3E9F1; --on-accent:#FFFFFF; --brand-yellow:#DC9D00; --danger:#B3261E;
  --serif:"Fira Sans Condensed","Arial Narrow",sans-serif;
  --sans:"Fira Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"Fira Mono",ui-monospace,monospace;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1822; --panel:#14222F; --border:#27394B; --border-strong:#34506A; --text:#E6ECF2; --muted:#98A8B8;
    --accent:#7DB2E3; --accent-soft:#1B3246; --on-accent:#0D1822; --danger:#F08C80;
  }
  :root:not([data-theme="light"]) .followup.due{background:#3E1F1C;}
}
:root[data-theme="dark"]{
  --bg:#0D1822; --panel:#14222F; --border:#27394B; --border-strong:#34506A; --text:#E6ECF2; --muted:#98A8B8;
  --accent:#7DB2E3; --accent-soft:#1B3246; --on-accent:#0D1822; --danger:#F08C80;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);height:100%;-webkit-font-smoothing:antialiased;}
html,body{height:100%;}
.layout{display:flex;flex-direction:column;height:100vh;height:100dvh;}
.app{display:flex;flex:1;min-height:0;}
.bottom-cal{flex-shrink:0;border-top:1px solid var(--border);background:var(--panel);padding:9px 26px 11px;max-height:30vh;overflow-y:auto;}
.sidebar{width:320px;min-width:260px;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--panel);}
.main{flex:1;overflow-y:auto;padding:28px 32px;}
.sidebar-head{padding:20px 18px 14px;border-bottom:1px solid var(--border);}
.sidebar-head h1{font-family:var(--serif);font-weight:700;font-size:23px;letter-spacing:.2px;margin:0 0 2px;color:var(--text);}
.brand-sub{font-size:11.5px;color:var(--muted);letter-spacing:.3px;margin:0 0 14px;}
input,textarea,select{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:5px;background:var(--bg);color:var(--text);font-size:14px;font-family:var(--sans);transition:border-color .15s;}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);}
textarea{resize:vertical;min-height:60px;}
.btn{cursor:pointer;border:1px solid var(--text);border-radius:5px;padding:9px 15px;font-size:13.5px;font-weight:500;font-family:var(--sans);background:var(--text);color:var(--bg);letter-spacing:.1px;transition:opacity .15s;}
.btn:hover{opacity:.85;}
.btn.secondary{background:transparent;color:var(--text);border-color:var(--border);}
.btn.small{padding:6px 11px;font-size:12.5px;}
.btn.block{width:100%;margin-top:8px;}
.contact-list{overflow-y:auto;flex:1;}
.contact-item{padding:12px 18px;border-bottom:1px solid var(--border);cursor:pointer;border-left:3px solid transparent;transition:background .1s,border-color .1s;}
.contact-item:hover{background:var(--accent-soft);}
.contact-item.active{background:var(--accent-soft);border-left-color:var(--accent);}
.contact-item .name{font-weight:600;font-size:14px;}
.contact-item .sub{font-size:12px;color:var(--muted);margin-top:2px;}
.empty{color:var(--muted);padding:16px;font-size:14px;font-style:italic;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:20px;margin-bottom:18px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px;letter-spacing:.2px;}
h2{font-family:var(--serif);font-weight:700;margin:0 0 4px;font-size:24px;}
h3{font-family:var(--serif);font-weight:700;font-size:18px;margin:0 0 12px;color:var(--accent);}
.call-item{border-left:2px solid var(--accent);padding:8px 0 8px 12px;margin-bottom:10px;}
.call-item .date{font-size:12px;color:var(--muted);font-family:var(--mono);}
.call-item .esito{display:inline-block;font-size:11px;font-weight:500;padding:2px 8px;border-radius:4px;background:var(--accent-soft);color:var(--accent);margin-left:6px;}
.call-item .note{font-size:14px;margin-top:4px;white-space:pre-wrap;}
.top-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-bottom:12px;}
.followup{display:inline-block;font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:4px;margin-top:8px;border:1px solid transparent;}
.followup.ok{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);}
.followup.due{background:#F8E1DF;color:var(--danger);border-color:var(--danger);}
:root[data-theme="dark"] .followup.due{background:#3E1F1C;}
.custom-row{margin-top:6px;}
.nav{display:flex;flex-wrap:wrap;gap:4px;padding:2px 18px 0;border-bottom:1px solid var(--border);}
.nav button{flex:1 1 30%;padding:10px 4px;border:none;border-bottom:2px solid transparent;background:transparent;color:var(--muted);font-size:12px;font-family:var(--sans);cursor:pointer;font-weight:500;letter-spacing:.1px;margin-bottom:-1px;transition:color .15s,border-color .15s;white-space:nowrap;}
.nav button{position:relative;}
.nav-badge{position:absolute;top:2px;right:4px;min-width:15px;height:15px;padding:0 3px;border-radius:999px;background:var(--danger);color:#fff;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1;font-family:var(--sans);}
.nav button:hover{color:var(--text);}
.nav button.active{color:var(--accent);border-bottom-color:var(--accent);}
.day-group{margin-bottom:24px;}
.day-title{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--text);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border);}
table.calls-table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);border-radius:6px;overflow:hidden;}
table.calls-table th,table.calls-table td{text-align:left;padding:9px 12px;font-size:13px;border-bottom:1px solid var(--border);}
table.calls-table th{color:var(--muted);font-weight:600;background:var(--accent-soft);font-size:11.5px;letter-spacing:.2px;}
table.calls-table tr:last-child td{border-bottom:none;}
table.calls-table tbody tr[data-call-id]:hover{background:var(--accent-soft);}
.table-wrap{overflow-x:auto;}
.subnav{display:flex;gap:8px;margin-bottom:16px;}
.subnav button{padding:6px 13px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12.5px;font-family:var(--sans);cursor:pointer;font-weight:500;}
.subnav button.active{background:var(--text);color:var(--bg);border-color:var(--text);}
.week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;}
.week-nav .week-label{font-family:var(--serif);font-size:16px;}
.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:6px;overflow:hidden;min-width:918px;}
.calendar-day{background:var(--panel);padding:10px;min-height:130px;}
.calendar-day-head{font-size:11.5px;color:var(--muted);margin-bottom:8px;font-weight:600;letter-spacing:.2px;}
.calendar-day-head.today{color:var(--accent);}
.appt-chip{background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:5px 7px;font-size:12px;margin-bottom:5px;cursor:pointer;line-height:1.35;}
.appt-chip .t{font-family:var(--mono);font-weight:500;}
.appt-chip:hover{opacity:.8;}
.bar-clickable:hover{fill:color-mix(in srgb, var(--accent) 8%, transparent);}
.sidebar-today{flex:1;overflow-y:auto;padding:16px;border-top:1px solid var(--border);min-height:0;}
.sidebar-today-title{font-family:var(--serif);font-size:15px;margin-bottom:2px;}
.sidebar-today-date{font-size:11px;color:var(--muted);margin-bottom:14px;}
.mini-section-label{font-size:10px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase;margin:14px 0 6px;}
.mini-section-label:first-of-type{margin-top:0;}
.mini-row{font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--border);cursor:pointer;line-height:1.4;}
.mini-row:hover{color:var(--accent);}
.mini-row:last-of-type{border-bottom:none;}
.mini-time{font-family:var(--mono);color:var(--accent);margin-right:4px;}
.mini-empty{font-size:11.5px;color:var(--muted);font-style:italic;padding:2px 0;}
.addr-link{color:var(--accent);text-decoration:none;}
.addr-link:hover{text-decoration:underline;}
.tel-link{white-space:nowrap;font-weight:500;}
.map-embed{margin-top:12px;height:240px;border:1px solid var(--border);border-radius:2px;overflow:hidden;background:var(--accent-soft);}
.map-embed iframe{display:block;width:100%;height:100%;border:0;}
.ac-wrap{position:relative;}
.ac-list{position:absolute;left:0;right:0;top:100%;z-index:30;background:var(--panel);border:1px solid var(--border-strong);border-top:none;max-height:260px;overflow-y:auto;box-shadow:0 6px 16px rgba(0,0,0,.12);}
.ac-item{padding:9px 11px;cursor:pointer;border-top:1px solid var(--border);}
.ac-item:first-child{border-top:none;}
.ac-item:hover{background:var(--accent-soft);}
.ac-name{font-weight:600;font-size:14px;color:var(--accent);}
.ac-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.imp-map{display:grid;grid-template-columns:minmax(150px,230px) 1fr;gap:8px 12px;align-items:center;}
.imp-map label{margin:0;font-size:13px;color:var(--text);}
.name-link{cursor:pointer;color:var(--accent);}
.name-link:hover,[data-contact-id]:hover .name-link{text-decoration:underline;}
.tag-pill{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:500;margin:4px 4px 0 0;}
.esito-tag{display:inline-block;padding:2px 9px;border-radius:4px;font-size:12px;font-weight:500;}
.esito-tag.appt{background:var(--accent);color:var(--panel);font-weight:600;}
table.calls-table tbody tr.row-appt{background:color-mix(in srgb, var(--accent-soft) 55%, transparent);}
table.calls-table tbody tr.row-appt:hover{background:var(--accent-soft);}
.bottom-cal-inner{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap;}
.bottom-cal-left{flex:0 0 auto;}
.bottom-cal-right{flex:1 1 220px;min-width:200px;max-width:320px;border-left:1px solid var(--border);padding-left:24px;}
.bottom-cal-right h4{font-family:var(--serif);font-weight:700;font-size:14.5px;margin:0 0 10px;}
.month-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;max-width:640px;}
.month-header .label{font-family:var(--serif);font-size:14.5px;min-width:150px;text-align:center;}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:6px;overflow:hidden;max-width:640px;}
.month-grid .dow{background:var(--accent-soft);color:var(--muted);font-size:9.5px;font-weight:600;text-align:center;padding:2px 0;letter-spacing:.3px;}
.month-cell{background:var(--panel);min-height:27px;padding:2px 5px;}
.month-cell.other-month{opacity:.35;}
.month-cell.today .daynum{color:var(--accent);font-weight:700;}
.month-cell.has-appt{cursor:pointer;}
.month-cell.has-appt:hover{background:var(--accent-soft);}
.month-cell.selected{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent);}
.month-cell .daynum{font-size:10.5px;line-height:1.2;}
.month-cell .dots{display:flex;gap:2px;margin-top:1px;flex-wrap:wrap;}
.month-cell .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);}
.day-appts-strip{display:flex;flex-direction:column;gap:6px;}
.day-appt-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 10px;background:var(--bg);border:1px solid var(--border);border-radius:5px;font-size:13px;cursor:pointer;}
.day-appt-row:hover{background:var(--accent-soft);}
.hidden{display:none !important;}
/* Stile Schock: blu istituzionale, angoli squadrati, titoli condensed, accento giallo */
h2{color:var(--accent);font-weight:800;}
.sidebar-head h1{color:var(--accent);font-weight:800;letter-spacing:0;display:flex;align-items:center;gap:9px;}
.sidebar-head h1::before{content:"";width:13px;height:13px;background:var(--brand-yellow);flex:none;}
.topbar-title{color:var(--accent);}
.btn{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600;border-radius:2px;}
.btn.secondary{background:var(--panel);color:var(--accent);border-color:var(--border-strong);}
.card,input,textarea,select,table.calls-table,.calendar-grid,.month-grid,.appt-chip,.day-appt-row,.subnav button,.menu-btn,.followup,.esito-tag{border-radius:2px;}
.subnav button.active{background:var(--accent);color:var(--on-accent);border-color:var(--accent);}
.nav button.active{color:var(--accent);border-bottom-color:var(--brand-yellow);}
.contact-item.active{border-left-color:var(--brand-yellow);}
.call-item{border-left-color:var(--accent);}
.week-nav .week-label,.sidebar-today-title,.month-header .label{font-weight:700;}
.topbar,.drawer-backdrop,.drawer-close{display:none;}/* Schermi stretti: barra in alto con menu a tendina laterale al posto della colonna fissa */
@media (max-width:720px){
  .topbar{display:flex;align-items:center;gap:12px;flex-shrink:0;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--border);}
  .menu-btn{position:relative;display:flex;flex-direction:column;justify-content:center;gap:5px;width:42px;height:42px;padding:0 10px;border:1px solid var(--border);border-radius:6px;background:transparent;cursor:pointer;}
  .menu-btn .bar{display:block;height:2px;border-radius:1px;background:var(--text);}
  .menu-btn .nav-badge{top:-6px;right:-6px;}
  .topbar-title{font-family:var(--serif);font-weight:700;font-size:19px;}
  .app{flex-direction:column;}
  .sidebar{position:fixed;top:0;left:0;bottom:0;z-index:50;width:min(86vw,340px);min-width:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transform:translateX(-100%);transition:transform .25s ease;}
  body.drawer-open .sidebar{transform:none;box-shadow:0 0 24px rgba(0,0,0,.18);}
  .drawer-backdrop{display:block;position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.38);opacity:0;pointer-events:none;transition:opacity .25s ease;}
  body.drawer-open .drawer-backdrop{opacity:1;pointer-events:auto;}
  .sidebar-head{position:relative;}
  .drawer-close{display:block;position:absolute;top:12px;right:10px;width:38px;height:38px;border:none;background:transparent;color:var(--muted);font-size:28px;line-height:1;cursor:pointer;}
  .nav{flex-direction:column;flex-wrap:nowrap;gap:0;padding:6px 0;}
  .nav button{flex:none;text-align:left;padding:13px 18px;font-size:15px;margin:0;border-bottom:none;border-left:3px solid transparent;}
  .nav button.active{border-left-color:var(--brand-yellow);background:var(--accent-soft);}
  .nav button .nav-badge{top:50%;right:16px;transform:translateY(-50%);}
  .sidebar-today{flex:none;overflow:visible;}
  .sidebar .bottom-cal{max-height:none;overflow:visible;padding:14px 16px 18px;}
  .bottom-cal-left{width:100%;}
  .bottom-cal-right{border-left:none;padding-left:0;max-width:none;flex-basis:100%;}
  .field-row{grid-template-columns:1fr;}
  .main{padding:12px 12px 24px;}
  /* Spaziature compatte: piu' contenuto per schermata */
  #main h2{font-size:21px;margin-bottom:10px !important;}
  .card{padding:11px 14px;margin-bottom:8px;row-gap:6px !important;column-gap:12px !important;}
  .card > .followup{margin-top:0;}
  .day-group{margin-bottom:16px;}
  .subnav{margin-bottom:12px;flex-wrap:wrap;}
  .top-actions{margin-bottom:8px;}
  .map-embed{height:200px;}
  .imp-map{grid-template-columns:1fr;gap:3px;}
  .imp-map select{margin-bottom:8px;}
  .tel-link{display:inline-block;padding:4px 0;}
  /* Settimana appuntamenti: un giorno per riga invece di 7 colonne */
  .calendar-grid{grid-template-columns:1fr;min-width:0;}
  .calendar-day{min-height:0;display:flex;align-items:flex-start;gap:12px;padding:10px 12px;}
  .calendar-day-head{flex:0 0 74px;margin:5px 0 0;font-size:12.5px;white-space:nowrap;}
  .calendar-day-appts{flex:1;min-width:0;min-height:26px;}
  .calendar-day-appts .appt-chip{font-size:13.5px;padding:7px 9px;}
  .calendar-day-appts .appt-chip:last-child{margin-bottom:0;}
  .week-nav{flex-wrap:wrap;}
  .week-nav .week-label{order:-1;width:100%;text-align:center;}
  input,textarea,select{font-size:16px;}
}
</style>
</head>
<body>
<div class="layout">
  <div class="topbar">
    <button class="menu-btn" id="menuBtn" aria-label="Apri menu" aria-expanded="false" aria-controls="sidebar"><span class="bar"></span><span class="bar"></span><span class="bar"></span><span id="menuBadge" class="nav-badge hidden"></span></button>
    <div class="topbar-title" id="topbarTitle">Oggi</div>
  </div>
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <div class="app">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <button class="drawer-close" id="drawerClose" aria-label="Chiudi menu">&times;</button>
        <h1>Registro</h1>
        <div class="brand-sub">Contatti &amp; chiamate</div>
        <button class="btn secondary block" id="notifBtn" style="margin-top:10px;font-size:11px;padding:6px;">Attiva notifiche</button>
      </div>
      <div class="nav">
        <button id="navAgenda" class="active">Oggi</button>
        <button id="navContacts">Contatti</button>
        <button id="navCall">Chiamata</button>
        <button id="navFollowup">Follow-up<span id="fuBadge" class="nav-badge hidden"></span></button>
        <button id="navAppt">Appuntamenti</button>
        <button id="navTable">Tabella chiamate</button>
        <button id="navDashboard">Dashboard</button>
      </div>
      <div class="sidebar-today" id="sidebarToday"></div>
    </div>
    <div class="main" id="main"></div>
  </div>
  <div class="bottom-cal" id="bottomCal"></div>
</div>

<script>
let db=null, contacts=[], calls=[], selectedId=null, view='agenda', sortField='cognome', callStep='pick', confirmDeleteId=null, tableDetailCallId=null, clearFollowUpOnEntry=false, apptSubView='list', apptWeekOffset=0, footerCalDate=new Date(), footerSelectedDay=null, editingCallId=null, confirmDeleteCallId=null, dashboardDrilldown=null, dashboardSubView='weekly', tableFilters={search:'',esito:'',professione:''}, contactsSearchQuery=''; // view: agenda|contactsList|new|detail|table|call|followup|appt|dashboard

async function init(){
  db = await claude.use("db").catch(()=>null);
  if(!db){ document.getElementById('main').innerHTML='<div class="empty">Archiviazione non disponibile in questa vista.</div>'; return; }
  renderFooter();
  renderSidebarToday();
  db.collection('contacts').onSnapshot(snap=>{
    contacts = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(view!=='new' && !(view==='call' && callStep==='entry')) renderMain();
    renderFooter();
    renderSidebarToday();
    updateNavBadges();
  });
  db.collection('calls').onSnapshot(snap=>{
    calls = snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>(b.data||'').localeCompare(a.data||''));
    if(view!=='new' && !(view==='call' && callStep==='entry')) renderMain();
    renderFooter();
    renderSidebarToday();
  });
}

function contactsListView(){
  const q = contactsSearchQuery.trim().toLowerCase();
  const filtered = contacts.filter(c=>!q || (c.nome||'').toLowerCase().includes(q) || (c.cognome||'').toLowerCase().includes(q) || (c.azienda||'').toLowerCase().includes(q) || (c.telefono||'').includes(q) || (c.cellulare||'').includes(q) || (c.tag||'').toLowerCase().includes(q));
  filtered.sort((a,b)=>{
    const ka = (sortField==='cognome' ? (a.cognome||a.nome||'') : (a.nome||''));
    const kb = (sortField==='cognome' ? (b.cognome||b.nome||'') : (b.nome||''));
    return ka.localeCompare(kb);
  });
  const toolbar = `<div class="card" style="padding:14px 16px;">
    <div class="field-row" style="grid-template-columns:2fr 1fr;">
      <div><label>Cerca</label><input id="contactsSearch" value="${esc(contactsSearchQuery)}" placeholder="Nome, cognome, azienda, tag..."></div>
      <div><label>Ordina per</label><select id="contactsSortSelect">
        <option value="cognome" ${sortField==='cognome'?'selected':''}>Cognome</option>

async function deleteContact(c){
  try{
    const related = calls.filter(k=>k.contactId===c.id);
    for(const k of related){ await db.collection('calls').doc(k.id).delete(); }
    await db.collection('contacts').doc(c.id).delete();
    confirmDeleteId=null; selectedId=null; view='contactsList'; renderMain();
  }catch(e){ alert('Errore durante l\'eliminazione: '+(e.message||e.code||'')); }
}

function renderSidebarToday(){
  const el = document.getElementById('sidebarToday');
  if(!el) return;
  const now = new Date();
  const todayStr = now.toDateString();
  const byId = Object.fromEntries(contacts.map(c=>[c.id,c]));
  const dayNames=['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
  const monthNames=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
  const dateLabel = `${dayNames[now.getDay()]} ${now.getDate()} ${monthNames[now.getMonth()]}`;
  const todayAppts = apptCalls().filter(k=> new Date(k.appuntamento).toDateString()===todayStr).sort((a,b)=>a.appuntamento.localeCompare(b.appuntamento));
  const dueFU = contacts.filter(c=>c.followUp && new Date(c.followUp)<=now);
  const todayFU = contacts.filter(c=>c.followUp && new Date(c.followUp)>now && new Date(c.followUp).toDateString()===todayStr);
  const fuList = [...dueFU, ...todayFU].sort((a,b)=>a.followUp.localeCompare(b.followUp));

  const apptHtml = todayAppts.length ? todayAppts.map(k=>{
    const c = byId[k.contactId]||{};
    const t = new Date(k.appuntamento);
    const hh=String(t.getHours()).padStart(2,'0'), mm=String(t.getMinutes()).padStart(2,'0');
    return `<div class="mini-row" data-appt-call-id="${k.id}"><span class="mini-time">${hh}:${mm}</span>${esc(fullName(c))}</div>`;
  }).join('') : '<div class="mini-empty">Nessun appuntamento</div>';

  const fuHtml = fuList.length ? fuList.map(c=>{
    const due = new Date(c.followUp)<=now;
    const fuDate = new Date(c.followUp);
    const dtLabel = `${String(fuDate.getDate()).padStart(2,'0')}/${String(fuDate.getMonth()+1).padStart(2,'0')} ${String(fuDate.getHours()).padStart(2,'0')}:${String(fuDate.getMinutes()).padStart(2,'0')}`;
    return `<div class="mini-row" data-fu-id="${c.id}" style="display:flex;justify-content:space-between;align-items:center;gap:8px;"><span>${esc(fullName(c))}</span><span class="mini-time">${due?'<span style="color:var(--danger);">● </span>':''}${dtLabel}</span></div>`;
  }).join('') : '<div class="mini-empty">Nessun follow-up</div>';

  el.innerHTML = `
    <div class="sidebar-today-title">Oggi</div>
    <div class="sidebar-today-date">${dateLabel}</div>
    <div class="mini-section-label">Appuntamenti (${todayAppts.length})</div>
    ${apptHtml}
    <div class="mini-section-label">Follow-up (${fuList.length})</div>
    ${fuHtml}
  `;
  el.querySelectorAll('[data-appt-call-id]').forEach(row=>{
    row.addEventListener('click', ()=>{ tableDetailCallId=row.dataset.apptCallId; renderMain(); });
  });
  el.querySelectorAll('[data-fu-id]').forEach(row=>{
    row.addEventListener('click', ()=>{
      selectedId=row.dataset.fuId; clearFollowUpOnEntry=true; view='call'; callStep='entry';
      setActiveTab('navCall');
      renderMain();
    });
  });
}

const PROFESSIONI = ['Ingegnere','Geometra','Architetto','Avvocato','Notaio','Commercialista','Consulente','Altro'];
function renderFooter(){
  const el = document.getElementById('bottomCal');
  if(!el) return;
  const y = footerCalDate.getFullYear(), m = footerCalDate.getMonth();
  const monthNames = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
  const dow = ['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
  const first = new Date(y,m,1);
  const startOffset = (first.getDay()+6)%7;
  const daysInMonth = new Date(y,m+1,0).getDate();
  const prevDaysInMonth = new Date(y,m,0).getDate();
  const cells = [];
  for(let i=0;i<startOffset;i++){ const dnum=prevDaysInMonth-startOffset+i+1; cells.push({d:dnum, other:true, dateObj:new Date(y,m-1,dnum)}); }
  for(let d=1; d<=daysInMonth; d++){ cells.push({d, other:false, dateObj:new Date(y,m,d)}); }
  let nextD=1;
  while(cells.length<42){ cells.push({d:nextD, other:true, dateObj:new Date(y,m+1,nextD)}); nextD++; }
  const todayStr = new Date().toDateString();
  const list = apptCalls();
  const byDateCount = {};
  list.forEach(k=>{ const ds = new Date(k.appuntamento).toDateString(); byDateCount[ds]=(byDateCount[ds]||0)+1; });
  const grid = cells.map(c=>{
    const ds = c.dateObj.toDateString();
    const count = byDateCount[ds]||0;
    return `<div class="month-cell ${c.other?'other-month':''} ${ds===todayStr?'today':''} ${count?'has-appt':''} ${footerSelectedDay===ds?'selected':''}" data-daystr="${ds}">
      <div class="daynum">${c.d}</div>
      ${count?`<div class="dots">${Array.from({length:Math.min(count,4)}).map(()=>'<span class="dot"></span>').join('')}</div>`:''}
    </div>`;
  }).join('');
  const byId = Object.fromEntries(contacts.map(c=>[c.id,c]));
  const dayList = footerSelectedDay ? list.filter(k=>new Date(k.appuntamento).toDateString()===footerSelectedDay) : [];
  el.innerHTML = `
    <div class="bottom-cal-inner">
      <div class="bottom-cal-left">
        <div class="month-header">
          <button class="btn secondary small" id="monthPrevBtn">←</button>
          <div class="label">${monthNames[m]} ${y}</div>
          <button class="btn secondary small" id="monthNextBtn">→</button>
        </div>
        <div class="month-grid">
          ${dow.map(d=>`<div class="dow">${d}</div>`).join('')}
          ${grid}
        </div>
      </div>
      ${footerSelectedDay ? `<div class="bottom-cal-right">
        <h4>${fmtLongDate(footerSelectedDay)}</h4>
        <div class="day-appts-strip">
          ${dayList.length? dayList.map(k=>{ const c=byId[k.contactId]||{}; const t=new Date(k.appuntamento); const hh=String(t.getHours()).padStart(2,'0'),mm=String(t.getMinutes()).padStart(2,'0');
            return `<div class="day-appt-row" data-appt-call-id="${k.id}" style="flex-direction:column;align-items:stretch;">
          <span>${hh}:${mm} — ${esc(fullName(c))}${k.progetto?' · '+esc(k.progetto):''}</span>
          ${fullAddress(c)?`<a href="${mapsUrl(c)}" target="_blank" rel="noopener" class="addr-link" onclick="event.stopPropagation()" style="font-size:11.5px;">${esc(fullAddress(c))} · Indicazioni</a>`:''}
        </div>`;
          }).join('') : `<div class="empty" style="padding:0;">Nessun appuntamento in questo giorno.</div>`}
        </div>
      </div>` : ''}
    </div>`;
  document.getElementById('monthPrevBtn').addEventListener('click', ()=>{ footerCalDate=new Date(y,m-1,1); footerSelectedDay=null; renderFooter(); });
  document.getElementById('monthNextBtn').addEventListener('click', ()=>{ footerCalDate=new Date(y,m+1,1); footerSelectedDay=null; renderFooter(); });
  el.querySelectorAll('.month-cell.has-appt').forEach(cell=>{
    cell.addEventListener('click', ()=>{ footerSelectedDay = footerSelectedDay===cell.dataset.daystr ? null : cell.dataset.daystr; renderFooter(); });
  });
  el.querySelectorAll('[data-appt-call-id]').forEach(row=>{
    row.addEventListener('click', ()=>{ tableDetailCallId=row.dataset.apptCallId; renderMain(); });
  });
}

function loadXLSX(){
  if(window.XLSX) return Promise.resolve();
  return new Promise((resolve, reject)=>{
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload = ()=>resolve();
    sc.onerror = ()=>reject(new Error('libreria Excel non caricata, controlla la connessione'));
    document.head.appendChild(sc);
  });
}
function normName(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim(); }
const IMPORT_SYNONYMS = IMPORT_FIELDS.flatMap(f=>f[2].map(normName));
function headerScore(cells){
  return cells.filter(v=>{ const h = normName(v); return h && IMPORT_SYNONYMS.some(x=>h===x || (x.length>2 && h.includes(x))); }).length;
}

function guessImportMapping(headers){
  const H = headers.map(normName);
  const used = new Set(), map = {};
  ['exact','includes'].forEach(pass=>{
    IMPORT_FIELDS.forEach(([key,,syn])=>{
      if(map[key]!==undefined) return;
      const S = syn.map(normName);
      const idx = H.findIndex((h,i)=>!used.has(i) && h && (pass==='exact' ? S.includes(h) : S.some(x=>x.length>2 && h.includes(x))));
      if(idx>=0){ map[key] = idx; used.add(idx); }
    });
  });
  IMPORT_FIELDS.forEach(([key])=>{ if(map[key]===undefined) map[key] = ''; });
  return map;
}

// Data (ed eventuale ora) da cella Excel o testo: "15/01/2026", "15/01/26 10:30",
// "2026-01-15", "08/04 alle ore 11:30" (senza anno: si usa l'anno della data di
// riferimento refDate "YYYY-MM-DD", o quello successivo se cadrebbe prima).
function parseImpDate(v, refDate){
  if(v===null || v===undefined || String(v).trim()==='') return null;
  const pad = n=>String(n).padStart(2,'0');
  const mk = (y,m,d,H,M)=>{
    const dt = new Date(y, m-1, d);
    if(dt.getFullYear()!==y || dt.getMonth()!==m-1 || dt.getDate()!==d) return null;
    if(H!==null && (H>23 || M>59)) return null;
    return { date:`${y}-${pad(m)}-${pad(d)}`, time: H!==null ? `${pad(H)}:${pad(M)}` : null };
  };
  const hm = (a,b)=>a!==undefined ? [+a, +b] : [null, null];
  if(typeof v==='number'){
    const p = XLSX.SSF.parse_date_code(v);
    if(!p || p.y<1990) return null;
    const hasTime = (v % 1) > 1e-9;
    return mk(p.y, p.m, p.d, hasTime ? p.H : null, hasTime ? p.M : null);
  }
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4}|\d{2})(?!\d)(?:\D+?(\d{1,2})[:.](\d{2}))?/);
  if(m){ let y = +m[3]; if(y<100) y += 2000; return mk(y, +m[2], +m[1], ...hm(m[4], m[5])); }
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/);
  if(m) return mk(+m[1], +m[2], +m[3], ...hm(m[4], m[5]));
  m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})(?![\/.\-]?\d)(?:\D+?(\d{1,2})[:.](\d{2}))?/);
  if(m){
    // senza anno: l'anno (precedente, stesso o successivo) che porta la data piu' vicina
    // a quella di riferimento (la chiamata, oppure oggi)
    const base = refDate ? +refDate.slice(0,4) : new Date().getFullYear();
    const ref = refDate ? new Date(refDate) : new Date();
    let best = null;
    [base-1, base, base+1].forEach(y=>{
      const r = mk(y, +m[2], +m[1], ...hm(m[3], m[4]));
      if(!r) return;
      const diff = Math.abs(new Date(r.date) - ref);
      if(!best || diff < best.diff) best = { r, diff };
    });
    return best ? best.r : null;
  }
  return null;
}
function parseImpTime(v){
  const pad = n=>String(n).padStart(2,'0');
  if(typeof v==='number'){
    if(Number.isInteger(v)) return (v>=0 && v<24) ? `${pad(v)}:00` : null;   // "10" scritto come numero
    const mins = Math.round((v % 1) * 1440) % 1440;                           // frazione di giorno di Excel
    return `${pad(Math.floor(mins/60))}:${pad(mins%60)}`;
  }
  const m = String(v).trim().match(/^(?:h\s*)?(\d{1,2})(?:[:.](\d{2}))?(?:\s*[-–].*)?$/i);
  if(!m) return null;
  const H = +m[1], M = m[2] ? +m[2] : 0;
  return (H>23 || M>59) ? null : `${pad(H)}:${pad(M)}`;
}
// "Arch. Mario Rossi" -> professione Architetto. order: 'cn' = Cognome Nome (il nome e'
// l'ultima parola: "De Luca Antonino"), 'nc' = Nome Cognome, 'auto' = deciso dai nomi
// propri noti, altrimenti fallback.
function clienteTokens(s){
  const TITLES = { arch:'Architetto', architetto:'Architetto', ing:'Ingegnere', ingegnere:'Ingegnere', geom:'Geometra', geometra:'Geometra',
    avv:'Avvocato', avvocato:'Avvocato', notaio:'Notaio', dott:'', dottssa:'', dottoressa:'', dottore:'', dr:'', sig:'', sigra:'', signor:'', signora:'', sigg:'' };
  const toks = s.split(/\s+/).filter(Boolean);
  let professione = '';
  while(toks.length>1){
    const t = toks[0].toLowerCase().replace(/\./g,'');
    if(!(t in TITLES)) break;
    if(TITLES[t] && !professione) professione = TITLES[t];
    toks.shift();
  }
  return { toks, professione };
}
function detectNameOrder(toks){
  if(toks.length<2) return null;
  const f = FIRST_NAMES.has(normName(toks[0])), l = FIRST_NAMES.has(normName(toks[toks.length-1]));
  return f && !l ? 'nc' : l && !f ? 'cn' : null;
}
function splitCliente(s, order, fallback){
  const { toks, professione } = clienteTokens(s);
  if(toks.length===1) return { nome:'', cognome:toks[0], professione };
  const o = order==='auto' ? (detectNameOrder(toks) || fallback || 'cn') : order;
  return o==='nc'
    ? { nome:toks[0], cognome:toks.slice(1).join(' '), professione }
    : { nome:toks[toks.length-1], cognome:toks.slice(0,-1).join(' '), professione };
}
function matchImpContact(nome, cognome, studio){
  let cands;
  if(nome && cognome){
    const a = normName(nome+' '+cognome), b = normName(cognome+' '+nome);
    cands = contacts.filter(c=>{ const x = normName((c.nome||'')+' '+(c.cognome||'')); return x===a || x===b; });
  }else if(nome || cognome){
    const one = normName(cognome || nome);
    cands = contacts.filter(c=>normName(c.cognome)===one || (!c.cognome && normName(c.nome)===one));
  }else{
    cands = contacts.filter(c=>!c.nome && !c.cognome && normStudio(c.azienda)===normStudio(studio));
  }
  if(cands.length>1 && studio){
    const f = cands.filter(c=>normStudio(c.azienda)===normStudio(studio));
    if(f.length) cands = f;
  }
  return cands.length===1 ? { contact:cands[0] } : cands.length>1 ? { ambiguous:cands } : {};
}

function buildImportRows(s){
  const M = s.mapping;
  const get = (r,k)=>M[k]==='' ? '' : r.cells[M[k]];
  const str = v=>String(v===null || v===undefined ? '' : v).trim();
  // ordine prevalente nella colonna Cliente, per le righe in cui i nomi non bastano a deciderlo
  let fallback = 'cn';
  if(M.cliente!==''){
    const votes = { cn:0, nc:0 };
    s.dataRows.forEach(r=>{ const o = detectNameOrder(clienteTokens(str(get(r,'cliente'))).toks); if(o) votes[o]++; });
    fallback = votes.nc > votes.cn ? 'nc' : 'cn';
  }
  const pending = new Map(), seen = new Set();
  return s.dataRows.map(r=>{
    const out = { n:r.rowNum, issues:[], warn:[] };
    const call = M.chiamata!=='' ? parseImpDate(get(r,'chiamata')) : null;
    if(str(get(r,'chiamata')) && !call) out.issues.push(`data chiamata non valida: "${str(get(r,'chiamata'))}"`);
    const rawAppt = str(get(r,'data'));
    const dt = rawAppt ? parseImpDate(get(r,'data'), call ? call.date : null) : null;
    if(rawAppt && !dt) out.issues.push(`appuntamento non leggibile: "${rawAppt}"`);
    if(!rawAppt && !call && !out.issues.length) out.issues.push('data mancante');
    out.hasAppt = !!dt;
    out.callDate = call ? call.date : (dt ? dt.date : '');
    out.date = dt ? dt.date : '';
    if(dt){
      let time = null;
      if(str(get(r,'ora'))!==''){ time = parseImpTime(get(r,'ora')); if(!time) out.issues.push('ora non valida'); }
      else if(dt.time) time = dt.time;
      if(!time && !out.issues.includes('ora non valida')){ time = '09:00'; out.warn.push('ora non indicata: 09:00'); }
      out.time = time;
    }

    let nome = str(get(r,'nome')), cognome = str(get(r,'cognome')), professione = str(get(r,'professione'));
    if(!nome && !cognome && str(get(r,'cliente'))){
      const p = splitCliente(str(get(r,'cliente')), s.nameOrder || 'auto', fallback);
      nome = p.nome; cognome = p.cognome; if(!professione) professione = p.professione;
    }
    const studioRaw = str(get(r,'studio'));
    const st = studioRaw ? findStudio(studioRaw) : null;
    Object.assign(out, {
      nome, cognome, professione,
      studio: st ? bestStudioName([...st.members.map(m=>m.azienda), studioRaw]) : studioRaw,
      via: str(get(r,'via')), citta: str(get(r,'citta')), email: str(get(r,'email')),
      cellulare: str(get(r,'cellulare')) ? formatPhone(str(get(r,'cellulare'))) : '',
      telefono: str(get(r,'telefono')) ? formatPhone(str(get(r,'telefono'))) : '',
      progetto: str(get(r,'progetto')), note: str(get(r,'note'))
    });
    if(!nome && !cognome && !out.studio) out.issues.push('manca il cliente');

    if(!out.issues.length){
      const m = matchImpContact(nome, cognome, out.studio);
      if(m.ambiguous) out.issues.push(`più contatti corrispondono (${m.ambiguous.map(fullName).join(', ')}): indica nome e studio`);
      else if(m.contact) out.contact = m.contact;
      else{
        const key = normName(nome+' '+cognome)+'|'+normStudio(out.studio);
        if(!pending.has(key)) pending.set(key, out.n);
        out.newKey = key; out.newFirstRow = pending.get(key);
      }
    }
    if(!out.issues.length){
      if(!out.hasAppt && s.includeCallsOnly===false) out.skip = 'chiamata senza appuntamento (esclusa)';
      else{
        const day = out.hasAppt ? 'A'+out.date : 'C'+out.callDate;
        const dupKey = (out.contact ? out.contact.id : out.newKey)+'|'+day;
        if(seen.has(dupKey)) out.skip = 'ripetuto nel file (stesso cliente e giorno)';
        else if(out.contact && calls.some(k=>k.contactId===out.contact.id && (out.hasAppt ? (k.appuntamento||'').slice(0,10)===out.date : k.data===out.callDate))) out.skip = 'già presente nell\'app';
        seen.add(dupKey);
      }
    }
    if(out.hasAppt && out.date>todayISO()) out.warn.push('incontro futuro');
    if(out.hasAppt && call && out.date<call.date) out.warn.push('incontro precedente alla chiamata: controlla le date');
    return out;
  });
}

function importView(){
  const s = window.__imp || (window.__imp = { step:'file' });
  const head = `<div class="top-actions" style="justify-content:space-between;"><button class="btn secondary small" id="impBackBtn">← Torna agli appuntamenti</button></div>
    <h2 style="margin-bottom:12px;">Importa incontri da Excel</h2>`;
  if(s.step==='file') return head + `<div class="card">
    <p style="margin-top:0;font-size:14px;line-height:1.5;">Scegli il file Excel con le chiamate e gli incontri già svolti: una riga per chiamata o incontro, con una riga di titoli delle colonne. Nel passo successivo indicherai quale colonna contiene cosa e vedrai un'anteprima: nulla viene salvato finché non confermi.</p>
    <input type="file" id="impFile" accept=".xlsx,.xls,.csv">
    ${s.loading ? '<div style="font-size:13px;color:var(--muted);margin-top:8px;">Lettura del file…</div>' : ''}
    ${s.error ? `<div style="color:var(--danger);font-size:13px;margin-top:8px;">${esc(s.error)}</div>` : ''}
    <div style="margin-top:14px;font-size:13px;color:var(--muted);">Non hai un file pronto? <a href="#" id="impTemplateLink" class="addr-link">Scarica il modello Excel</a></div>
  </div>`;

  if(s.step==='map'){
    const ncols = Math.max(s.headers.length, ...s.dataRows.slice(0,50).map(r=>r.cells.length));
    const cols = [...Array(ncols)].map((_,i)=>({ i, label: s.headers[i] || `Colonna ${i+1}` }));
    const sample = s.dataRows[0] ? s.dataRows[0].cells : [];
    const ex = (i,key)=>{
      const v = sample[i];
      if(v===undefined || String(v).trim()==='') return '';
      const shown = typeof v==='number' && (key==='data' || key==='chiamata') ? ((parseImpDate(v)||{}).date || v) : v;
      return ' (es. '+esc(String(shown).slice(0,30))+')';
    };
    return head + `<div class="card">
      <h3>1. Associa le colonne</h3>
      <div style="font-size:13px;color:var(--muted);margin-bottom:12px;">File <strong>${esc(s.fileName)}</strong>: ${s.dataRows.length} righe con dati (titoli alla riga ${s.headerRowNum}).
        Ho riconosciuto le colonne dai titoli: controlla e correggi se serve. Serve almeno una data (della chiamata o dell'incontro) e il cliente.</div>
      ${s.wb.SheetNames.length>1 ? `<div class="imp-map" style="margin-bottom:12px;"><label>Foglio</label><select id="impSheet">${s.wb.SheetNames.map(n=>`<option ${n===s.sheet?'selected':''}>${esc(n)}</option>`).join('')}</select></div>` : ''}
      <div class="imp-map">
        ${IMPORT_FIELDS.map(([key,label])=>`<label>${label}</label>
          <select data-map="${key}"><option value="">— nessuna —</option>${cols.map(c=>`<option value="${c.i}" ${s.mapping[key]===c.i?'selected':''}>${esc(c.label)}${ex(c.i,key)}</option>`).join('')}</select>`).join('')}
        <label>Ordine nella colonna Cliente</label>
        <select id="impNameOrder">
          <option value="auto" ${(s.nameOrder||'auto')==='auto'?'selected':''}>Automatico (riconosce i nomi propri)</option>
          <option value="cn" ${s.nameOrder==='cn'?'selected':''}>Cognome Nome</option>
          <option value="nc" ${s.nameOrder==='nc'?'selected':''}>Nome Cognome</option>
        </select>
      </div>
      ${s.mapError ? `<div style="color:var(--danger);font-size:13px;margin-top:10px;">${esc(s.mapError)}</div>` : ''}
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;">
        <button class="btn" id="impPreviewBtn">Vedi anteprima</button>
        <button class="btn secondary" id="impOtherFileBtn">Scegli un altro file</button>
      </div>
    </div>`;
  }

  if(s.step==='preview'){
    const rows = buildImportRows(s);
    const ok = rows.filter(r=>!r.issues.length && !r.skip);
    const nAppt = ok.filter(r=>r.hasAppt).length, nCalls = ok.length - nAppt;
    const nCallsOnlyAll = rows.filter(r=>!r.issues.length && !r.hasAppt).length;
    const nNew = new Set(ok.filter(r=>r.newKey).map(r=>r.newKey)).size;
    const nErr = rows.filter(r=>r.issues.length).length;
    const nSkip = rows.filter(r=>r.skip && !/esclusa/.test(r.skip)).length;
    const status = r=>{
      if(r.issues.length) return `<span style="color:var(--danger);font-weight:600;">Errore: ${esc(r.issues.join('; '))}</span>`;
      if(r.skip) return `<span style="color:var(--muted);">Saltato: ${esc(r.skip)}</span>`;
      const base = r.contact ? `Cliente esistente` : (r.newFirstRow===r.n ? '<strong>Nuovo contatto</strong>' : `Nuovo contatto (come riga ${r.newFirstRow})`);
      return base + (r.warn.length ? ` <span style="color:var(--muted);">· ${esc(r.warn.join(' · '))}</span>` : '');
    };
    const who = r=>r.contact
      ? esc(fullName(r.contact))
      : ((r.cognome ? `<strong>${esc(r.cognome)}</strong>` : '') + (r.nome ? ' '+esc(r.nome) : '') || '—');
    return head + `<div class="card">
      <h3>2. Anteprima</h3>
      <div style="font-size:14px;line-height:1.6;">
        Da importare: <strong>${nAppt}</strong> incontri${nCalls ? ` e <strong>${nCalls}</strong> chiamate senza appuntamento` : ''}${nNew ? `, con <strong>${nNew}</strong> nuovi contatti` : ''}.
        ${nSkip ? `<br><span style="color:var(--muted);">${nSkip} righe saltate (già presenti o ripetute).</span>` : ''}
        ${nErr ? `<br><span style="color:var(--danger);">${nErr} righe con errori non verranno importate: correggile nel file e ricaricalo, oppure importa le altre.</span>` : ''}
        <br><span style="color:var(--muted);">Nei nuovi contatti il cognome è in <strong>grassetto</strong>: controlla che nome e cognome non siano invertiti.</span>
      </div>
      ${nCallsOnlyAll ? `<label style="display:flex;align-items:center;gap:7px;margin-top:10px;cursor:pointer;font-size:13.5px;color:var(--text);"><input type="checkbox" id="impCallsOnly" style="width:auto;" ${s.includeCallsOnly===false?'':'checked'}>Importa anche le ${nCallsOnlyAll} chiamate senza appuntamento (per lo storico)</label>` : ''}
      <div class="table-wrap" style="margin-top:12px;"><table class="calls-table">
        <thead><tr><th>Riga</th><th>Chiamata</th><th>Incontro</th><th>Cliente</th><th>Studio</th><th>Esito anteprima</th></tr></thead>
        <tbody>${rows.map(r=>`<tr class="${r.hasAppt?'row-appt':''}">
          <td>${r.n}</td><td>${r.callDate ? fmtDate(r.callDate) : '—'}</td><td>${r.hasAppt ? fmtDate(r.date)+' '+esc(r.time||'') : '—'}</td>
          <td>${who(r)}${r.professione && !r.contact ? `<div style="font-size:11.5px;color:var(--muted);">${esc(r.professione)}</div>` : ''}</td>
          <td>${esc(r.studio||'—')}</td><td>${status(r)}</td></tr>`).join('')}</tbody>
      </table></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;">
        <button class="btn" id="impRunBtn" ${ok.length ? '' : 'disabled'}>Importa ${ok.length} righe</button>
        <button class="btn secondary" id="impBackMapBtn">← Modifica colonne</button>
      </div>
    </div>`;
  }

  if(s.step==='running') return head + `<div class="card"><h3>${s.undoing ? 'Annullamento in corso…' : 'Importazione in corso…'}</h3>
    <div style="font-size:14px;">${s.progress.done} di ${s.progress.total}. Non chiudere l'app.</div></div>`;

  if(s.step==='done'){
    const nC = s.created.contacts.length, nK = s.created.calls.length;
    if(s.undone) return head + `<div class="card"><h3>Importazione annullata</h3>
      <div style="font-size:14px;">Ho eliminato le ${nK} chiamate/incontri e i ${nC} contatti creati da questa importazione.</div>
      <button class="btn" id="impFinishBtn" style="margin-top:12px;">Torna agli appuntamenti</button></div>`;
    return head + `<div class="card"><h3>${s.failed ? 'Importazione interrotta' : 'Importazione completata'}</h3>
      <div style="font-size:14px;line-height:1.6;">
        ${s.failed ? `<span style="color:var(--danger);">Errore: ${esc(s.failed)}.</span><br>` : ''}
        Importati <strong>${s.created.appts}</strong> incontri${nK - s.created.appts ? ` e <strong>${nK - s.created.appts}</strong> chiamate` : ''}${nC ? `, creati <strong>${nC}</strong> nuovi contatti` : ''}.
        Gli incontri sono in <strong>Appuntamenti → Svolti</strong>; tutto è anche nello storico di ogni cliente.
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;">
        <button class="btn" id="impFinishBtn">Vai agli incontri svolti</button>
        ${nK || nC ? `<button class="btn secondary" id="impUndoBtn">${s.undoConfirm ? `Conferma: elimina le ${nK} righe importate e i ${nC} contatti creati` : 'Annulla questa importazione'}</button>` : ''}
      </div></div>`;
  }
  return head;
}

function bindImport(){
  const s = window.__imp;
  const rerender = ()=>renderMain();
  document.getElementById('impBackBtn').addEventListener('click', ()=>{ window.__imp = null; view = 'appt'; renderMain(); });
  if(s.step==='file'){
    document.getElementById('impFile').addEventListener('change', e=>{ const f = e.target.files[0]; if(f) readImportFile(f); });
    document.getElementById('impTemplateLink').addEventListener('click', e=>{ e.preventDefault(); downloadImportTemplate(); });
  }
  if(s.step==='map'){
    document.getElementById('impSheet')?.addEventListener('change', e=>{ selectImportSheet(e.target.value); rerender(); });
    document.querySelectorAll('[data-map]').forEach(sel=>sel.addEventListener('change', ()=>{
      s.mapping[sel.dataset.map] = sel.value==='' ? '' : +sel.value;
    }));
    document.getElementById('impNameOrder').addEventListener('change', e=>{ s.nameOrder = e.target.value; });
    document.getElementById('impPreviewBtn').addEventListener('click', ()=>{
      const M = s.mapping;
      if(M.data==='' && M.chiamata==='') s.mapError = 'Indica la colonna con la data della chiamata o dell\'incontro.';
      else if(M.cliente==='' && M.cognome==='' && M.nome==='' && M.studio==='') s.mapError = 'Indica almeno la colonna del cliente (oppure Nome/Cognome, oppure Studio).';
      else { s.mapError = ''; s.step = 'preview'; }
      rerender();
    });
    document.getElementById('impOtherFileBtn').addEventListener('click', ()=>{ window.__imp = { step:'file' }; rerender(); });
  }
  if(s.step==='preview'){
    document.getElementById('impCallsOnly')?.addEventListener('change', e=>{ s.includeCallsOnly = e.target.checked; rerender(); });
    document.getElementById('impBackMapBtn').addEventListener('click', ()=>{ s.step = 'map'; rerender(); });
    document.getElementById('impRunBtn').addEventListener('click', runImport);
  }
  if(s.step==='done'){
    document.getElementById('impFinishBtn').addEventListener('click', ()=>{ window.__imp = null; view = 'appt'; apptSubView = 'done'; renderMain(); });
    document.getElementById('impUndoBtn')?.addEventListener('click', ()=>{
      if(!s.undoConfirm){ s.undoConfirm = true; rerender(); return; }
      undoImport();
    });
  }
}

async function readImportFile(file){
  const s = window.__imp;
  s.loading = true; s.error = ''; renderMain();
  try{
    await loadXLSX();
    s.wb = XLSX.read(await file.arrayBuffer(), { type:'array' });
    s.fileName = file.name;
    selectImportSheet(s.wb.SheetNames[0]);
    if(!s.dataRows.length) throw new Error('il foglio non contiene righe di dati sotto i titoli');
    s.step = 'map';
  }catch(e){ s.error = 'Impossibile leggere il file: '+(e.message||e); }
  s.loading = false; renderMain();
}
function selectImportSheet(name){
  const s = window.__imp;
  s.sheet = name;
  const rows = XLSX.utils.sheet_to_json(s.wb.Sheets[name], { header:1, raw:true, defval:'' });
  const nonEmpty = cells=>cells.some(v=>String(v).trim()!=='');
  // Riga dei titoli: tra le prime 10, quella con piu' titoli riconosciuti (un eventuale
  // titolo del foglio sopra, tipo "DIARIO SETTIMANALE", viene ignorato).
  let hi = -1, best = 0;
  rows.slice(0,10).forEach((cells,i)=>{ const sc = headerScore(cells); if(sc>best){ best = sc; hi = i; } });
  if(hi<0) hi = Math.max(0, rows.findIndex(nonEmpty));
  s.headerRowNum = hi+1;
  s.headers = (rows[hi]||[]).map(h=>String(h).trim());
  s.dataRows = rows.map((cells,i)=>({ cells, rowNum:i+1 })).slice(hi+1).filter(r=>nonEmpty(r.cells));
  s.mapping = guessImportMapping(s.headers);
}
async function downloadImportTemplate(){
  try{
    await loadXLSX();
    const ws = XLSX.utils.aoa_to_sheet([
      ['Data chiamata','Appuntamento','Nome','Cognome','Professione','Studio/Attività','Via','Città','Cellulare','Telefono studio','Email','Progetto','Note'],
      ['10/01/2026','15/01/2026 alle 10:30','Mario','Rossi','Architetto','Studio Esempio','Via Roma 1','Torino','333 1234567','011 1234567','','Balconi','Presentazione prodotti, richiamare a febbraio']
    ]);
    ws['!cols'] = [12,20,12,14,13,20,18,12,13,15,20,16,40].map(w=>({ wch:w }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Incontri');
    XLSX.writeFile(wb, 'modello-incontri.xlsx');
  }catch(e){ alert('Impossibile creare il modello: '+(e.message||e)); }
}
async function runImport(){
  const s = window.__imp;
  const rows = buildImportRows(s).filter(r=>!r.issues.length && !r.skip);
  s.step = 'running'; s.undoing = false; s.progress = { done:0, total:rows.length };
  s.created = { contacts:[], calls:[], appts:0 }; s.batch = 'imp-'+Date.now(); s.failed = ''; s.undone = false; s.undoConfirm = false;
  renderMain();
  const newIds = new Map();
  try{
    for(const r of rows){
      let contactId = r.contact ? r.contact.id : newIds.get(r.newKey);
      if(!contactId){
        const st = r.studio ? findStudio(r.studio) : null;
        const ref = await db.collection('contacts').add({
          nome:r.nome, cognome:r.cognome, professione:r.professione, cellulare:r.cellulare,
          azienda:r.studio, via:r.via || (st && st.via) || '', citta:r.citta || (st && st.citta) || '',
          telefono:r.telefono || (st && st.telefono) || '', email:r.email, followUp:'', tag:'', note:'',
          createdAt:Date.now(), importBatch:s.batch
        });
        contactId = ref.id; newIds.set(r.newKey, contactId); s.created.contacts.push(contactId);
      }
      const ref = await db.collection('calls').add({
        contactId, data:r.callDate, esito: r.hasAppt ? 'Appuntamento fissato' : '', progetto:r.progetto,
        note: r.hasAppt ? '' : r.note, appuntamento: r.hasAppt ? `${r.date}T${r.time}` : '',
        noteIncontro: r.hasAppt ? r.note : '', createdAt:Date.now(), importBatch:s.batch
      });
      s.created.calls.push(ref.id);
      if(r.hasAppt) s.created.appts++;
      s.progress.done++;
      if(view==='import') renderMain();
    }
  }catch(e){ s.failed = e.code || e.message || String(e); }
  s.step = 'done';
  if(view==='import') renderMain();
}
async function undoImport(){
  const s = window.__imp;
  s.step = 'running'; s.undoing = true; s.progress = { done:0, total:s.created.calls.length + s.created.contacts.length }; renderMain();
  try{
    for(const id of s.created.calls){ await db.collection('calls').doc(id).delete(); s.progress.done++; }
    for(const id of s.created.contacts){ await db.collection('contacts').doc(id).delete(); s.progress.done++; }
    s.undone = true;
  }catch(e){ s.failed = 'annullamento non completato: '+(e.code || e.message || e); }
  s.step = 'done'; s.undoConfirm = false;
  if(view==='import') renderMain();
}

function startOfWeek(d){
  const dt = new Date(d);
  const day = (dt.getDay()+6)%7; // Monday=0
  dt.setHours(0,0,0,0);
  dt.setDate(dt.getDate()-day);
  return dt;
}

function weeklyBuckets(predicate, weeksBack){
  const thisMonday = startOfWeek(new Date());
  const buckets = [];
  for(let i=weeksBack-1;i>=0;i--){
    const start = new Date(thisMonday); start.setDate(start.getDate()-i*7);
    const end = new Date(start); end.setDate(end.getDate()+7);
    buckets.push({start, end, count:0});
  }
  calls.forEach(k=>{
    if(!k.data) return;
    if(predicate && !predicate(k)) return;
    const d = new Date(k.data+'T00:00:00');
    const b = buckets.find(b=> d>=b.start && d<b.end);
    if(b) b.count++;
  });
  return buckets;
}

function weekLabel(d){ return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`; }

// Attributi per rendere cliccabile una colonna: level e' il livello di dettaglio da
// aprire ({kind:'year'|'month'|'week'|'day', ...}), chartType 'calls' o 'appt'.
function drillAttrs(level, chartType){
  return ` class="bar-clickable" data-drill="${esc(JSON.stringify(level))}" data-chart-type="${chartType||''}" style="cursor:pointer;"`;
}
// Area di tocco invisibile su tutta la striscia della colonna (barra + etichette):
// le colonne sottili (es. 31 giorni su iPhone) restano facili da toccare.
function hitArea(i, gap, padL, padT, h, attrs){
  return `<rect x="${(padL+i*gap).toFixed(1)}" y="${padT}" width="${gap.toFixed(1)}" height="${h-padT}" fill="transparent"${attrs}></rect>`;
}

function barChartSVG(buckets, color, chartType){
  const w=640, h=190, padL=8, padR=8, padT=18, padB=26;
  const innerW=w-padL-padR, innerH=h-padT-padB;
  const max = Math.max(1, ...buckets.map(b=>b.count));
  const n = buckets.length;
  const gap = innerW/n;
  const bw = Math.min(34, gap*0.55);
  let bars='';
  buckets.forEach((b,i)=>{
    const bh = (b.count/max)*innerH;
    const x = padL + i*gap + (gap-bw)/2;
    const y = padT + innerH - bh;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(bh,1).toFixed(1)}" rx="3" fill="${color}"></rect>`;
    if(b.count>0) bars += `<text x="${(x+bw/2).toFixed(1)}" y="${(y-6).toFixed(1)}" text-anchor="middle" font-size="11" fill="var(--text)" font-family="var(--sans)" style="pointer-events:none;">${b.count}</text>`;
    bars += `<text x="${(x+bw/2).toFixed(1)}" y="${h-8}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="var(--sans)" style="pointer-events:none;">${weekLabel(b.start)}</text>`;
    if(chartType) bars += hitArea(i, gap, padL, padT, h, drillAttrs({ kind:'week', start:b.start.toISOString() }, chartType));
  });
  const baseline = `<line x1="${padL}" y1="${padT+innerH}" x2="${w-padR}" y2="${padT+innerH}" stroke="var(--border)" stroke-width="1"/>`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;max-width:640px;">${baseline}${bars}</svg>`;
}

// Conteggio per giorno: days = array di Date (una colonna per giorno).
function dailyBuckets(days, predicate, labelFn){
  const buckets = days.map(d=>({ date:d, count:0, label: labelFn ? labelFn(d) : '' }));
  calls.forEach(k=>{
    if(!k.data) return;
    if(predicate && !predicate(k)) return;
    const d = new Date(k.data+'T00:00:00');
    const b = buckets.find(bb=>bb.date.toDateString()===d.toDateString());
    if(b) b.count++;
  });
  return buckets;
}
function dailyBucketsForWeek(weekStart, predicate){
  const dayNames=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
  const days = [...Array(7)].map((_,i)=>{ const d=new Date(weekStart); d.setDate(d.getDate()+i); return d; });
  return dailyBuckets(days, predicate, d=>dayNames[(d.getDay()+6)%7]);
}
function dailyBucketsForMonth(year, month, predicate){
  const n = new Date(year, month+1, 0).getDate();
  const days = [...Array(n)].map((_,i)=>new Date(year, month, i+1));
  return dailyBuckets(days, predicate, null);
}

// Colonne per giorno. compact (vista mese, fino a 31 colonne): solo il numero del giorno.
function dayBarChartSVG(buckets, color, compact){
  const w=640, h=190, padL=8, padR=8, padT=18, padB=compact ? 22 : 34;
  const innerW=w-padL-padR, innerH=h-padT-padB;
  const max = Math.max(1, ...buckets.map(b=>b.count));
  const n = buckets.length;
  const gap = innerW/n;
  const bw = compact ? Math.min(14, gap*0.65) : Math.min(46, gap*0.55);
  let bars='';
  buckets.forEach((b,i)=>{
    const bh = (b.count/max)*innerH;
    const x = padL + i*gap + (gap-bw)/2;
    const y = padT + innerH - bh;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(bh,1).toFixed(1)}" rx="${compact?2:3}" fill="${color}"></rect>`;
    if(b.count>0) bars += `<text x="${(x+bw/2).toFixed(1)}" y="${(y-6).toFixed(1)}" text-anchor="middle" font-size="${compact?10:11}" fill="var(--text)" font-family="var(--sans)" style="pointer-events:none;">${b.count}</text>`;
    if(compact){
      bars += `<text x="${(x+bw/2).toFixed(1)}" y="${h-8}" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="var(--sans)" style="pointer-events:none;">${b.date.getDate()}</text>`;
    }else{
      bars += `<text x="${(x+bw/2).toFixed(1)}" y="${h-20}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="var(--sans)" style="pointer-events:none;">${b.label}</text>`;
      bars += `<text x="${(x+bw/2).toFixed(1)}" y="${h-8}" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="var(--sans)" style="pointer-events:none;">${weekLabel(b.date)}</text>`;
    }
    bars += hitArea(i, gap, padL, padT, h, drillAttrs({ kind:'day', day:b.date.toDateString() }));
  });
  const baseline = `<line x1="${padL}" y1="${padT+innerH}" x2="${w-padR}" y2="${padT+innerH}" stroke="var(--border)" stroke-width="1"/>`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;max-width:640px;">${baseline}${bars}</svg>`;
}

function monthlyBuckets(predicate, monthsBack, year){
  const now = new Date();
  const buckets = [];
  if(year!==undefined){ for(let m=0;m<12;m++) buckets.push({ year, month:m, count:0 }); }   // i 12 mesi di un anno
  else for(let i=monthsBack-1;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    buckets.push({year:d.getFullYear(), month:d.getMonth(), count:0});
  }
  calls.forEach(k=>{
    if(!k.data) return;
    if(predicate && !predicate(k)) return;
    const d = new Date(k.data+'T00:00:00');
    const b = buckets.find(bb=>bb.year===d.getFullYear() && bb.month===d.getMonth());
    if(b) b.count++;
  });
  return buckets;
}

function yearlyBuckets(predicate, yearsBack){
  const now = new Date();
  const buckets = [];
  for(let i=yearsBack-1;i>=0;i--){ buckets.push({year: now.getFullYear()-i, count:0}); }
  calls.forEach(k=>{
    if(!k.data) return;
    if(predicate && !predicate(k)) return;
    const y = parseInt(k.data.slice(0,4),10);
    const b = buckets.find(bb=>bb.year===y);
    if(b) b.count++;
  });
  return buckets;
}

const MONTHS_LONG = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];

// Dettaglio a livelli: dashboardDrilldown = { type:'calls'|'appt', stack:[livelli] }.
// Ogni clic su una colonna aggiunge un livello (anno -> mese -> giorno, oppure
// settimana -> giorno); "Indietro" ne toglie uno, e dall'ultimo torna alla dashboard.
function drillCallsList(list){
  const byId = Object.fromEntries(contacts.map(c=>[c.id,c]));
  return list.length ? list.map(k=>{
    const c = byId[k.contactId]||{};
    return `<div class="call-item" data-appt-call-id="${k.id}" style="cursor:pointer;">
      <span class="date">${fmtDate(k.data)}</span> ${esitoCell(k)}
      <div style="font-weight:600;font-size:14px;margin-top:4px;">${esc(fullName(c))}</div>
      ${k.progetto?`<div style="font-size:13px;color:var(--muted);">${esc(k.progetto)}</div>`:''}
    </div>`;
  }).join('') : '<div class="empty">Nessuna voce in questo periodo.</div>';
}
function dashboardDrilldownView(){
  const isAppt = dashboardDrilldown.type==='appt';
  const pred = isAppt ? isApptCall : null;
  const color = isAppt ? 'var(--text)' : 'var(--accent)';
  const what = isAppt ? 'Appuntamenti fissati' : 'Chiamate effettuate';
  const lvl = dashboardDrilldown.stack[dashboardDrilldown.stack.length-1];
  const back = `<div class="top-actions" style="justify-content:space-between;">
    <button class="btn secondary small" id="drillBackBtn">← ${dashboardDrilldown.stack.length>1 ? 'Indietro' : 'Torna alla dashboard'}</button>
  </div>`;
  if(lvl.kind==='year'){
    const buckets = monthlyBuckets(pred, 12, lvl.year);
    const total = buckets.reduce((s,b)=>s+b.count,0);
    return back + `<div class="card">
      <h3>${what} — ${lvl.year}</h3>
      <div style="font-size:12.5px;color:var(--muted);margin-bottom:10px;">Totale: ${total} · clicca un mese per il dettaglio</div>
      ${simpleBarChartSVG(buckets, color, b=>MONTHS_SHORT[b.month], b=>({ kind:'month', year:b.year, month:b.month }), dashboardDrilldown.type)}
    </div>`;
  }
  if(lvl.kind==='month'){
    const buckets = dailyBucketsForMonth(lvl.year, lvl.month, pred);
    const total = buckets.reduce((s,b)=>s+b.count,0);
    const prefix = `${lvl.year}-${String(lvl.month+1).padStart(2,'0')}`;
    const list = calls.filter(k=>k.data && k.data.startsWith(prefix) && (!pred || pred(k))).sort((a,b)=>a.data.localeCompare(b.data));
    return back + `<div class="card">
      <h3>${what} — ${MONTHS_LONG[lvl.month]} ${lvl.year}</h3>
      <div style="font-size:12.5px;color:var(--muted);margin-bottom:10px;">Totale: ${total} · clicca un giorno per l'elenco</div>
      ${dayBarChartSVG(buckets, color, true)}
    </div>
    <div class="card">
      <h3>Elenco del mese (${list.length})</h3>
      ${drillCallsList(list)}
    </div>`;
  }
  if(lvl.kind==='week'){
    const weekStart = new Date(lvl.start);
    const weekEndDisplay = new Date(weekStart); weekEndDisplay.setDate(weekEndDisplay.getDate()+6);
    const buckets = dailyBucketsForWeek(weekStart, pred);
    const total = buckets.reduce((s,b)=>s+b.count,0);
    return back + `<div class="card">
      <h3>${what} — settimana ${weekLabel(weekStart)} – ${weekLabel(weekEndDisplay)}</h3>
      <div style="font-size:12.5px;color:var(--muted);margin-bottom:10px;">Totale: ${total} in questa settimana · clicca un giorno per l'elenco</div>
      ${dayBarChartSVG(buckets, color, false)}
    </div>`;
  }
  // giorno
  const dayDate = new Date(lvl.day);
  const list = calls.filter(k=>k.data && (!pred || pred(k)) && new Date(k.data+'T00:00:00').toDateString()===dayDate.toDateString());
  return back + `<div class="card">
    <h3>${what} — ${fmtLongDate(lvl.day)}</h3>
    <div style="font-size:12.5px;color:var(--muted);margin-bottom:12px;">${list.length} in totale</div>
    ${drillCallsList(list)}
  </div>`;
}

function apptCalendarView(){
  const byId = Object.fromEntries(contacts.map(c=>[c.id,c]));
  const base = new Date();
  base.setDate(base.getDate() + apptWeekOffset*7);
  const monday = startOfWeek(base);
  const days = [...Array(7)].map((_,i)=>{ const d=new Date(monday); d.setDate(d.getDate()+i); return d; });
  const todayStr = new Date().toDateString();
  const dayNames = ['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
  const list = apptCalls();
  const fmtRange = `${String(days[0].getDate()).padStart(2,'0')}/${String(days[0].getMonth()+1).padStart(2,'0')} – ${String(days[6].getDate()).padStart(2,'0')}/${String(days[6].getMonth()+1).padStart(2,'0')}/${days[6].getFullYear()}`;
  const cols = days.map((d,i)=>{
    const dayAppts = list.filter(k=>{ const kd=new Date(k.appuntamento); return kd.toDateString()===d.toDateString(); });
    return `<div class="calendar-day">
      <div class="calendar-day-head ${d.toDateString()===todayStr?'today':''}">${dayNames[i]} ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}</div>
      <div class="calendar-day-appts">${dayAppts.map(k=>{ const c=byId[k.contactId]||{}; const t=new Date(k.appuntamento); const hh=String(t.getHours()).padStart(2,'0'), mm=String(t.getMinutes()).padStart(2,'0');
        return `<div class="appt-chip" data-appt-call-id="${k.id}"><span class="t">${hh}:${mm}</span> ${esc(fullName(c))}</div>`;
      }).join('') || ''}</div>
    </div>`;
  }).join('');
  return `
    <div class="week-nav">
      <button class="btn secondary small" id="weekPrevBtn">← Settimana prec.</button>
      <div class="week-label">${fmtRange}</div>
      <div style="display:flex;gap:8px;">
        <button class="btn secondary small" id="weekTodayBtn">Oggi</button>
        <button class="btn secondary small" id="weekNextBtn">Settimana succ. →</button>
      </div>
    </div>
    <div class="table-wrap"><div class="calendar-grid">${cols}</div></div>`;
}

function agendaView(){
  const now = new Date();
  const todayStr = now.toDateString();
  const byId = Object.fromEntries(contacts.map(c=>[c.id,c]));
  const todayAppts = apptCalls().filter(k=> new Date(k.appuntamento).toDateString()===todayStr).sort((a,b)=>a.appuntamento.localeCompare(b.appuntamento));
  const dueFU = contacts.filter(c=>c.followUp && new Date(c.followUp)<=now).sort((a,b)=>a.followUp.localeCompare(b.followUp));
  const todayFU = contacts.filter(c=>c.followUp && new Date(c.followUp)>now && new Date(c.followUp).toDateString()===todayStr).sort((a,b)=>a.followUp.localeCompare(b.followUp));
  const fuList = [...dueFU, ...todayFU];
  const dayNames=['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
  const monthNames=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
  const todayLabel = `${dayNames[now.getDay()]} ${now.getDate()} ${monthNames[now.getMonth()]}`;

  const apptHtml = todayAppts.length ? todayAppts.map(k=>{
    const c = byId[k.contactId]||{};
    const t = new Date(k.appuntamento);
    const hh=String(t.getHours()).padStart(2,'0'), mm=String(t.getMinutes()).padStart(2,'0');
    return `<div class="day-appt-row" data-appt-call-id="${k.id}" style="flex-direction:column;align-items:stretch;margin-bottom:8px;">
      <span><span style="font-family:var(--mono);">${hh}:${mm}</span> — ${esc(fullName(c))}${k.progetto?' · '+esc(k.progetto):''}</span>
      ${fullAddress(c)?`<a href="${mapsUrl(c)}" target="_blank" rel="noopener" class="addr-link" onclick="event.stopPropagation()" style="font-size:11.5px;">${esc(fullAddress(c))} · Indicazioni</a>`:''}
    </div>`;
  }).join('') : '<div class="empty">Nessun appuntamento oggi.</div>';

  const fuHtml = fuList.length ? fuList.map(c=>{
    const due = new Date(c.followUp) <= now;
    const time = (c.followUp.split('T')[1]||'').slice(0,5);
    return `<div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:8px;">
      <div data-contact-id="${c.id}" style="cursor:pointer;flex:1 1 200px;min-width:0;">
        <div class="name-link" style="font-weight:600;font-size:15px;">${esc(fullName(c))}</div>
        <div style="font-size:12.5px;color:var(--muted);margin-top:2px;">${esc(c.professione||'')}${c.professione&&c.azienda?' · ':''}${esc(c.azienda||'')}</div>
        ${phoneLinks(c,'font-size:12.5px;')}
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="followup ${due?'due':'ok'}">${time}${due && (new Date(c.followUp)).toDateString()!==todayStr?' · scaduto':''}</span>
        <button class="btn small" data-fu-id="${c.id}">Follow-up effettuato</button>
      </div>
    </div>`;
  }).join('') : '<div class="empty">Nessun follow-up per oggi.</div>';

  return `
    <h2 style="margin-bottom:4px;">Agenda</h2>
    <div style="color:var(--muted);font-size:13px;margin-bottom:18px;">${todayLabel}</div>
    <div class="card">
      <h3>Appuntamenti di oggi (${todayAppts.length})</h3>
      ${apptHtml}
    </div>
    <div class="card">
      <h3>Follow-up da fare${dueFU.length?` (${dueFU.length} scaduti)`:''}</h3>
      ${fuHtml}
    </div>`;
}

function followupView(){
  const withFU = contacts.filter(c=>c.followUp).sort((a,b)=>a.followUp.localeCompare(b.followUp));
  if(withFU.length===0) return '<div class="empty">Nessun follow-up programmato al momento.</div>';
  const groups = {};
  withFU.forEach(c=>{
    const day = c.followUp.split('T')[0];
    (groups[day]=groups[day]||[]).push(c);
  });
  const days = Object.keys(groups).sort();
  const todayStr = todayISO();
  const dayGroupsHtml = days.map(day=>{
    const isPast = day < todayStr;
    const isToday = day === todayStr;
    const rows = groups[day].map(c=>{
      const due = new Date(c.followUp) <= new Date();
      const time = (c.followUp.split('T')[1]||'').slice(0,5);
      return `<div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;">
        <div>
          <div class="name-link" data-contact-id="${c.id}" style="font-weight:600;font-size:15px;">${esc(fullName(c))}</div>
          <div style="font-size:12.5px;color:var(--muted);margin-top:2px;">${esc(c.professione||'')}${c.professione&&c.azienda?' · ':''}${esc(c.azienda||'')}</div>
          ${phoneLinks(c,'font-size:12.5px;')}
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <span class="followup ${due?'due':'ok'}">${time}</span>
          <button class="btn small" data-fu-id="${c.id}">Follow-up effettuato</button>
        </div>
      </div>`;
    }).join('');
    return `<div class="day-group">
      <div class="day-title" style="${isPast?'color:var(--danger);':''}">${fmtLongDate(day)}${isToday?' · oggi':''}${isPast?' · scaduto':''}</div>
      ${rows}
    </div>`;
  }).join('');
  return `<h2 style="margin-bottom:16px;">Follow-up da effettuare (${withFU.length})</h2>${dayGroupsHtml}`;
}

async function saveQuickCall(){
  const data = document.getElementById('qcData').value;
  const esito = document.getElementById('qcEsito').value;
  const progetto = document.getElementById('qcProgetto').value.trim();
  const note = document.getElementById('qcNote').value.trim();
  const appuntamento = document.getElementById('qcApptCheck').checked ? combineDT(document.getElementById('qcApptDate').value, document.getElementById('qcApptTime').value) : '';
  const followUp = combineDT(document.getElementById('qcFollowUpDate').value, document.getElementById('qcFollowUpTime').value);
  if(!data){ alert('Inserisci la data.'); return; }
  try{
    await db.collection('calls').add({ contactId: selectedId, data, esito, note, progetto, appuntamento, createdAt: Date.now() });
    await db.collection('contacts').doc(selectedId).update({ followUp: followUp||'' });
    selectedId=null; callStep='pick'; renderCallFlow();
  }catch(e){ alert('Errore nel salvataggio: '+(e.message||e.code||'')); }
}

function tableView(){
  const byId = Object.fromEntries(contacts.map(c=>[c.id,c]));

  if(calls.length===0) return `<h2>Tabella chiamate</h2>${filterBar}<div class="empty">Nessuna chiamata registrata.</div>`;
  const q = tableFilters.search.trim().toLowerCase();
  const filtered = calls.filter(k=>{
    const c = byId[k.contactId] || {};
    if(tableFilters.esito && k.esito!==tableFilters.esito) return false;
    if(tableFilters.professione && c.professione!==tableFilters.professione) return false;
    if(q){
      const hay = `${k.note||''} ${k.progetto||''} ${fullName(c)}`.toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  if(filtered.length===0) return `<h2>Tabella chiamate</h2>${filterBar}<div class="empty">Nessuna chiamata trovata con questi filtri.</div>`;
  const groups = {};
  filtered.forEach(k=>{ (groups[k.data]=groups[k.data]||[]).push(k); });
  const days = Object.keys(groups).sort((a,b)=>b.localeCompare(a));
  return `<h2>Tabella chiamate</h2>${filterBar}` + days.map(d=>{
    const rows = groups[d].map(k=>{

// Numero cliccabile: su telefono apre l'app Telefono con il numero pronto.
function telLink(tel, style, label){
  if(!tel) return '';
  return `<a href="tel:${esc(String(tel).replace(/[^\d+]/g,''))}" class="addr-link tel-link" onclick="event.stopPropagation()"${style?` style="${style}"`:''}>${label||'Tel'} ${esc(formatPhone(tel))}</a>`;
}
// Cellulare e telefono dello studio. Se c'e' solo il vecchio campo "telefono"
// (contatti salvati prima del campo cellulare) resta etichettato "Tel".
function phoneLinks(c, style){
  return [
    c.cellulare ? telLink(c.cellulare, style, 'Cell') : '',
    c.telefono ? telLink(c.telefono, style, c.cellulare ? 'Tel studio' : 'Tel') : ''
  ].filter(Boolean).join(' · ');
}

// Studio/attivita' come entita': contatti con lo stesso nome di studio (ignorando
// maiuscole, spazi e punteggiatura) appartengono allo stesso studio. Nome, via,
// citta' e telefono dello studio si ricavano dai contatti che ne fanno parte.
function normStudio(s){ return String(s||'').toLowerCase().replace(/[.,;'"]/g,' ').replace(/\s+/g,' ').trim(); }
function studioIndex(excludeId){
  const map = new Map();
  contacts.forEach(c=>{
    const key = normStudio(c.azienda);
    if(!key || c.id===excludeId) return;
    let s = map.get(key);
    if(!s){ s = { key, name: c.azienda.trim(), via:'', citta:'', telefono:'', members:[] }; map.set(key, s); }
    s.members.push(c);
    if(!s.via && c.via) s.via = c.via;
    if(!s.citta && c.citta) s.citta = c.citta;
    if(!s.telefono && c.telefono) s.telefono = c.telefono;
  });
  return [...map.values()].map(s=>({ ...s, name: bestStudioName(s.members.map(m=>m.azienda)) }));
}
// Telefoni confrontati solo per cifre: la formattazione puo' differire.
function sameStudioVal(f, a, b){
  return f==='telefono' ? String(a||'').replace(/\D/g,'')===String(b||'').replace(/\D/g,'') : (a||'')===(b||'');
}
// Grafia da usare per uno studio: prima quelle con maiuscole "normali" (non tutto
// minuscolo ne' tutto maiuscolo), poi la piu' frequente, poi senza doppi spazi o
// punteggiatura finale.
function bestStudioName(names){
  const counts = new Map();
  names.map(n=>String(n||'').trim()).filter(Boolean).forEach(n=>counts.set(n, (counts.get(n)||0)+1));
  const score = (n, c)=> (/[A-Z]/.test(n) && n!==n.toUpperCase() ? 1000 : 0) + c*10 + (/\s{2}|[.,;]$/.test(n) ? 0 : 1);
  const best = [...counts.entries()].sort((a,b)=>score(b[0],b[1])-score(a[0],a[1]))[0];
  return best ? best[0] : '';
}
function findStudio(name, excludeId){
  const key = normStudio(name);
  return key ? (studioIndex(excludeId).find(s=>s.key===key) || null) : null;
}
function studioColleaguesHtml(c){
  const s = findStudio(c.azienda, c.id);
  if(!s) return '';
  const list = [...s.members].sort((a,b)=>fullName(a).localeCompare(fullName(b)));
  return `<div class="card">
    <h3>Altri contatti di ${esc(s.name)} (${list.length})</h3>
    ${list.map(o=>`<div class="mini-row" data-contact-id="${o.id}"><span class="name-link">${esc(fullName(o))}</span>${o.professione?` <span style="color:var(--muted);">· ${esc(o.professione)}</span>`:''}</div>`).join('')}
  </div>`;
}
function bindStudioAutocomplete(){
  const input = document.getElementById('fAzienda');
  const list = document.getElementById('fAziendaList');
  const editingId = (window.__editing||{}).id;
  let matches = [];
  const close = ()=>{ list.classList.add('hidden'); list.innerHTML=''; };
  const pick = (s)=>{
    input.value = s.name;
    if(s.via) document.getElementById('fVia').value = s.via;
    if(s.citta) document.getElementById('fCitta').value = s.citta;
    if(s.telefono) document.getElementById('fTel').value = s.telefono;
    close();
  };
  const render = ()=>{
    const q = normStudio(input.value);
    if(!q){ close(); return; }
    matches = studioIndex(editingId)
      .filter(s=>s.key.includes(q) && !(s.key===q && s.name===input.value.trim()))
      .sort((a,b)=>(a.key.startsWith(q)?0:1)-(b.key.startsWith(q)?0:1) || a.name.localeCompare(b.name))
      .slice(0,6);
    if(!matches.length){ close(); return; }
    list.innerHTML = matches.map((s,i)=>{
      const where = [s.via, s.citta].filter(Boolean).join(', ');
      const who = s.members.map(fullName).slice(0,3).join(', ') + (s.members.length>3 ? ` e altri ${s.members.length-3}` : '');
      return `<div class="ac-item" data-i="${i}"><div class="ac-name">${esc(s.name)}</div><div class="ac-sub">${esc([where, who].filter(Boolean).join(' · '))}</div></div>`;
    }).join('');
    list.classList.remove('hidden');
  };
  // pointerdown (non click): scatta prima che il campo perda il focus, anche al tocco su iPhone.
  list.addEventListener('pointerdown', e=>{
    const item = e.target.closest('.ac-item');
    if(!item) return;
    e.preventDefault();
    pick(matches[+item.dataset.i]);
  });
  input.addEventListener('input', render);
  input.addEventListener('focus', render);
  input.addEventListener('blur', ()=>setTimeout(close, 150));
  input.addEventListener('keydown', e=>{ if(e.key==='Escape') close(); });
}
function formatPhone(v){
  const digits = String(v||'').replace(/\D/g,'');
  return digits.length<=3 ? digits : digits.slice(0,3)+' '+digits.slice(3);
}
