[build]
  publish = "."
  functions = "netlify/functions"
  command = "true"

[build.environment]
  # La apiKey web di Firebase in crm-chiamate-standalone.html (FIREBASE_CONFIG) e'
  # pubblica per progetto: identifica il progetto ma non da' accesso ai dati, protetti
  # da login Firebase e regole Firestore. La "smart detection" dei segreti di Netlify
  # la scambia per una chiave segreta e fa fallire la build: la si esclude qui.
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyBOA1oZUMLONDDAddWQ5P3tWEZz5GLdmWI"

[functions]
  node_bundler = "esbuild"

# La radice del sito apre direttamente l'app.
[[redirects]]
  from = "/"
  to = "/crm-chiamate-standalone.html"
  status = 301

# File del repository che non devono essere serviti pubblicamente
# (la versione Claude Artifact è solo di riferimento e qui non funziona).
[[redirects]]
  from = "/crm-chiamate.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/firestore.rules"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/storage.rules"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404"
  status = 404
  force = true

# Sorgente delle functions (non l'endpoint, che è sotto /.netlify/functions/).
[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true

# Controlli automatici (solo per lo sviluppo, non servono sul sito).
[[redirects]]
  from = "/tests/*"
  to = "/404"
  status = 404
  force = true
